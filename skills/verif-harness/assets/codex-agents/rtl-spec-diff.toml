BEHAVIOR_DRIFT, REFMODEL_DRIFT, and UPSTREAM_DRIFT. Cite exact file:line locations on
both sides. Do not decide which conflicting source is correct. Put claims requiring
more RTL inspection under Follow-up needed.
"""
