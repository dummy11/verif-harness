[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verif-harness"
version = "3.0.0"
description = "Versioned ASIC verification control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
verif-harness = "verif_harness.cli:main"

[tool.setuptools]
packages = ["verif_harness"]
include-package-data = true

[tool.setuptools.package-data]
verif_harness = ["*.html", "*.js", "vendor/**/*"]
