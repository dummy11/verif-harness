<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="verif-token" content="__VERIF_DASHBOARD_TOKEN__">
  <title>verif-harness · 验证项目看板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb; --panel: #ffffff; --panel-2: #f8fafc; --text: #172033;
      --muted: #637083; --line: #dfe5ee; --brand: #195fb8; --brand-2: #eaf3ff;
      --green: #147a4b; --green-bg: #eaf8f1; --red: #b4232f; --red-bg: #fff0f1;

      --blue: #175cd3; --blue-bg: #eaf2ff; --purple: #6941c6; --purple-bg: #f3efff;
      --gray: #596579; --gray-bg: #eef1f5; --shadow: 0 16px 42px rgba(31, 42, 55, .08);
      --sidebar-bg: #f8f9fa; --topbar-bg: #ffffff;
      --radius: 14px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #101215; --panel: #202328; --panel-2: #292d34; --text: #f2f4f7;
      --muted: #a6adb8; --line: #3a3f47; --brand: #72a6ff; --brand-2: #303a4b;
      --green: #64b6a5; --green-bg: #263d39; --red: #e67973; --red-bg: #472b2c;
      --yellow: #eead35; --yellow-bg: #44361d; --orange: #eea064; --orange-bg: #463222;
      --blue: #84adff; --blue-bg: #303a4b; --purple: #c4adff; --purple-bg: #352958;
      --gray: #a6adb8; --gray-bg: #30343b; --shadow: 0 18px 46px rgba(0, 0, 0, .18);
      --sidebar-bg: #1c1f23; --topbar-bg: #23262b;
    }
    * { box-sizing: border-box; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .topbar { position: sticky; top: 0; z-index: 20; height: 76px; display: flex; align-items: center; gap: 16px; padding: 0 24px 0 0; border-bottom: 1px solid var(--line); background: var(--topbar-bg); }
    .brand { width: 252px; height: 100%; display: flex; flex: 0 0 252px; align-items: center; gap: 11px; min-width: 0; padding: 0 20px; border-right: 1px solid var(--line); background: var(--sidebar-bg); }
    .logo { width: 36px; height: 36px; display: grid; flex: 0 0 auto; place-items: center; padding: 0; border: 0; border-radius: 10px; color: var(--brand); background: transparent; transition: transform .15s ease; }
    .logo svg { width: 31px; height: 31px; }
    .logo:hover { transform: translateY(-1px); }
    .logo:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 3px; }
    .brand strong { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .brand small { display: block; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .project-controls { display: flex; align-items: center; gap: 7px; }
    .project-switcher { min-width: 210px; max-width: 320px; padding: 9px 34px 9px 11px; border: 1px solid var(--line); border-radius: 9px; color: var(--text); background: var(--panel-2); }
    .project-unregister { white-space: nowrap; }
    .search { flex: 1; max-width: 620px; position: relative; }
    .search input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel-2); outline: none; }
    .search span { position: absolute; left: 13px; top: 9px; color: var(--muted); }
    .connection { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #98a2b3; }
    .dot.live { background: #22a663; box-shadow: 0 0 0 4px rgba(34,166,99,.12); }
    .dot.offline { background: #e5484d; }
    .icon-btn { border: 1px solid var(--line); color: var(--text); background: var(--panel); border-radius: 9px; padding: 8px 10px; }
    .layout { min-height: calc(100vh - 76px); display: grid; grid-template-columns: 252px minmax(0, 1fr); }
    .sidebar { border-right: 1px solid var(--line); background: var(--sidebar-bg); padding: 22px 14px; }
    .sidebar-head { display: flex; align-items: center; min-height: 29px; margin-bottom: 4px; }
    .nav-label { padding: 0 12px 8px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .nav-label.workstream-label { margin-top: 18px; }
    .sidebar-toggle { width: 28px; height: 28px; display: grid; place-items: center; margin: -5px 4px 0 auto; padding: 0; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: transparent; }
    .sidebar-toggle:hover { color: var(--text); background: var(--panel-2); }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid transparent; border-radius: 10px; color: var(--muted); background: transparent; text-align: left; }
    .nav-item:hover { background: var(--panel-2); }
    .nav-item.active { border-color: color-mix(in srgb, var(--brand) 22%, var(--line)); color: var(--text); background: var(--brand-2); box-shadow: inset 3px 0 0 var(--brand); font-weight: 700; }
    .nav-glyph { width: 25px; flex: 0 0 auto; color: var(--brand); font-size: 19px; line-height: 1; text-align: center; }
    .nav-count { min-width: 22px; display: grid; place-items: center; margin-left: auto; padding: 2px 6px; border-radius: 99px; color: var(--yellow); background: var(--yellow-bg); font-size: 11px; font-weight: 800; }
    .nav-item .nav-code { width: 52px; color: var(--brand); font-size: 12px; font-weight: 800; }
    .nav-item .nav-state { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }

      .layout.sidebar-collapsed { grid-template-columns: 76px minmax(0, 1fr); }
      body.sidebar-collapsed .brand { width: 76px; flex-basis: 76px; justify-content: center; padding-inline: 10px; }
      body.sidebar-collapsed .brand > div { display: none; }
      .layout.sidebar-collapsed .sidebar { padding-inline: 9px; }
      .layout.sidebar-collapsed .sidebar-head { justify-content: center; }
      .layout.sidebar-collapsed .nav-label { display: none; }

      .layout.sidebar-collapsed .nav-item .nav-code { width: auto; font-size: 12px; text-align: center; }
      .layout.sidebar-collapsed .nav-name, .layout.sidebar-collapsed .nav-state, .layout.sidebar-collapsed .nav-count { display: none; }
    }
    .sidebar-foot { margin-top: 26px; padding: 14px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    main { min-width: 0; padding: 28px clamp(18px, 3vw, 42px) 64px; }
    a.nav-item, a.node-link, a.btn, a.ws-card, a.logo { text-decoration: none; }
    a.ws-card { color: inherit; }
    .route-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; color: var(--muted); font-size: 12px; }
    .route-bar .open-separate { margin-left: auto; }
    .draft-notice { margin-bottom: 14px; }
    .page-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
    .page-head h1 { margin: 0 0 5px; font-size: clamp(23px, 2vw, 31px); line-height: 1.25; }
    .page-head p { margin: 0; color: var(--muted); max-width: 850px; }
    .page-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn { border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; color: var(--text); background: var(--panel); font-weight: 650; }
    .btn:hover { border-color: var(--brand); }
    .btn.primary { color: white; background: #195fb8; border-color: #195fb8; }
    .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
    .btn.small { padding: 6px 9px; font-size: 12px; }
    .grid { display: grid; gap: 16px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .metric { padding: 17px 18px; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 3px; font-size: 25px; font-weight: 780; }
    .metric .hint { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .section { margin-top: 20px; }
    .section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .section-head .count { color: var(--muted); }
    .section-head .spacer { margin-left: auto; }
    .workstream-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .ws-card { min-width: 0; min-height: 270px; display: flex; flex-direction: column; padding: 18px; cursor: pointer; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
    .ws-card:hover, .ws-card:focus-visible { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); background: var(--panel-2); outline: none; }
    .overview-main { min-width: 0; }
    .project-status-card { overflow: hidden; padding: 18px 20px 0; }
    .project-status-label { margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; }
    .project-status-head { display: flex; align-items: center; gap: 12px; }
    .project-status-head h1, .project-status-head h2 { margin: 0; font-size: 21px; line-height: 1.3; }
    .project-status-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; margin-left: auto; }
    .project-status-progress { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .project-status-progress strong { color: var(--text); }
    .project-status-next { margin: 14px -20px 0; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); background: var(--panel-2); }
    .project-status-next strong { color: var(--text); }
    .pending-status-list { margin: 16px -20px 0; border-top: 1px solid var(--line); }
    .pending-status-list .list-row { padding: 16px 20px; }
    .pending-status-card .project-status-next { margin-top: 0; }
    .status-card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .state-dot { width: 13px; height: 13px; border: 3px solid var(--panel); border-radius: 50%; background: var(--gray); box-shadow: 0 0 0 2px var(--gray-bg); }
    .state-dot.RUNNING { background: var(--blue); box-shadow: 0 0 0 2px var(--blue-bg); animation: waiting-breathe 1.8s ease-in-out infinite; }
    .state-dot.WAITING_FOR_PARENT { background: var(--purple); box-shadow: 0 0 0 2px var(--purple-bg); animation: waiting-breathe 1.8s ease-in-out infinite; }
    .state-dot.WAITING_FOR_HUMAN { background: var(--yellow); box-shadow: 0 0 0 2px var(--yellow-bg); animation: waiting-breathe 1.8s ease-in-out infinite; }
    .state-dot.FAILED { background: var(--red); box-shadow: 0 0 0 2px var(--red-bg); }
    .state-dot.COMPLETED { background: var(--green); box-shadow: 0 0 0 2px var(--green-bg); }
    @keyframes waiting-breathe { 50% { opacity: .35; } }
    .ws-title { display: flex; align-items: flex-start; gap: 10px; }
    .ws-title-copy { min-width: 0; }
    .ws-title-copy small { display: block; color: var(--brand); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .ws-title-copy strong { display: block; margin-top: 2px; font-size: 16px; }
    .ws-title .badge { margin-left: auto; }
    .ws-objective { min-height: 36px; margin: 9px 0 0; color: var(--muted); font-size: 12px; }
    .ws-meter { --meter-color: var(--brand); position: relative; width: 112px; height: 112px; display: grid; place-items: center; margin: 9px auto 4px; border-radius: 50%; background: conic-gradient(from 225deg, var(--meter-color) calc(var(--value) * 2.7deg), var(--gray-bg) 0deg 270deg, transparent 270deg); }
    .ws-meter::before { content: ''; position: absolute; width: 80px; height: 80px; border-radius: 50%; background: var(--panel); }
    .ws-meter::after { content: ''; position: absolute; right: -2px; bottom: -2px; left: -2px; height: 40px; background: var(--panel); }
    .ws-card:hover .ws-meter::before, .ws-card:hover .ws-meter::after, .ws-card:focus-visible .ws-meter::before, .ws-card:focus-visible .ws-meter::after { background: var(--panel-2); }
    .ws-meter strong { position: relative; z-index: 1; margin-top: -2px; font-size: 21px; }
    .ws-meter span { position: absolute; z-index: 2; bottom: 13px; color: var(--muted); font-size: 10px; }
    .ws-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .ws-foot span:last-child { margin-left: auto; white-space: nowrap; }
    .progress-ring { --progress: 0; position: relative; flex: 0 0 auto; width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--motion-color, var(--blue)) calc(var(--progress) * 1%), var(--gray-bg) 0); }
    .progress-ring::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--panel); }
    .progress-ring span { position: relative; color: var(--text); font-size: 12px; font-weight: 800; }
    .progress-ring.small { width: 46px; height: 46px; }
    .progress-ring.small::before { inset: 6px; }
    .progress-ring.small span { font-size: 10px; }
    [data-motion="active"] { --motion-color: var(--blue); --motion-period: 2.6s; }
    [data-motion="waiting"] { --motion-color: var(--yellow); --motion-period: 3.4s; }
    .status-pulse { display: inline-block; flex: 0 0 auto; width: 7px; height: 7px; margin-right: 7px; vertical-align: middle; border-radius: 50%; color: var(--motion-color); background: currentColor; animation: status-breathe var(--motion-period) ease-in-out infinite; }
    .ws-meter:is([data-motion="active"], [data-motion="waiting"]),
    .progress-ring:is([data-motion="active"], [data-motion="waiting"]),
    .node-progress-bar:is([data-motion="active"], [data-motion="waiting"]) { animation: progress-breathe var(--motion-period) ease-in-out infinite; }
    @keyframes status-breathe { 0%, 100% { opacity: .6; box-shadow: 0 0 0 0 transparent; } 50% { opacity: 1; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent); } }
    @keyframes progress-breathe { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--motion-color) 22%, transparent); } }
    .planning-indicator { display: flex; align-items: center; justify-content: center; gap: 5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 3px 8px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .VALID, .SATISFIED, .BASELINED, .COMPLETED, .RESOLVED, .CLOSED, .SUPPORTED, .APPROVED { color: var(--green); background: var(--green-bg); }
    .RUNNING, .ACTIVE, .AGENT_CHECKING { color: var(--blue); background: var(--blue-bg); }
    .WAITING_FOR_PARENT { color: var(--purple); background: var(--purple-bg); }
    .INVALID, .FAILED, .NOT_SUPPORTED { color: var(--red); background: var(--red-bg); }
    .STALE, .REVALIDATION_REQUIRED, .PARTIALLY_STALE, .EXPIRED, .SUPERSEDED { color: var(--orange); background: var(--orange-bg); }
    .REVIEW_REQUIRED, .PROVISIONAL, .REVIEW, .REVISE, .WAITING_FOR_HUMAN, .OPEN, .BLOCKED, .HUMAN_REVIEW_REQUIRED, .NOT_SATISFIED, .CHANGES_REQUESTED { color: var(--yellow); background: var(--yellow-bg); }
    .WAIVED { color: var(--purple); background: var(--purple-bg); }
    .UNKNOWN, .PENDING, .RECORDED, .CANCELLED, .IDLE { color: var(--gray); background: var(--gray-bg); }
    .two-col { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); align-items: start; }
    .agent-session { padding: 19px 20px; border-left: 4px solid var(--blue); box-shadow: var(--shadow); }
    .agent-section { margin-top: 28px; }

    .agent-session-meta span { padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--panel-2); font-size: 12px; }
    .agent-priority { overflow: hidden; border: 2px solid color-mix(in srgb, var(--yellow) 58%, var(--line)); border-left: 6px solid var(--yellow); box-shadow: 0 14px 34px color-mix(in srgb, var(--yellow) 15%, transparent); }
    .agent-priority .agent-panel-head { padding-block: 18px; background: color-mix(in srgb, var(--yellow-bg) 82%, var(--panel)); }
    .agent-priority .agent-panel-head h2 { font-size: 19px; }

    .agent-priority-clear-copy { min-width: 0; }

    .agent-priority-clear-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .agent-priority-clear > .badge { margin-left: auto; }
    .agent-workspace { grid-template-columns: minmax(0, 1fr) minmax(280px, 350px); align-items: start; }
    .agent-main, .agent-side { min-width: 0; }
    .agent-side { display: grid; gap: 16px; }

    .agent-event.completed .agent-event-dot { background: var(--green); box-shadow: 0 0 0 4px var(--green-bg); }

    .agent-question-card { padding: 15px; border: 1px solid color-mix(in srgb, var(--yellow) 45%, var(--line)); border-radius: 11px; background: color-mix(in srgb, var(--yellow-bg) 38%, var(--panel)); }

    function nodeDocumentLabel(n) {

    function nodeRows(nodes) {
      const query = state.query.toLowerCase();
      const byParent = new Map();
      nodes.forEach(n => { const key = n.parent_id || ''; if (!byParent.has(key)) byParent.set(key, []); byParent.get(key).push(n); });
      const ordered = [], visited = new Set();
      function visit(node, visible=true) {
        if (visited.has(node.id)) return;
        visited.add(node.id);
        if (visible) ordered.push(node);
        (byParent.get(node.id) || []).forEach(child => visit(child, visible && (!state.collapsedNodes.has(node.id) || Boolean(query))));
      }
      const nodeIds = new Set(nodes.map(n => n.id));
      nodes.filter(n => !n.parent_id || !nodeIds.has(n.parent_id)).forEach(n => visit(n));
      nodes.forEach(n => visit(n));
      const filtered = ordered.filter(n => !query || `${n.id} ${n.title} ${n.status} ${n.key} ${n.statement || ''} ${nodeDocumentLabel(n)}`.toLowerCase().includes(query));
      if (!filtered.length) return '<tr><td colspan="4" class="empty">没有匹配的节点</td></tr>';

        const children = byParent.get(n.id) || [];

        return `<tr><td><div class="work-node-name">${toggle}<div class="work-node-copy"><button class="node-link" data-open-node="${escapeHtml(n.id)}">${escapeHtml(humanText(n.title))}</button>${document}</div></div></td><td><div>${escapeHtml(nodeRoleLabel(n))}</div><div class="row-meta">${n.required ? '计划要求完成' : '补充工作'}</div></td><td>${nodeProgressHtml(n)}</td><td>${nodeStatusHtml(n)}${approval}</td></tr>`;
      }).join('');

    function writingPlanSources(n) {
      // Older plans retain their original file identities and approval digests.
      // Only this read-only list is condensed; documents retain their full paths.
      const project = state.snapshot?.project || {};
      const normalize = value => {
        const parts = String(value).replaceAll('\\', '/').split('/');
        const result = [];
        for (const part of parts) {
          if (part === '.' || !part) continue;
          if (part === '..' && result.length && result.at(-1) !== '..') result.pop();
          else result.push(part);
        }
        return (String(value).startsWith('/') ? '/' : '') + result.join('/');
      };
      const absolute = value => normalize(String(value).startsWith('/') || !project.root ? value : `${project.root}/${value}`);
      const isRtlFile = value => /\.(?:svh?|vh?|vhdl?)$/i.test(value);
      const isDocument = value => /\.(?:md|rst|txt|pdf|docx?|html?|xlsx?|adoc)$/i.test(value);
      const isCode = value => /\.(?:svh?|vh?|vhdl?|c|cc|cpp|cxx|h|hpp|py|sh|bash|tcl|pl|rb|js|ts|f|mk|cmake|json|ya?ml|toml)$/i.test(value) || /(?:^|\/)(?:Makefile|CMakeLists\.txt)$/.test(value);
      const parent = value => value.includes('/') ? value.slice(0, value.lastIndexOf('/')) || '/' : '.';
      const inputs = project.verification_inputs || {};
      const groups = {
        rtl:['RTL ', project.rtl_roots || []],
        'verification-testbench':['验证环境', [inputs.testbench_root]],
        'reference-model-implementation':['参考模型', [inputs.reference_model]],
        'verification-script':['验证脚本', inputs.scripts || []],
      };
      const sources = new Map((n.authoring_contract?.source_snapshot || []).map(item => [absolute(item.path), item.kind]));
      const result = (n.source_refs || []).map(ref => {
        if (/^(?:RTL |验证环境|参考模型|验证脚本|代码)目录：/.test(ref)) return ref;
        if (ref.startsWith('gap:')) return null; // Listed under pending source questions, not inputs.
        const path = ref.replace(/^file:/, '').split('#')[0];
        const kind = sources.get(absolute(path));
        if (isDocument(path) || (kind && !groups[kind]) || (!kind && !isCode(path))) return ref;
        const full = absolute(path);
        const [label, values] = groups[kind] || (isRtlFile(path) ? groups.rtl : ['代码', []]);
        const roots = values.filter(Boolean).map(value => { const path = absolute(value); return isCode(path) ? parent(path) : path; });
        let directory = roots.find(root => full === root || full.startsWith(root + '/')) || parent(full);
        const base = normalize(project.root || '');
        if (base && directory.startsWith(base + '/')) directory = directory.slice(base.length + 1);
        if (base && directory === base) directory = '.';
        return `${label}目录：${directory}`;
      }).filter(Boolean);
      return [...new Set(result)];
    }

          : 'VDOC 的文档撰写方案需要逐项审批。请打开每个方案节点处理；全部批准后才可以开始正文工作。'
        : '批准后仅表示允许 Agent 按下列目标、工作节点、交付内容和完成条件开始工作。';
      const planName = w.workstream === 'VDOC' ? '文档撰写方案' : `${workstreamLabel(w.workstream)}方案`;
      const catalogNote = w.workstream === 'VDOC' ? '不作为文档撰写方案节点计数' : '不作为方案工作节点计数';
      const objectHeading = w.workstream === 'VDOC' && vdocPlan.needsRefinement
        ? '当前方案状态'
        : `本次审批对象：${planName}`;
      const boundary = w.workstream === 'VDOC' && vdocPlan.needsRefinement
        ? '当前不能审批，也不表示八个固定文档目录已经成为方案节点。'
        : `这一步审批的是${planName}，不是已经完成的内容。`;
      return `<section class="section"><div class="section-head"><h2>${escapeHtml(objectHeading)}</h2><span class="count">方案 ${escapeHtml(revisionLabel(w.revision))}</span></div><div class="notice"><strong>${escapeHtml(boundary)}</strong> ${escapeHtml(vdocNotice)} 不表示文档正文、实现结果、仿真结果或工作节点已经通过验收。</div><div class="card"><dl class="kv"><dt>工作流</dt><dd>${escapeHtml(w.workstream)} · ${escapeHtml(workstreamLabel(w.workstream))}</dd><dt>总体目标</dt><dd>${escapeHtml(humanText(w.objective || '未登记总体目标'))}</dd><dt>方案版本</dt><dd>${escapeHtml(revisionLabel(w.revision))}</dd></dl></div><div class="section-head"><h2>这份方案包含的工作节点</h2><span class="count">${planNodes.length} 项</span></div>${nodes}${documentOutputs ? `<details class="detail-group"><summary>查看文档交付分类（${catalogNote}）</summary><div class="detail-group-body card"><ul>${documentOutputs}</ul></div></details>` : ''}<div class="section-head"><h2>这份方案何时完成</h2></div><div class="card"><ul class="exit-list">${planListHtml(w.exit_criteria, '尚未登记完成条件')}</ul></div></section>`;
    }

    }

    function bindReviewOutcomeFields(form, defaultTarget='') {
      const verdict = form.querySelector('[name="verdict"]');
      const changeFields = form.querySelector('[data-review-change-fields]');
      const provisionalFields = form.querySelector('[data-review-provisional-fields]');
      const impact = form.querySelector('[data-review-impact-preview]');
      const bindRemove = () => form.querySelectorAll('[data-remove-review-change]').forEach(button => {
        button.onclick = () => {
          const items = form.querySelectorAll('[data-review-change-item]');
          if (items.length === 1) {
            items[0].querySelector('[data-change-instruction]').value = '';
            return;
          }
          button.closest('[data-review-change-item]').remove();
        };
      });
      const refresh = () => {
        const selected = verdict.value;
        if (changeFields) changeFields.hidden = selected !== 'modify';
        if (provisionalFields) provisionalFields.hidden = selected !== 'provisional';
        form.querySelectorAll('[data-change-target],[data-change-instruction]').forEach(input => input.required = selected === 'modify');
        form.querySelectorAll('[name="provisional_owner"],[name="review_trigger"]').forEach(input => input.required = selected === 'provisional');
        impact.textContent = selected === 'approve'
          ? '通过只认可当前版本，不修改方案或正文；Agent 将检查下一步是否可以继续。'
          : selected === 'modify'
            ? '提交后生成结构化变更要求；Agent 将分析建议、版本变化和受影响的下游工作。'
            : selected === 'clarify'
              ? '提交后等待 Agent 给出说明；只有出现新的负责人问题时，节点才进入“等待你回答”。'
              : selected === 'provisional'
                ? '相关工作可以带条件继续，但本节点不计为正式完成。'
                : '当前版本不会继续作为已接受依据；Agent 将检查返工或重新规划范围。';
      };
      const add = form.querySelector('[data-add-review-change]');
      if (add) add.onclick = () => {
        form.querySelector('[data-review-change-list]').insertAdjacentHTML('beforeend', reviewChangeItemHtml(defaultTarget));
        bindRemove();
        refresh();
      };
      verdict.onchange = refresh;
      bindRemove();
      refresh();
    }

    function collectReviewChangeItems(form) {
      if (form.querySelector('[name="verdict"]').value !== 'modify') return [];
      return [...form.querySelectorAll('[data-review-change-item]')].map(item => ({
        operation: item.querySelector('[data-change-operation]').value,
        target: item.querySelector('[data-change-target]').value.trim(),
        instruction: item.querySelector('[data-change-instruction]').value.trim(),
      }));
    }

    function reviewChangeHistoryHtml(items) {
      if (!(items || []).length) return '';
      const labels = {add:'要求新增', modify:'要求修改', delete:'要求删除'};
      return `<ul>${items.map(item => `<li><strong>${escapeHtml(labels[item.operation] || item.operation)}</strong> ${escapeHtml(item.target)}：${escapeHtml(item.instruction)}</li>`).join('')}</ul>`;
    }

    function reviewFeedbackHistoryHtml(items) {
      if (!(items || []).length) return '';
      const status = items.some(item => item.status === 'DRAFT') ? '等待提交给 Agent'
        : items.some(item => item.status === 'WAITING_FOR_HUMAN') ? 'Agent 等待你回答'
          : items.some(item => item.status === 'PENDING') ? '等待 Agent 处理'
            : items.some(item => item.status === 'SUPERSEDED') ? '已由新版本取代'
            : 'Agent 已处理';
      const resolution = [...new Set(items.map(item => item.resolution).filter(Boolean))].join('；');
      return `<div class="row-meta">${escapeHtml(status)}${resolution ? ` · ${escapeHtml(resolution)}` : ''}</div>`;
    }

    function planReviewVerdictLabel(item) {
      const operations = [...new Set((item.change_items || []).map(change => change.operation))];
      if (item.verdict === 'MODIFY' && operations.length === 1) {
        return {add:'新增', modify:'修改', delete:'删除'}[operations[0]] || '修改';
      }
      return {APPROVE:'批准', MODIFY:'要求修改', CLARIFY:'要求说明', REJECT:'不同意', PROVISIONAL:'暂定接受'}[item.verdict] || item.verdict;
    }

    function planReviewFormHtml(n) {
      if (!n.plan_review && !n.delivery_review) return '';
      const attribute = n.delivery_review ? 'id="delivery-review-form" data-delivery-opinion-form' : 'data-plan-section-form="writing-plan"';
      const processing = nodeFeedbackState(n).processing_count > 0;
      const disabled = processing ? 'disabled' : '';
      const notice = processing ? '<div class="notice">上一批审批意见正在由 Agent 处理；请先查看修改结果，再继续添加意见。</div>' : '';
      return `<form ${attribute}>${notice}<div class="field"><label>审批类型</label><select name="verdict" ${disabled}><option value="add">新增</option><option value="delete">删除</option><option value="modify">修改</option></select></div><div class="field"><label>审批人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required ${disabled}></div><div class="field"><label>审批内容</label><textarea name="reason" required ${disabled}></textarea></div><div class="modal-actions"><button class="btn primary" ${disabled}>添加审批意见</button></div></form>`;
    }

    function nodeFeedbackState(n) {
      return n.plan_review?.feedback || n.delivery_review?.feedback || {
        draft_count:0, processing_count:0, waiting_for_human_count:0,
        unresolved_count:0, can_approve:true,
      };
    }

    function reviewFeedbackSubmitButtonHtml(n) {
      const feedback = nodeFeedbackState(n);
      const label = feedback.draft_count
        ? `提交当前 ${feedback.draft_count} 条审批意见给 Agent`
        : feedback.processing_count
          ? `已提交 ${feedback.processing_count} 条，等待 Agent 处理`
          : '提交当前 0 条审批意见给 Agent';
      const title = feedback.draft_count
        ? '一次性提交当前节点尚未处理的审批意见；提交后由 Main Agent 分析并修改内容'
        : feedback.processing_count
          ? '本轮审批意见已经提交，等待 Main Agent 完成修改并登记处理结果'
          : '当前没有需要提交给 Agent 的审批意见';
      return `<button type="button" class="btn" data-submit-node-feedback ${feedback.draft_count ? '' : 'disabled'} title="${escapeHtml(title)}">${escapeHtml(label)}</button>`;
    }

    function planReviewHistoryHtml(n) {
      const sectionTitles = {
        'writing-plan':isCodeNode(n) ? codeNodeObjectLabel(n) : '文档撰写方案',
        'human-confirmations':'额外待确认的工程问题',
        'planned-content':'计划写入的具体内容',
        'inputs-scope-deliverable':'输入依据、范围和交付对象',
        'dependencies-impact':'依赖和影响',
      };
      const items = (n.plan_review?.reviews || []).concat((n.plan_review?.completion_reviews || []).map(review => ({...review, section:'completion'})))
        .sort((left, right) => String(right.created_at || '').localeCompare(String(left.created_at || '')));
      return items.map(item => `<div class="list-row"><div><strong>${escapeHtml(item.section === 'completion' ? '审批完成' : `${sectionTitles[item.section] || item.section} · ${planReviewVerdictLabel(item)}`)}</strong><div class="row-meta">${escapeHtml(item.reviewer)} · ${escapeHtml(item.reason)} · ${shortTime(item.created_at)}</div>${reviewChangeHistoryHtml(item.change_items)}${reviewFeedbackHistoryHtml(item.feedback_items)}</div></div>`).join('') || '<div class="empty">尚无审批历史记录</div>';
    }

    function nodePlanApprovalPanelHtml(n, available) {
      if (!n.plan_review) return '';
      const objectLabel = isCodeNode(n) ? codeNodeObjectLabel(n) : '文档撰写方案';
      const body = available
        ? `${planReviewFormHtml(n)}<section class="section"><div class="section-head"><h2>审批历史记录</h2></div><div class="card list-card">${planReviewHistoryHtml(n)}</div></section>`
        : `<div class="notice"><strong>当前还不能批准。</strong> ${escapeHtml((n.plan_review.blockers || ['Agent 需要先补齐当前 DUT 的文档工作分解']).join('；'))}</div>${isCodeNode(n) ? `${planReviewFormHtml(n)}<section><h2>审批历史记录</h2>${planReviewHistoryHtml(n)}</section>` : ''}`;
      const feedback = nodeFeedbackState(n);
      const canComplete = available && !n.plan_review.completed && feedback.can_approve;
      const completionLabel = n.plan_review.completed ? '已批准全部内容' : available || isCodeNode(n) ? '批准全部内容' : '方案待补齐';
      const completionTitle = n.plan_review.completed
        ? '当前方案的全部内容已批准；提交新的审批意见后需要重新审批'
        : feedback.unresolved_count ? '当前审批意见尚未由 Agent 处理完成，不能批准未修改的内容'
        : available ? '批准当前文档撰写方案的全部内容，无需先提交新增、删除或修改意见'
        : 'Agent 需要先补齐当前 DUT 的文档撰写方案';
      return `<div class="plan-approval-controls"><details class="detail-group node-plan-approval"><summary>审批${objectLabel}</summary><div class="detail-group-body">${body}</div></details><div class="modal-actions">${reviewFeedbackSubmitButtonHtml(n)}<button type="button" class="btn primary" id="node-plan-complete" ${canComplete ? '' : 'disabled'} title="${escapeHtml(isCodeNode(n) ? objectLabel : completionTitle)}">${completionLabel}</button></div></div>`;
    }

    function planApprovalAvailable(n) {
      if (isCodeNode(n)) return Boolean(n.plan_review?.can_approve);
      return Boolean(n?.role === 'document-writing-plan' && n.plan_review && workstream(n.workstream))
        && !vdocPlanReviewState(workstream(n.workstream)).needsRefinement;
    }

    function documentWritingPlanNodeHtml(n, available) {
      return `${nodeRolePanelHtml(n)}${nodePlanApprovalPanelHtml(n, available)}`;
    }

    const CODE_PLAN_ROLES = ['code-plan','coverage-implementation-plan','coverage-convergence-plan','regression-infrastructure-plan','regression-results-plan'];
    const CODE_DELIVERY_ROLES = ['code-deliverable','coverage-implementation-deliverable','coverage-convergence-deliverable','regression-infrastructure-deliverable','regression-results-deliverable'];
    function isCodePlanNode(n) { return Boolean(n && CODE_PLAN_ROLES.includes(n.role)); }
    function isCodeNode(n) { return isCodePlanNode(n) || Boolean(n && CODE_DELIVERY_ROLES.includes(n.role)); }
    function isCoverageConvergenceNode(n) {
      return n?.workstream === 'VCOV' && (String(n.role).startsWith('coverage-convergence-')
        || (n.capabilities || []).some(claim => ['coverage-collection-evidence','hole-analysis-evidence'].includes(claim)));
    }
    function regressionNodeStage(n) {
      if (n?.workstream !== 'VREG') return null;
      if (String(n.role).startsWith('regression-infrastructure-')) return 'infrastructure';
      if (String(n.role).startsWith('regression-results-')) return 'results';
      const claims = n.capabilities || [];
      if (claims.length === 2 && ['regression-policy','executor-ready'].every(claim => claims.includes(claim))) return 'infrastructure';
      if (claims.length === 3 && ['execution-evidence','triage-evidence','fresh-evidence'].every(claim => claims.includes(claim))) return 'results';
      return null;
    }
    function isResultFileNode(n) { return isCoverageConvergenceNode(n) || regressionNodeStage(n) === 'results'; }
    function codeNodeObjectLabel(n) {
      const plan = isCodePlanNode(n);
      if (n?.workstream === 'VCOV') {
        if (String(n.role).startsWith('coverage-')) return roleLabel(n.role);
        return isCoverageConvergenceNode(n) ? (plan ? '覆盖率收敛方案' : '覆盖率收敛交付')
          : (plan ? '覆盖率实现方案' : '覆盖率实现交付');
      }
      if (n?.workstream === 'VREG') {
        const stage = regressionNodeStage(n);
        if (String(n.role).startsWith('regression-')) return roleLabel(n.role);
        if (stage === 'infrastructure') return plan ? '回归基础设施方案' : '回归基础设施交付';
        if (stage === 'results') return plan ? '回归结果方案' : '回归结果交付';
        return plan ? '回归方案' : '回归交付';
      }
      return plan ? '代码实现方案' : '代码交付及验证证据';
    }
    function codeNodeHtml(n) {
      const validation = n.plan_review?.validation;
      const question = (n.agent_questions || []).find(q => q.status === 'OPEN');
      const fileButton = file => `<button class="node-link" data-code-file="${escapeHtml(JSON.stringify(file))}">${escapeHtml(file.path)}</button>`;
      const planBody = `<h3>${escapeHtml(codeNodeObjectLabel(n))}</h3><h4>目标</h4><p>${escapeHtml(n.statement)}</p>` + [
        ['工作范围','scope'],['具体工作','work_content'],['实现方式','implementation_approach'],
        ['如何验证','validation_methods'],['输出','deliverables'],['交付条件','acceptance_criteria'],
      ].map(([label, key]) => `<h4>${label}</h4><ul>${planListHtml(n[key])}</ul>`).join('')
        + (n.workstream === 'VCOV' && (n.coverage_item_ids || []).length
          ? `<h4>本方案必须实现的覆盖项</h4><ul>${planListHtml(n.coverage_item_ids)}</ul>` : '');
      const deliveryBody = `<h3>${escapeHtml(codeNodeObjectLabel(n))}</h3>${validation
        ? `<p>${escapeHtml(validation.summary)}</p><p>${validation.current && validation.ready ? 'Agent 已完成当前版本验证，等待负责人验收或查看批准记录。' : '当前验证未通过或证据已失效，不能批准。'}</p>
          <h4>${isResultFileNode(n) ? '交付文件' : '交付代码'}</h4><ul>${(validation.code_files || []).map(f => `<li>${fileButton(f)}</li>`).join('')}</ul>
          ${(validation.checks || []).map(c => `<section class="detail-card"><h4>${escapeHtml(c.criterion)}</h4><dl class="kv"><dt>检查方法</dt><dd>${escapeHtml(c.method)}</dd><dt>预期结果</dt><dd>${escapeHtml(c.expected)}</dd><dt>实际结果</dt><dd>${escapeHtml(c.actual)}</dd><dt>检查结论</dt><dd>${c.validation?.ready ? '通过' : '未通过'}</dd></dl></section>`).join('')}
          <details class="detail-group"><summary>查看验证证据</summary><div class="detail-group-body"><ul>${(validation.files || []).map(f => `<li>${fileButton(f)}</li>`).join('')}</ul></div></details>`
        : `<div class="notice">Agent 尚未提交${isCoverageConvergenceNode(n) ? '当前覆盖数据和缺口结论的检查报告' : regressionNodeStage(n) === 'results' ? '当前回归执行结果和失败处理的检查报告' : '当前代码版本的验证报告'}，暂不能验收。</div>`}`;
      return `${writingPlanSourcesHtml(n)}<section class="detail-block role-node-panel" data-node-role="${n.role}">${isCodePlanNode(n) ? planBody : deliveryBody}</section>${question ? `<p><button class="node-link" data-agent-question="${escapeHtml(question.id)}">Agent 需要你确认：${escapeHtml(question.prompt)}</button></p>` : ''}${nodePlanApprovalPanelHtml(n, planApprovalAvailable(n))}`;
    }
    async function showCodeFile(n, path, digest) {
      const project = state.project;
      try {
        const result = await approvalRequest(`/api/code-file?project=${encodeURIComponent(state.project)}&node=${encodeURIComponent(n.id)}&path=${encodeURIComponent(path)}&digest=${encodeURIComponent(digest)}`, {headers:{'X-Verif-Token':token}});
        if (state.project !== project || !findNode(n.id)) return;
        openModal(`<h2>${escapeHtml(path)}</h2><pre>${escapeHtml(result.content)}</pre><button class="btn" data-close-modal>关闭</button>`);
      } catch (error) { toast(String(error), true); }
    }
    function openCodeWorkflowChange(w, kind) {
      const title = {add:'添加节点',remove:'删除节点',restart:'重新启动工作流'}[kind];
      const nodes = w.nodes.filter(isCodePlanNode);
      openModal(`<h2>${title}</h2><p>${kind === 'restart' ? '确认后创建新的方案版本，旧交付文件、证据和审批历史保留，新版本需要重新审批。不会重启 Dashboard 或 Agent。' : '这里只登记下一版方案的变更要求；当前节点和历史不会被直接修改或删除。'}</p><form id="code-workflow-change"><div class="field"><label>操作人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div>${kind === 'remove' ? `<div class="field"><label>工作节点</label><select name="node" required>${nodes.map(n => `<option value="${escapeHtml(n.id)}">${escapeHtml(n.title)}</option>`).join('')}</select></div>` : ''}<div class="field"><label>${kind === 'restart' ? '重新启动原因' : '变更要求'}</label><textarea name="reason" required></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn primary">确认${title}</button></div></form>`);
      $('#code-workflow-change').onsubmit = async event => {
        event.preventDefault();
        const data = {...Object.fromEntries(new FormData(event.target)), workstream:w.workstream, kind, revision:w.revision, confirm:true};
        await post('/api/code/workflow-change', data, kind === 'restart' ? `${w.workstream} 已重新启动，等待 Agent 形成新方案` : '变更要求已保存，等待 Agent 形成下一版方案');
      };
    }

    function deliveryApprovalState(n) {
      const review = n.delivery_review || {};
      const feedback = nodeFeedbackState(n);
      const approved = review.current_review?.verdict === 'APPROVE';
      const pendingCheck = ['AGENT_CHECKING','WAITING_FOR_HUMAN'].includes(review.status);
      const w = workstream(n.workstream);
      const available = review.document_available && ['ACTIVE','PARTIALLY_STALE','SATISFIED'].includes(w?.lifecycle)
        && !vdocPlanReviewState(w).reviewPending && !vdocPlanReviewState(w).needsRefinement
        && !(review.acceptance_blockers || []).length
        && !(n.next_actions || []).some(a => a.kind === 'WAIT_FOR_DEPENDENCY')
        && !(w?.closure?.actions || []).some(a => a.kind === 'REFINE_DOCUMENT_DELIVERIES');
      return {
        enabled: available && !approved && !pendingCheck && feedback.can_approve,
        label: approved ? '已批准全部内容' : pendingCheck ? '等待 Agent 检查' : '批准全部内容',
        title: approved ? '本版本正文已批准；Agent 检查完成前不表示已验收通过'
          : pendingCheck ? '等待 Agent 完成本轮验收检查'
          : feedback.unresolved_count ? '当前审批意见尚未由 Agent 处理完成，不能批准未修改的正文'
          : available ? '批准当前节点对应的全部正文内容' : '请先同步正文并完成前置审批和待确认事项',
      };
    }

    function deliveryApprovalPanelHtml(n) {
      const approval = deliveryApprovalState(n);
      const history = (n.delivery_review.reviews || []).slice().reverse().map(item =>
        `<div class="list-row"><div><strong>${escapeHtml(item.verdict === 'APPROVE' ? '审批完成' : planReviewVerdictLabel(item))}</strong><div class="row-meta">${escapeHtml(item.reviewer)} · ${escapeHtml(item.notes || '')} · ${shortTime(item.created_at)}</div>${reviewChangeHistoryHtml(item.change_items)}${reviewFeedbackHistoryHtml(item.feedback_items)}${item.provisional ? `<div class="row-meta">责任人：${escapeHtml(item.provisional.owner)}；再次验收条件：${escapeHtml(item.provisional.review_trigger)}</div>` : ''}</div></div>`
      ).join('') || '<div class="empty">尚无审批历史记录</div>';
      const questions = (n.agent_questions || []).filter(q => q.status === 'OPEN');
      const confirmations = (n.human_actions || []).filter(a => a.status === 'OPEN');
      const documentItems = (n.document?.governance_items || []).filter(item => ['PENDING','ACTIVE'].includes(item.status) && ['human-decision','external-open-question'].includes(item.kind));
      const confirmationRows = confirmations.map(item => `<div class="detail-card"><strong>${escapeHtml(humanActionLabel(item.action))}</strong><p>${escapeHtml(item.reason)}</p><form data-delivery-confirmation="${escapeHtml(item.id)}"><div class="field"><label>处理人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>处理意见</label><textarea name="resolution" required></textarea></div><button class="btn primary">确认事项已处理</button></form></div>`).join('');
      const blockers = questions.length || confirmations.length || documentItems.length
        ? `<section class="section"><h3>当前需要你确认</h3>${questions.length ? agentQuestionCardsHtml(questions) : ''}${confirmationRows}${documentItems.length ? `<ul>${documentItems.map(item => `<li>${escapeHtml(documentItemLabel(item.kind))}：${escapeHtml(item.title)}</li>`).join('')}</ul><p>请与 Agent 确认上述事项；处理结果登记后才能批准正文。</p>` : ''}</section>` : '';
      return `<div class="plan-approval-controls"><details class="detail-group node-plan-approval"><summary>审批文档正文</summary><div class="detail-group-body">${planReviewFormHtml(n)}${blockers}<section class="section"><div class="section-head"><h2>审批历史记录</h2></div><div class="card list-card">${history}</div></section></div></details><div class="modal-actions">${reviewFeedbackSubmitButtonHtml(n)}<button type="button" class="btn primary" id="node-delivery-complete" ${approval.enabled ? '' : 'disabled'} title="${escapeHtml(approval.title)}">${approval.label}</button></div></div>`;
    }

    function documentDeliveryNodeHtml(n) {
      return `<section class="detail-block role-node-panel" data-node-role="document-deliverable"><h3>文档正文</h3><div class="detail-card"><dl class="kv"><dt>所属文档</dt><dd>${escapeHtml(humanText(n.document?.title || n.document_key))}</dd><dt>内容验收状态</dt><dd>${deliveryReviewStatusBadge(n.delivery_review.status, deliveryReviewIsRunning(n))}</dd><dt>文档路径</dt><dd class="mono">${escapeHtml(n.document?.path || n.delivery_review.document_path)}</dd></dl><div data-delivery-body class="document-node-body"><div class="empty">正在读取文档正文…</div></div>${writingPlanSourcesHtml(n)}<a class="node-link" data-view-delivery-document href="${escapeHtml(routeUrl({document:n.delivery_review.document_id}))}" target="_blank" rel="noopener">对照阅读文档 ↗</a></div></section>${deliveryApprovalPanelHtml(n)}`;
    }

    function bindDeliveryApproval(n, root) {
      root.querySelector('[data-view-delivery-document]').href = routeUrl({document:n.delivery_review.document_id}).toString();
      const complete = root.querySelector('#node-delivery-complete');
      if (complete && !complete.disabled) complete.onclick = () => openNodePlanCompletionModal(n);
      bindReviewFeedbackSubmit(n, root);
      const form = root.querySelector('[data-delivery-opinion-form]');
      form.onsubmit = async event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(form));
        rememberReviewer(values.reviewer);
        await post('/api/reviews/document-delivery', {
          node:n.id, definition_digest:n.delivery_review.definition_digest,
          document_digest:n.delivery_review.document_digest,
          verdict:'modify', reviewer:values.reviewer, notes:values.reason.trim(),
          change_items:[{operation:values.verdict,target:n.title,instruction:values.reason.trim()}],
        }, '审批意见已保存；请提交当前意见给 Agent');
      };
      root.querySelectorAll('[data-delivery-confirmation]').forEach(form => {
        form.onsubmit = async event => {
          event.preventDefault();
          const values = Object.fromEntries(new FormData(form));
          rememberReviewer(values.reviewer);
          await post('/api/human-actions/resolve', {
            id:form.dataset.deliveryConfirmation, ...values, status:'RESOLVED',
          }, '待确认事项已处理');
        };
      });
      bindNodeLinks();
    }

    async function loadDeliveryBody(n, root, sequence) {
      const project = state.project;
      const container = root.querySelector('[data-delivery-body]');
      root.querySelector('#node-delivery-complete').disabled = true;
      root.querySelector('[data-delivery-opinion-form] button').disabled = true;
      const current = () => sequence === renderSequence && state.project === project && root.contains(container);
      try {
        const body = await approvalRequest(`/api/document?project=${encodeURIComponent(project)}&selector=${encodeURIComponent(n.delivery_review.document_id)}`, {headers:{'X-Verif-Token':token}});
        if (!current()) return;
        // Never approve a different body from the one actually rendered.
        const matching = body.document.digest === n.delivery_review.document_digest && !body.document.content_changed;
        container.innerHTML = documentBodyHtml(body);
        root.querySelector('#node-delivery-complete').disabled = !matching || !deliveryApprovalState(n).enabled;
        root.querySelector('[data-delivery-opinion-form] button').disabled = (
          !matching || nodeFeedbackState(n).processing_count > 0
        );
        bindDocumentContent();
      } catch (error) {
        if (!current()) return;
        container.innerHTML = `<div class="notice">无法读取文档正文：${escapeHtml(error.message)}。请刷新节点后重试。</div>`;
        root.querySelector('#node-delivery-complete').disabled = true;
        root.querySelector('[data-delivery-opinion-form] button').disabled = true;
      }
    }


    function planSectionReviewPayload(n, section, sectionTitle, values) {
      const isChange = ['add','modify','delete'].includes(values.verdict);
      return {
        ...values,
        verdict: isChange ? 'modify' : values.verdict,
        change_items: isChange ? [{operation:values.verdict, target:sectionTitle, instruction:values.reason.trim()}] : [],
        node:n.id, section, definition_digest:n.plan_review.definition_digest,
      };
    }

    function bindReviewFeedbackSubmit(n, root=document) {
      const button = root.querySelector('[data-submit-node-feedback]');
      if (!button || button.disabled) return;
      button.onclick = async () => {
        if (button.dataset.pending === 'true') return;
        button.dataset.pending = 'true'; button.disabled = true;
        const original = button.textContent;
        button.textContent = '正在提交给 Agent…';
        const review = n.delivery_review || n.plan_review;
        await post('/api/reviews/node-feedback-submit', {
          node:n.id,
          definition_digest:review.definition_digest,
          document_digest:n.delivery_review?.document_digest || '',
        }, '当前审批意见已提交给 Agent');
        if (root.contains(button)) {
          delete button.dataset.pending;
          button.disabled = false;
          button.textContent = original;
        }
      };
    }

    function bindPlanSectionReviewForms(n, root=document) {
      root.querySelectorAll('[data-plan-section-form]').forEach(form => {
        const sectionTitle = n.title;
        form.onsubmit = async event => {
          event.preventDefault();
          const data = planSectionReviewPayload(n, form.dataset.planSectionForm, sectionTitle, Object.fromEntries(new FormData(event.target)));
          rememberReviewer(data.reviewer);
          await post('/api/reviews/node-plan-section', data, '审批意见已保存；请提交当前意见给 Agent');
        };
      });
      bindReviewFeedbackSubmit(n, root);
    }

    function openNodePlanCompletionModal(n) {
      const object = isCodeNode(n) ? codeNodeObjectLabel(n) : n.delivery_review ? '节点的文档正文' : '文档撰写方案';
      const boundary = n.delivery_review ? '提交后仍需 Agent 检查，检查完成前不表示已验收通过。' : '';
      openModal(`<h2>批准当前${object}</h2><p><strong>${escapeHtml(humanText(n.title))}</strong></p><div class="notice"><strong>确认后，批准当前${object}的全部内容。</strong> ${boundary}审批入口和审批历史会继续保留；之后提交新增、删除或修改意见时，本节点需要重新审批。</div><form id="node-plan-complete-form"><div class="field"><label>审批人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>批准说明（选填）</label><textarea name="reason" placeholder="可补充说明，也可以留空直接确认"></textarea></div><div class="notice" data-submit-status role="status" aria-live="polite" hidden></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button type="button" class="btn" data-refresh-approval hidden>刷新审批状态</button><button type="submit" class="btn primary">确认审批完成</button></div></form>`);
      $('#modal').dataset.planNode = n.id;
      $('#modal').dataset.scope = draftScope(null, n.id);
      $('#node-plan-complete-form').onsubmit = async event => {
        event.preventDefault();
        submittingForm = null;
        await submitNodePlanCompletion(event.target, n);
      };
    }

    async function approvalRequest(url, options={}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(url, {...options, signal:controller.signal});
        const body = await response.json();
        if (!response.ok) {
          const error = new Error(body.error || response.statusText);
          error.rejected = response.status >= 400 && response.status < 500;
          throw error;
        }
        return body;
      } finally { clearTimeout(timer); }
    }
    async function submitNodePlanCompletion(form, n) {
      if (form.dataset.submitted) return;
      const project = state.project, sequence = modalSequence;
      const current = () => state.project === project && modalSequence === sequence;
      const button = form.querySelector('[type="submit"]');
      const refresh = form.querySelector('[data-refresh-approval]');
      const notice = form.querySelector('[data-submit-status]');
      const show = text => { notice.hidden = false; notice.textContent = text; };
      const data = Object.fromEntries(new FormData(form));
      data.node = n.id; data.definition_digest = (n.delivery_review || n.plan_review).definition_digest;
      if (n.delivery_review) {
        data.document_digest = n.delivery_review.document_digest;
        data.verdict = 'approve'; data.notes = data.reason;
        delete data.reason;
      }
      data.dashboard_project = project; data.include_snapshot = false;
      rememberReviewer(data.reviewer);
      form.dataset.submitted = 'true'; form.dataset.pending = 'true';
      button.disabled = true; button.textContent = '正在提交…';
      form.setAttribute('aria-busy', 'true');
      form.querySelectorAll('input,textarea').forEach(field => field.readOnly = true);
      show('正在保存审批，请勿重复点击。');
      let saved = false;
      const refreshState = async () => {
        if (!current()) return;
        refresh.hidden = true; form.dataset.pending = 'true';
        show(saved ? '审批已保存，正在刷新页面状态…' : '正在核对审批记录，不会重复提交…');
        try {
          if (!saved) {
            const receipt = await approvalRequest(`/api/approval-status?project=${encodeURIComponent(project)}&node=${encodeURIComponent(n.id)}`, {headers:{'X-Verif-Token':token}});
            if (!current()) return;
            if (receipt.dashboard_project_id !== project || receipt.result?.node_id !== n.id) throw new Error('返回的审批对象与当前节点不一致');
            if (receipt.result.definition_digest !== data.definition_digest || (data.document_digest && receipt.result.document_digest !== data.document_digest)) throw new Error('节点或正文版本已变化，请返回节点列表核对当前版本');
            saved = receipt.result.current_review?.verdict === 'APPROVE';
            if (saved) button.textContent = '批准记录已保存';
            show(saved ? '已确认当前版本的批准记录已保存，正在刷新页面状态…' : '暂未查到当前版本的批准记录；不会自动重试提交，正在刷新页面状态…');
          }
          const snapshot = await approvalRequest(`/api/snapshot?project=${encodeURIComponent(project)}`, {headers:{'X-Verif-Token':token}});
          if (!current()) return;
          if (snapshot.dashboard_project_id !== project) throw new Error('返回的项目与当前项目不一致');
          setSnapshot(snapshot);
          closeModal(true);
          if (saved) await navigateUrl(routeUrl({workstream:n.workstream}), {replace:true});
          toast(saved ? '审批已保存，页面状态已刷新' : '已刷新，请查看当前节点的审批历史，确认上次提交结果');
        } catch (error) {
          if (current()) {
            show((saved ? '审批已保存，但页面状态暂未刷新。' : '尚未确认审批结果，请勿重复提交。') + '可以点击“刷新审批状态”重新读取。' + (error.name === 'AbortError' ? '读取超时。' : String(error)));
            refresh.hidden = false;
          }
        } finally { delete form.dataset.pending; form.removeAttribute('aria-busy'); }
      };
      refresh.onclick = refreshState;
      try {
        const endpoint = n.delivery_review ? '/api/reviews/document-delivery' : '/api/reviews/node-plan-complete';
        const body = await approvalRequest(endpoint, {method:'POST', headers:{'Content-Type':'application/json','X-Verif-Token':token}, body:JSON.stringify(data)});
        if (!current()) return;
        if (body.dashboard_project_id !== project || body.result?.node_id !== n.id || !body.result?.review_id) throw new Error('未收到当前节点的审批保存结果');
        saved = true; delete form.dataset.dirty;
        button.textContent = '审批已保存';
        await refreshState();
      } catch (error) {
        if (!current()) return;
        if (error.rejected) {
          show(`未提交审批：${error.message}`);
          delete form.dataset.submitted;
          button.disabled = $('#modal').dataset.stale === 'true'; button.textContent = '确认审批完成';
          form.querySelectorAll('input,textarea').forEach(field => field.readOnly = false);
        } else {
          show('暂未收到审批结果，可能已保存，请勿重复提交。请刷新审批状态核对。' + (error.name === 'AbortError' ? '请求超时。' : String(error)));
          button.textContent = '等待核对审批结果'; refresh.hidden = false;
        }
      } finally { delete form.dataset.pending; form.removeAttribute('aria-busy'); }
    }

        <section class="section"><div class="section-head"><h2>审批对象</h2>${planReviewStatusBadge(n.plan_review.status)}</div><div class="card"><dl class="kv"><dt>验证对象节点</dt><dd>${escapeHtml(humanText(n.title))}</dd><dt>节点类型</dt><dd>${escapeHtml(nodeRoleLabel(n))}</dd><dt>节点目标</dt><dd>${escapeHtml(humanText(n.statement || '未登记'))}</dd><dt>方案版本</dt><dd>${escapeHtml(revisionLabel(n.plan_review.revision))}</dd><dt>是否为计划要求</dt><dd>${n.required ? '是' : '否'}</dd></dl></div></section>
        ${nodePlanApprovalPanelHtml(n, true)}`;

      bindNodeLinks();

      if (complete && !complete.disabled) complete.onclick = () => openNodePlanCompletionModal(n);
    }

    function renderVdocRevisionRequest() {
      const w = workstream('VDOC');
      if (!w) { state.reviseVdocPlan = false; return renderOverview(); }
      state.workstream = 'VDOC';
      const documents = (w.nodes || []).filter(n => n.role === 'document-catalog' && n.document);
      const params = new URLSearchParams(window.location.search);
      const initialDocument = params.get('document-key') || documents[0]?.key || '';
      const initialType = params.get('node-type') || 'document-writing-plan';
      const initialNode = params.get('node-id') || '';
      const requestedKind = params.get('change-kind') || (initialNode ? 'modify' : 'add');
      const changeKind = ['add','remove','modify'].includes(requestedKind) ? requestedKind : 'add';
      const existingNodes = (w.nodes || []).filter(n => ['document-writing-plan','document-deliverable'].includes(n.role));
      const documentOptions = documents.map(n => `<option value="${escapeHtml(n.key)}" ${n.key === initialDocument ? 'selected' : ''}>${escapeHtml(humanText(n.title))}</option>`).join('');
      const nodeOptions = existingNodes.map(n => `<option value="${escapeHtml(n.id)}" ${n.id === initialNode ? 'selected' : ''}>${escapeHtml(humanText(n.title))} · ${escapeHtml(nodeRoleLabel(n))}</option>`).join('');
      const title = changeKind === 'add' ? '添加工作节点' : changeKind === 'remove' ? '删除工作节点' : '调整文档内容';
      const description = changeKind === 'add'
        ? '提交新增要求后，Agent 会分析它与当前 DUT、文档及已有节点的关系，并形成下一版文档撰写方案。'
        : changeKind === 'remove'
          ? '选择要移出的节点并说明原因；该节点只会从下一版方案中移出。'
          : '针对当前文档内容提交修改要求；Agent 会形成更新后的方案和变更说明。';
      const notice = changeKind === 'remove'
        ? '<strong>删除节点不会直接删除数据库记录或文档。</strong> 这是下一版移除请求；当前节点、审批、正文和历史记录都会保留。'
        : '<strong>这里提交的是变更请求，不会直接创建或修改工作节点。</strong> Agent 分析后形成新方案版本，仍需按节点审批。';
      const operationFields = changeKind === 'add'
        ? `<input type="hidden" name="change_kind" value="add"><div class="field"><label>1. 添加到哪一份验证文档</label><select name="document_key" required>${documentOptions}</select></div><div class="field"><label>2. 节点类型</label><select name="node_type"><option value="document-writing-plan">文档撰写方案</option><option value="document-deliverable">文档内容验收</option></select></div>`
        : `<input type="hidden" name="change_kind" value="${escapeHtml(changeKind)}"><div class="field"><label>1. ${changeKind === 'remove' ? '要从下一版移出的节点' : '要调整的节点'}</label><select name="node_id" required><option value="">请选择工作节点</option>${nodeOptions}</select>${existingNodes.length ? '' : '<div class="row-meta">当前没有可操作的文档工作节点</div>'}</div>`;
      const reasonLabel = changeKind === 'add' ? '3. 新节点要求' : '2. 原因和处理要求';
      const reasonPlaceholder = changeKind === 'add'
        ? '说明要验证或撰写什么、对应的 DUT/接口/验证点、预期交付内容和验收范围'
        : changeKind === 'remove'
          ? '说明为什么下一版不再需要该节点，以及对关联文档、节点和审批的影响'
          : '说明需要修改的正文、原因、验收范围和预期影响';
      const submitLabel = changeKind === 'add' ? '提交添加请求' : changeKind === 'remove' ? '提交删除请求' : '提交修改请求';
      $('#main').innerHTML = `<div class="page-head"><div><h1>${title}</h1><p>${description}</p></div><div class="page-actions"><button class="btn" data-return-vdoc>返回 VDOC</button></div></div>
        <section class="section"><div class="notice">${notice}</div><div class="card" style="padding:20px;max-width:820px"><form id="vdoc-revision-form">${operationFields}<div class="field"><label>${reasonLabel}</label><textarea name="reason" placeholder="${reasonPlaceholder}" required></textarea></div><div class="field"><label>提出人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="modal-actions"><button type="button" class="btn" data-return-vdoc>取消</button><button class="btn ${changeKind === 'remove' ? 'danger' : 'primary'}" ${changeKind !== 'add' && !existingNodes.length ? 'disabled' : ''}>${submitLabel}</button></div></form></div></section>`;
      document.querySelectorAll('[data-return-vdoc]').forEach(button => button.onclick = () => leaveVdocRevisionRequest('VDOC'));
      $('#vdoc-revision-form').onsubmit = async event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.target));
        const sourceNode = values.node_id ? findNode(values.node_id) : null;
        if (values.change_kind !== 'add' && !sourceNode) {
          toast('必须选择一项现有工作节点', true);
          return;
        }
        const documentKey = values.document_key || sourceNode?.document_key || '';
        const nodeType = values.node_type || sourceNode?.role || '';
        const selected = documents.find(n => n.key === documentKey);
        rememberReviewer(values.reviewer);
        await post('/api/human-actions', {
          target: values.node_id || 'VDOC', action: 'REQUEST_CHANGE', reviewer: values.reviewer,
          reason: values.reason,
          payload: {
            request_type: 'vdoc-node-revision',
            document_key: documentKey,
            document_path: selected?.document?.path || '',
            node_type: nodeType,
            source_node_id: values.node_id || null,
            change_kind: values.change_kind,
          },
        }, values.change_kind === 'add' ? '添加节点请求已保存' : values.change_kind === 'remove' ? '删除节点请求已保存；当前节点和历史仍保留' : '文档修改请求已保存', () => leaveVdocRevisionRequest('VDOC', false));
      };
    }

    function evidenceContractHtml(contract, evidence=[]) {

      const requirements = (contract.requirements || []).map(item => {
        if (typeof item === 'string') return `<li>${escapeHtml(item)}</li>`;
        const choices = (item.alternatives || []).map(choice =>
          `<span class="tag">${escapeHtml(artifactLabel(choice.kind))} · ${escapeHtml(analyzerLabel(choice.analyzer))}</span>`
        ).join(' <span class="muted">或</span> ');
        return `<li><strong>${escapeHtml(humanText(item.label || '需要的材料'))}</strong><div class="tag-row">${choices}</div></li>`;
      }).join('');
      const required = (contract.required || []).map(item => `<li>${escapeHtml(humanText(item))}</li>`).join('');

    }
    function closureAssessmentHtml(assessment) {

      const dependencyRows = (assessment.dependency_blockers || []).map(item =>
        `<li>${escapeHtml(humanText(item.title))} · ${statusBadge(item.status)}<details><summary>查看内部编号</summary><pre>${escapeHtml(item.id)}</pre></details></li>`

    function findNode(id) {
      for (const w of state.snapshot.workstreams) { const node = w.nodes.find(n => n.id === id); if (node) return node; }
      const raw = allNodes().find(n => n.id === id); if (!raw) return null;
      const evidence = state.snapshot.model.evidence.filter(e => e.subject === id), findings = state.snapshot.model.findings.filter(f => f.subject === id);
      return {...raw, evidence, findings, activities: state.snapshot.activities.filter(a => a.node_id === id), incoming: state.snapshot.model.edges.filter(e => e.target === id), outgoing: state.snapshot.model.edges.filter(e => e.source === id)};
    }
    function documentNodeHtml(document) {
      if (!document) return '';
      const pending = (document.governance_items || []).filter(item => ['PENDING','ACTIVE'].includes(item.status));
      const items = (document.governance_items || []).map(item => `<div class="list-row"><div><strong>${escapeHtml(item.title)}</strong><div class="row-meta">${escapeHtml(documentItemLabel(item.kind))}${item.anchor ? ` · ${escapeHtml(item.anchor)}` : ''}</div><details><summary>查看内部编号</summary><pre>${escapeHtml(item.id)}</pre></details></div>${statusBadge(item.status === 'PENDING' ? 'OPEN' : item.status)}</div>`).join('') || '<div class="empty">没有登记文档内事项</div>';
      const reviews = (document.reviews || []).slice().reverse().map(item => `<div class="list-row"><div><strong>${escapeHtml(item.verdict === 'APPROVE' ? '认可当前正文' : item.verdict === 'MODIFY' ? '要求修改' : item.verdict === 'CLARIFY' ? '要求说明' : '拒绝')}</strong><div class="row-meta">${escapeHtml(item.reviewer)} · ${escapeHtml(item.notes)} · ${shortTime(item.created_at)}</div></div></div>`).join('') || '<div class="empty">当前正文版本尚未评审</div>';
      const deliveries = (document.delivery_nodes || []).map(item => {
        const node = findNode(item.id);
        const state = node?.delivery_review?.status || 'PENDING';

          ? `${targetWorkstream.workstream} · ${workstreamLabel(targetWorkstream.workstream)}`
          : target === 'project' ? '整个验证项目' : humanText(target);
      openModal(`<h2>评论或要求调整</h2><p><strong>处理对象：${escapeHtml(targetLabel)}</strong></p><p>提交后会记录处理要求，但不会把这项工作直接标记为已完成。</p><form id="human-form"><input type="hidden" name="target" value="${escapeHtml(target)}"><div class="field"><label>要做什么</label><select name="action"><option value="COMMENT">补充评论</option><option value="REQUEST_CHANGE">要求修改</option><option value="CLARIFY">要求说明</option><option value="PRIORITIZE">调整优先级</option><option value="ACKNOWLEDGE">确认已阅</option></select></div><div class="field"><label>提出人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>说明</label><textarea name="reason" placeholder="说明判断、依据和希望如何处理" required></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn primary">保存意见</button></div></form>`);
      $('#human-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); rememberReviewer(data.reviewer); await post('/api/human-actions', data, '意见已保存'); };
    }
    function openNodeClosureReviewModal(n) {
      const a = n.closure_assessment;
      openModal(`<h2>确认工作节点判断</h2><p><strong>确认对象：${escapeHtml(humanText(n.title))}</strong></p><p>当前判断：${statusBadge(a.conclusion)}。选择认可只表示你同意系统对现有材料的解释，不会自动补充缺少的文档、日志、波形或覆盖率数据。</p><form id="node-closure-form"><div class="field"><label>确认结论</label><select name="verdict"><option value="approve">认可当前判断及依据</option><option value="modify">要求修改判断或补充材料</option><option value="clarify">要求进一步说明</option><option value="reject">当前判断不正确</option></select></div><div class="field"><label>确认人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>确认理由</label><textarea name="reason" placeholder="说明哪些材料支持这个结论，或哪里需要补充、修改" required></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn primary">提交确认</button></div></form>`);
      $('#node-closure-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.node = n.id; data.assessment_digest = a.digest; rememberReviewer(data.reviewer); await post('/api/reviews/node-closure', data, '节点完成判断评审已保存'); };
    }
    async function openDocumentReviewModal(document) {
      openModal('<h2>读取文档正文</h2><div class="empty">正在加载…</div>');
      const sequence = modalSequence, project = state.project;
      try {
        const response = await fetch(`/api/document?project=${encodeURIComponent(state.project)}&selector=${encodeURIComponent(document.id)}`, {headers:{'X-Verif-Token':token}});
        const body = await response.json();
        if (sequence !== modalSequence || project !== state.project) return;
        if (!response.ok) throw new Error(body.error || response.statusText);
        const current = body.document;
        const pending = (current.governance_items || []).filter(item => ['PENDING','ACTIVE'].includes(item.status) && ['human-decision','external-open-question'].includes(item.kind));
        const approveOption = pending.length ? '' : '<option value="approve">认可当前正文</option>';
        const pendingNotice = pending.length ? `<div class="notice"><strong>还不能评为通过。</strong> 文档仍有 ${pending.length} 个问题或工程决定待处理。</div>` : '';
        openModal(`<h2>评审文档正文</h2><p><strong>${escapeHtml(humanText(current.title || document.title || '当前文档'))}</strong> · 正文版本 ${current.semantic_revision}。请先阅读正文和待处理问题，再给出结论。</p><details><summary>查看文档内部信息</summary><div class="detail-group-body mono">${escapeHtml(current.path)}</div></details>${pendingNotice}${documentBodyHtml(body)}<form id="document-review-form"><div class="field"><label>结论</label><select name="verdict">${approveOption}<option value="modify">要求修改正文</option><option value="clarify">要求进一步说明</option><option value="reject">不同意当前正文</option></select></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>评审说明</label><textarea name="notes" placeholder="说明认可的范围，或明确需要修改、回答的问题" required></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn primary">提交文档评审</button></div></form>`);
        bindDocumentContent();
        $('#document-review-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.document = current.id; rememberReviewer(data.reviewer); await post('/api/reviews/document', data, '文档评审已保存'); };
      } catch (error) { if (sequence === modalSequence) { closeModal(true); toast(`读取文档失败：${error}`, true); } }
    }
    function openWaiveModal(n) {
      openModal(`<h2>接受当前未满足项</h2><p><strong>处理对象：${escapeHtml(humanText(n.title))}</strong></p><p>接受例外不等于验证通过。请确认风险、依据和影响；该操作会把这个工作节点标记为已接受例外。</p><form id="waive-form"><div class="field"><label>负责人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>理由和依据</label><textarea name="reason" required></textarea></div><div class="field"><label><input name="confirm" type="checkbox" style="width:auto" required> 我确认这是负责人作出的明确工程决定</label></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn danger">确认接受例外</button></div></form>`);
      $('#waive-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.node = n.id; data.confirm = true; rememberReviewer(data.reviewer); await post('/api/waive', data, '例外决定已记录'); };
    }
    async function post(path, data, success, afterSuccess=null) {
      const project = state.project, route = viewKey(), form = submittingForm, modal = modalSequence;
      submittingForm = null;
      const id = form && formId(form), values = form && JSON.stringify(fieldValues(form));
      try {
        data.dashboard_project = project;
        const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json','X-Verif-Token':token}, body:JSON.stringify(data)});
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || response.statusText);
        if (form && JSON.stringify(fieldValues(form)) === values) {
          delete form.dataset.dirty;
          const saved = viewCache.get(route);
          if (saved && id) delete saved.forms[id];
          if (route === renderedView) {
            for (const current of document.querySelectorAll('#main form, #drawer form')) {
              if (formId(current) === id && JSON.stringify(fieldValues(current)) === values) delete current.dataset.dirty;
            }
          }
        }
        if (state.project !== project) return;
        const stillHere = route === viewKey();
        if (stillHere && modal === modalSequence) closeModal(true);
        if (stillHere && afterSuccess) afterSuccess(body);
        setSnapshot(body.snapshot); toast(success);
      }
      catch (error) { toast(String(error), true); }
    }
    $('#drawer-backdrop').onclick = event => { if (event.target === $('#drawer-backdrop')) closeDrawer(); };
    $('#modal-backdrop').onclick = event => { if (event.target === $('#modal-backdrop')) closeModal(); };
    $('#search').oninput = event => { state.query = event.target.value.trim(); if (state.workstream) render(); };
    $('#project-switcher').onchange = async event => { try { await selectProject(event.target.value, true); } catch (error) { renderProjectSwitcher(); toast(`切换项目失败：${error}`, true); } };
    $('#project-unregister').onclick = openProjectUnregisterModal;
    $('#home').onclick = openOverview;
    $('#theme').onclick = () => { const dark = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = dark ? '' : 'dark'; localStorage.setItem('verif-theme', dark ? 'light' : 'dark'); };
    for (const type of ['input','change']) document.addEventListener(type, event => {
      const form = event.target.closest('form');
      if (form) form.dataset.dirty = 'true';
    });
    document.addEventListener('submit', event => {
      if (event.target.closest('#modal') && $('#modal').dataset.stale === 'true') {
        event.preventDefault(); event.stopImmediatePropagation(); toast('请重新打开当前版本后再提交', true); return;
      }
      submittingForm = event.target;
    }, true);
    window.addEventListener('beforeunload', event => {
      saveView();
      if (document.querySelector('form[data-dirty="true"]') || [...viewCache.values()].some(view => Object.keys(view.forms).length)) {
        event.preventDefault(); event.returnValue = '';
      }
    });
    window.addEventListener('popstate', () => navigateUrl(new URL(window.location.href), {historyTraversal:true}));
    window.history.scrollRestoration = 'manual';
    if (localStorage.getItem('verif-sidebar') === 'collapsed') { $('#layout').classList.add('sidebar-collapsed'); document.body.classList.add('sidebar-collapsed'); }
    if (localStorage.getItem('verif-theme') === 'light') document.documentElement.dataset.theme = '';
    initialLoad();
  </script>
</body>
</html>
