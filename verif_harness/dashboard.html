<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="verif-token" content="__VERIF_DASHBOARD_TOKEN__">
  <title>verif-harness · 验证项目看板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb; --panel: #ffffff; --panel-2: #f8fafc; --text: #172033;
      --muted: #637083; --line: #dfe5ee; --brand: #195fb8; --brand-2: #eaf3ff;
      --green: #147a4b; --green-bg: #eaf8f1; --red: #b4232f; --red-bg: #fff0f1;
      --yellow: #8a5a00; --yellow-bg: #fff7df; --orange: #b54708; --orange-bg: #fff2e8;
      --blue: #175cd3; --blue-bg: #eaf2ff; --purple: #6941c6; --purple-bg: #f3efff;
      --gray: #596579; --gray-bg: #eef1f5; --shadow: 0 12px 34px rgba(30, 48, 78, .08);
      --radius: 14px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1523; --panel: #141f30; --panel-2: #182538; --text: #edf3fb;
      --muted: #a1afc2; --line: #2b3b52; --brand: #79b5ff; --brand-2: #173252;
      --green: #74d6a6; --green-bg: #173b2c; --red: #ff9ca5; --red-bg: #48242a;
      --yellow: #ffd37a; --yellow-bg: #46391d; --orange: #ffad73; --orange-bg: #482e1c;
      --blue: #8bc0ff; --blue-bg: #1b3658; --purple: #c4adff; --purple-bg: #352958;
      --gray: #b4c0d0; --gray-bg: #2a3545; --shadow: 0 12px 34px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .topbar { position: sticky; top: 0; z-index: 20; height: 68px; display: flex; align-items: center; gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(12px); }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 260px; }
    .logo { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px; color: white; font-weight: 800; background: linear-gradient(145deg, #0d4f9f, #2f80ed); box-shadow: 0 7px 18px rgba(25, 95, 184, .25); transition: transform .15s ease, box-shadow .15s ease; }
    .logo:hover { transform: translateY(-1px); box-shadow: 0 9px 22px rgba(25, 95, 184, .34); }
    .logo:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 3px; }
    .brand strong { display: block; font-size: 15px; }
    .brand small { color: var(--muted); }
    .project-controls { display: flex; align-items: center; gap: 7px; }
    .project-switcher { min-width: 210px; max-width: 320px; padding: 9px 34px 9px 11px; border: 1px solid var(--line); border-radius: 9px; color: var(--text); background: var(--panel-2); }
    .project-unregister { white-space: nowrap; }
    .search { flex: 1; max-width: 620px; position: relative; }
    .search input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel-2); outline: none; }
    .search span { position: absolute; left: 13px; top: 9px; color: var(--muted); }
    .connection { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #98a2b3; }
    .dot.live { background: #22a663; box-shadow: 0 0 0 4px rgba(34,166,99,.12); }
    .dot.offline { background: #e5484d; }
    .icon-btn { border: 1px solid var(--line); color: var(--text); background: var(--panel); border-radius: 9px; padding: 8px 10px; }
    .layout { min-height: calc(100vh - 68px); display: grid; grid-template-columns: 238px minmax(0, 1fr); }
    .layout.overview-focus { grid-template-columns: minmax(0, 1fr); }
    .layout.overview-focus .sidebar { display: none; }
    .sidebar { border-right: 1px solid var(--line); background: var(--panel); padding: 22px 14px; }
    .sidebar-head { display: flex; align-items: center; min-height: 29px; margin-bottom: 4px; }
    .nav-label { padding: 0 10px 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .sidebar-toggle { width: 28px; height: 28px; display: grid; place-items: center; margin: -5px 4px 0 auto; padding: 0; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: transparent; }
    .sidebar-toggle:hover { color: var(--text); background: var(--panel-2); }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border: 0; border-radius: 9px; color: var(--text); background: transparent; text-align: left; }
    .nav-item:hover { background: var(--panel-2); }
    .nav-item.active { color: var(--brand); background: var(--brand-2); font-weight: 700; }
    .nav-item .nav-code { width: 52px; font-weight: 800; }
    .nav-item .nav-state { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
    @media (min-width: 761px) {
      .layout.sidebar-collapsed { grid-template-columns: 76px minmax(0, 1fr); }
      .layout.sidebar-collapsed.overview-focus { grid-template-columns: minmax(0, 1fr); }
      .layout.sidebar-collapsed .sidebar { padding-inline: 9px; }
      .layout.sidebar-collapsed .sidebar-head { justify-content: center; }
      .layout.sidebar-collapsed .nav-label { display: none; }
      .layout.sidebar-collapsed .sidebar-toggle { margin-inline: auto; }
      .layout.sidebar-collapsed .nav-item { justify-content: center; padding-inline: 6px; }
      .layout.sidebar-collapsed .nav-item .nav-code { width: auto; font-size: 12px; text-align: center; }
      .layout.sidebar-collapsed .nav-name, .layout.sidebar-collapsed .nav-state { display: none; }
    }
    .sidebar-foot { margin-top: 26px; padding: 14px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    main { min-width: 0; padding: 28px clamp(18px, 3vw, 42px) 64px; }
    .page-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
    .page-head h1 { margin: 0 0 5px; font-size: clamp(23px, 2vw, 31px); line-height: 1.25; }
    .page-head p { margin: 0; color: var(--muted); max-width: 850px; }
    .page-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn { border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; color: var(--text); background: var(--panel); font-weight: 650; }
    .btn:hover { border-color: var(--brand); }
    .btn.primary { color: white; background: #195fb8; border-color: #195fb8; }
    .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
    .btn.small { padding: 6px 9px; font-size: 12px; }
    .grid { display: grid; gap: 16px; }
    .summary-grid { grid-template-columns: repeat(5, minmax(130px, 1fr)); margin-bottom: 20px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .metric { padding: 17px 18px; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 3px; font-size: 25px; font-weight: 780; }
    .metric .hint { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .section { margin-top: 20px; }
    .section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .section-head .count { color: var(--muted); }
    .section-head .spacer { margin-left: auto; }
    .workstream-grid { grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); }
    .ws-card { padding: 18px; transition: transform .15s ease, border-color .15s ease; }
    .ws-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .overview-action-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .overview-tile { position: relative; min-height: 142px; padding: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); background: var(--panel); box-shadow: var(--shadow); text-align: left; transition: transform .15s ease, border-color .15s ease; }
    .overview-tile:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .overview-tile::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--gray); }
    .overview-tile.pending::before { background: var(--yellow); }
    .overview-tile.risk::before { background: var(--orange); }
    .tile-head { display: flex; align-items: center; gap: 9px; }
    .tile-head strong { font-size: 16px; }
    .tile-head .tile-arrow { margin-left: auto; color: var(--muted); }
    .tile-visual { min-height: 42px; margin-top: 14px; display: flex; align-items: center; gap: 10px; }
    .state-dot { width: 13px; height: 13px; border: 3px solid var(--panel); border-radius: 50%; background: var(--gray); box-shadow: 0 0 0 2px var(--gray-bg); }
    .state-dot.RUNNING { background: var(--blue); box-shadow: 0 0 0 2px var(--blue-bg); animation: waiting-breathe 1.8s ease-in-out infinite; }
    .state-dot.WAITING_FOR_PARENT { background: var(--purple); box-shadow: 0 0 0 2px var(--purple-bg); animation: waiting-breathe 1.8s ease-in-out infinite; }
    .state-dot.WAITING_FOR_HUMAN { background: var(--yellow); box-shadow: 0 0 0 2px var(--yellow-bg); animation: waiting-breathe 1.8s ease-in-out infinite; }
    .state-dot.FAILED { background: var(--red); box-shadow: 0 0 0 2px var(--red-bg); }
    .state-dot.COMPLETED { background: var(--green); box-shadow: 0 0 0 2px var(--green-bg); }
    .tile-number { font-size: 34px; line-height: 1; font-weight: 790; }
    .tile-unit { color: var(--muted); font-size: 13px; }
    .tile-summary { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .overview-entry { width: 100%; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); background: var(--panel); box-shadow: var(--shadow); text-align: left; }
    .overview-entry:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .entry-head { display: flex; align-items: center; gap: 10px; }
    .entry-head strong { font-size: 16px; }
    .entry-head .badge { margin-left: auto; }
    .entry-summary { margin-top: 5px; color: var(--muted); }
    @keyframes waiting-breathe { 50% { opacity: .35; } }
    .ws-title { display: flex; align-items: center; gap: 10px; }
    .ws-title strong { font-size: 16px; }
    .ws-title .revision { margin-left: auto; color: var(--muted); font-size: 12px; }
    .ws-objective { min-height: 42px; margin: 10px 0; color: var(--muted); }
    .ws-progress { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .ws-progress-text { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .progress-ring { --progress: 0; position: relative; flex: 0 0 auto; width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--blue) calc(var(--progress) * 1%), var(--gray-bg) 0); animation: progress-breathe 2.2s ease-in-out infinite; }
    .progress-ring::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--panel); }
    .progress-ring span { position: relative; color: var(--text); font-size: 12px; font-weight: 800; }
    .progress-ring.small { width: 46px; height: 46px; }
    .progress-ring.small::before { inset: 6px; }
    .progress-ring.small span { font-size: 10px; }
    @keyframes progress-breathe { 50% { transform: scale(.96); filter: saturate(.82); box-shadow: 0 0 0 5px color-mix(in srgb, var(--blue) 8%, transparent); } }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 3px 8px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .VALID, .SATISFIED, .BASELINED, .COMPLETED, .RESOLVED, .CLOSED, .SUPPORTED, .APPROVED { color: var(--green); background: var(--green-bg); }
    .RUNNING { color: var(--blue); background: var(--blue-bg); }
    .WAITING_FOR_PARENT { color: var(--purple); background: var(--purple-bg); }
    .INVALID, .FAILED, .NOT_SUPPORTED { color: var(--red); background: var(--red-bg); }
    .STALE, .REVALIDATION_REQUIRED, .PARTIALLY_STALE, .EXPIRED, .SUPERSEDED { color: var(--orange); background: var(--orange-bg); }
    .REVIEW_REQUIRED, .PROVISIONAL, .REVIEW, .REVISE, .WAITING_FOR_HUMAN, .OPEN, .BLOCKED, .HUMAN_REVIEW_REQUIRED, .NOT_SATISFIED, .CHANGES_REQUESTED { color: var(--yellow); background: var(--yellow-bg); }
    .WAIVED { color: var(--purple); background: var(--purple-bg); }
    .UNKNOWN, .PENDING, .RECORDED, .CANCELLED, .IDLE { color: var(--gray); background: var(--gray-bg); }
    .two-col { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); align-items: start; }
    .agent-session { padding: 19px 20px; border-left: 4px solid var(--blue); box-shadow: var(--shadow); }
    .agent-section { margin-top: 28px; }
    .agent-session-head { display: flex; align-items: flex-start; gap: 14px; }
    .agent-session-state { display: flex; align-items: center; gap: 10px; }
    .agent-session-state .state-dot { flex: 0 0 auto; }
    .agent-session-title { margin: 0; font-size: 19px; line-height: 1.35; }
    .agent-session-summary { margin-top: 4px; color: var(--muted); }
    .agent-session-badge { margin-left: auto; }
    .agent-session-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .agent-session-meta span { padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--panel-2); font-size: 12px; }
    .agent-priority { overflow: hidden; border: 2px solid color-mix(in srgb, var(--yellow) 58%, var(--line)); border-left: 6px solid var(--yellow); box-shadow: 0 14px 34px color-mix(in srgb, var(--yellow) 15%, transparent); }
    .agent-priority .agent-panel-head { padding-block: 18px; background: color-mix(in srgb, var(--yellow-bg) 82%, var(--panel)); }
    .agent-priority .agent-panel-head h2 { font-size: 19px; }
    .agent-priority-clear { display: flex; align-items: center; gap: 12px; padding: 14px 17px; border-left: 4px solid var(--blue); box-shadow: var(--shadow); }
    .agent-priority-clear-copy { min-width: 0; }
    .agent-priority-clear-copy strong { display: block; }
    .agent-priority-clear-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .agent-priority-clear > .badge { margin-left: auto; }
    .agent-workspace { grid-template-columns: minmax(0, 1fr) minmax(280px, 350px); align-items: start; }
    .agent-main, .agent-side { min-width: 0; }
    .agent-side { display: grid; gap: 16px; }
    .agent-panel { overflow: hidden; }
    .agent-panel-head { display: flex; align-items: flex-start; gap: 10px; padding: 15px 17px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
    .agent-panel-head h2, .agent-panel-head h3 { margin: 0; font-size: 16px; }
    .agent-panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .agent-panel-head .badge, .agent-panel-head .count { margin-left: auto; }
    .agent-timeline { padding: 4px 17px 8px; }
    .agent-event { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; padding: 15px 0; }
    .agent-event + .agent-event { border-top: 1px solid var(--line); }
    .agent-event-rail { position: relative; display: flex; justify-content: center; }
    .agent-event-dot { position: relative; z-index: 1; width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px var(--blue-bg); }
    .agent-event.question .agent-event-dot { background: var(--yellow); box-shadow: 0 0 0 4px var(--yellow-bg); }
    .agent-event.failed .agent-event-dot { background: var(--red); box-shadow: 0 0 0 4px var(--red-bg); }
    .agent-event.completed .agent-event-dot { background: var(--green); box-shadow: 0 0 0 4px var(--green-bg); }
    .agent-event-head { display: flex; align-items: center; gap: 8px; }
    .agent-event-head strong { font-size: 13px; }
    .agent-event-head time { margin-left: auto; color: var(--muted); font-size: 11px; }
    .agent-event-message { margin-top: 5px; color: var(--text); overflow-wrap: anywhere; }
    .agent-event-meta { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .agent-event-progress { height: 5px; margin-top: 9px; overflow: hidden; border-radius: 5px; background: var(--gray-bg); }
    .agent-event-progress span { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .agent-event details { margin-top: 9px; border-color: var(--line); background: var(--panel-2); }
    .agent-event details summary { padding: 7px 9px; color: var(--muted); font-size: 12px; }
    .agent-event details .detail-group-body { padding: 9px; color: var(--muted); font-size: 12px; }
    .agent-question-list { display: grid; gap: 12px; padding: 13px; }
    .agent-question-card { padding: 15px; border: 1px solid color-mix(in srgb, var(--yellow) 45%, var(--line)); border-radius: 11px; background: color-mix(in srgb, var(--yellow-bg) 38%, var(--panel)); }
    .agent-question-head { display: flex; align-items: center; gap: 8px; }
    .agent-question-kicker { color: var(--yellow); font-size: 11px; font-weight: 800; letter-spacing: .04em; }
    .agent-question-head .badge { margin-left: auto; }
    .agent-question-card h3 { margin: 8px 0 0; font-size: 15px; line-height: 1.45; }
    .agent-question-context { margin-top: 10px; padding: 10px 11px; border-left: 3px solid var(--yellow); border-radius: 7px; color: var(--muted); background: var(--panel); font-size: 12px; }
    .agent-options { display: grid; gap: 7px; margin: 13px 0 0; padding: 0; border: 0; }
    .agent-options legend { margin-bottom: 7px; color: var(--muted); font-size: 12px; font-weight: 750; }
    .agent-option { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; }
    .agent-option:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .agent-option:has(input:checked) { border-color: var(--brand); background: var(--brand-2); }
    .agent-option input { width: auto; margin: 3px 0 0; }
    .agent-option-copy { min-width: 0; }
    .agent-option-title { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 700; }
    .agent-option-description { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .agent-response-row { display: grid; grid-template-columns: minmax(120px, .45fr) minmax(0, 1fr); gap: 9px; margin-top: 11px; }
    .agent-response-row .field { margin: 0; }
    .agent-response-row .field textarea { min-height: 66px; }
    .agent-submit { width: 100%; margin-top: 11px; }
    .agent-side-note { padding: 13px 15px; color: var(--muted); font-size: 12px; }
    .agent-side-note strong { color: var(--text); }
    .agent-work-status { padding: 17px 19px; border-left: 4px solid var(--blue); box-shadow: var(--shadow); }
    .agent-work-status-head { display: flex; align-items: center; gap: 9px; }
    .agent-work-status-head h2 { margin: 0; font-size: 17px; }
    .agent-work-status-head .badge { margin-left: auto; }
    .agent-work-status-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr); gap: 14px; align-items: start; }
    .agent-work-focus { margin-top: 13px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
    .agent-work-focus .agent-question-kicker { display: block; margin-bottom: 5px; }
    .agent-work-focus strong { display: block; line-height: 1.4; }
    .agent-work-focus p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .agent-work-progress { margin-top: 12px; }
    .agent-work-progress-head { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .agent-work-progress-bar { height: 6px; margin-top: 7px; overflow: hidden; border-radius: 6px; background: var(--gray-bg); }
    .agent-work-progress-bar span { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .agent-work-next { margin-top: 12px; padding: 10px 11px; border-left: 3px solid var(--blue); border-radius: 7px; color: var(--muted); background: var(--blue-bg); font-size: 12px; }
    .agent-context-details { margin-top: 12px; }
    .agent-context-details summary { color: var(--muted); font-size: 12px; }
    .agent-context-list { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px 11px; margin: 0; }
    .agent-context-list dt { color: var(--muted); }
    .agent-context-list dd { margin: 0; overflow-wrap: anywhere; }
    .agent-execution-stack { display: grid; gap: 12px; }
    .agent-readonly-details { overflow: hidden; box-shadow: var(--shadow); }
    .agent-readonly-details > summary { display: flex; align-items: center; gap: 11px; min-height: 58px; padding: 14px 17px; list-style: none; background: var(--panel-2); }
    .agent-readonly-details > summary::-webkit-details-marker { display: none; }
    .agent-readonly-details > summary::before { content: '›'; flex: 0 0 auto; color: var(--muted); font-size: 22px; line-height: 1; transition: transform .16s ease; }
    .agent-readonly-details[open] > summary::before { transform: rotate(90deg); }
    .agent-readonly-copy { min-width: 0; }

    function renderWorkstream(w) {

        ${vdocConvergenceHtml(w, openHuman)}

    function nodeRows(nodes) {
      const query = state.query.toLowerCase();
      const byParent = new Map();
      nodes.forEach(n => { const key = n.parent_id || ''; if (!byParent.has(key)) byParent.set(key, []); byParent.get(key).push(n); });
      const ordered = [], visited = new Set();
      function visit(node, depth) { if (visited.has(node.id)) return; visited.add(node.id); ordered.push([node, depth]); if (!state.collapsedNodes.has(node.id) || query) (byParent.get(node.id) || []).forEach(child => visit(child, depth + 1)); }
      nodes.filter(n => !n.parent_id || !nodes.some(parent => parent.id === n.parent_id)).forEach(n => visit(n, 0));
      nodes.forEach(n => visit(n, 0));
      const filtered = ordered.filter(([n]) => !query || `${n.id} ${n.title} ${n.status} ${n.key} ${n.statement || ''}`.toLowerCase().includes(query));
      if (!filtered.length) return '<tr><td colspan="3" class="empty">没有匹配的节点</td></tr>';
      return filtered.map(([n, depth]) => {
        const children = byParent.get(n.id) || [];
        const toggle = children.length ? `<button class="tree-toggle" data-toggle-node="${escapeHtml(n.id)}" title="展开或折叠子节点">${state.collapsedNodes.has(n.id) ? '▸' : '▾'}</button>` : '';
        return `<tr><td><div style="margin-left:${depth * 22}px">${toggle}<button class="node-link" data-node="${escapeHtml(n.id)}">${escapeHtml(humanText(n.title))}</button></div></td><td><div>${escapeHtml(roleLabel(n.role))}</div><div class="row-meta">${n.required ? '计划要求完成' : '补充工作'}</div></td><td>${nodeProgressHtml(n)}</td></tr>`;
      }).join('');
    }
    function closureRows(items) {
      if (!items.length) return '<div class="empty">当前没有未完成项</div>';
      return items.map(a => {
        const link = a.kind === 'HUMAN_REVIEW' && a.target.startsWith('workstream:')
          ? `<button class="node-link" data-review-workstream="${escapeHtml(a.target.replace(/^workstream:/, ''))}">${escapeHtml(actionLabel(a.kind))}</button>`
          : `<button class="node-link" data-node="${escapeHtml(a.target)}">${escapeHtml(actionLabel(a.kind))}</button>`;
        return `<div class="list-row"><div>${link}<div class="row-meta">${escapeHtml(humanText(a.reason))}${a.blocked_by?.length ? ` · 有 ${a.blocked_by.length} 项依赖的工作尚未完成` : ''}</div></div><span class="badge ${a.executor === 'human' ? 'WAITING_FOR_HUMAN' : 'PENDING'}">${escapeHtml(a.executor === 'human' ? '负责人处理' : a.executor === 'reasoning' ? '需要 Agent 分析' : '系统可以自动处理')}</span></div>`;
      }).join('');
    }

        ? '审批 VDOC · 验证文档撰写方案'
        : `审批 ${w.workstream} · ${workstreamLabel(w.workstream)}实施方案`;
      $('#main').innerHTML = `<div class="page-head"><div><h1>${escapeHtml(title)}</h1><p>请先核对下方计划快照，再决定批准、修改、澄清或拒绝。</p></div></div>${workstreamPlanSnapshotHtml(w)}${reviewSection}`;
      bindNodeLinks();
      if (w.workstream !== 'VDOC' && hasPlanNodes) bindWorkstreamReviewForm(w, 'review-page-form');
    }

    function planSectionState(n, section) {
      return (n.plan_review?.sections || []).find(item => item.section === section);
    }

    function planSectionReviewHtml(n, section, title, content, canApprove=true) {
      const review = planSectionState(n, section);
      if (!review) return '';
      const approve = canApprove ? `<option value="approve">批准“${escapeHtml(title)}”</option>` : '';
      const history = (review.reviews || []).slice().reverse().map(item => `<div class="list-row"><div><strong>${escapeHtml(item.verdict === 'APPROVE' ? '批准' : item.verdict === 'MODIFY' ? '要求修改' : item.verdict === 'CLARIFY' ? '要求说明' : '不同意')}</strong><div class="row-meta">${escapeHtml(item.reviewer)} · ${escapeHtml(item.reason)} · ${shortTime(item.created_at)}</div></div></div>`).join('') || '<div class="empty">这个区块尚未审批</div>';
      const blocked = canApprove ? '' : '<div class="notice"><strong>这个区块暂时不能批准。</strong> 仍有待确认事项需要先处理。</div>';
      return `<section class="section"><div class="section-head"><h2>${escapeHtml(title)}</h2>${planReviewStatusBadge(review.status)}</div>${blocked}<div class="card">${content}</div><div class="card" style="padding:20px;margin-top:10px;max-width:760px"><form data-plan-section-form="${escapeHtml(section)}"><div class="field"><label>本区块审批结论</label><select name="verdict">${approve}<option value="modify">要求修改本区块</option><option value="clarify">要求进一步说明</option><option value="reject">不同意本区块方案</option></select></div><div class="field"><label>审批人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>审批意见</label><textarea name="reason" placeholder="说明认可的内容，或明确需要修改、说明的部分" required></textarea></div><div class="modal-actions"><button class="btn primary">提交本区块审批</button></div></form></div><details class="detail-group"><summary>查看本区块审批历史</summary><div class="detail-group-body card list-card">${history}</div></details></section>`;
    }

    function renderNodePlanReview(n) {
      if (!n || n.workstream !== 'VDOC' || !n.plan_review) {
        state.reviewPlanNode = null;
        return renderWorkstreamReview(workstream('VDOC'));
      }
      state.workstream = 'VDOC';
      const pending = (n.human_actions || []).filter(item => item.status === 'OPEN');
      const confirmations = pending.map(item => `<div class="list-row"><div><strong>${escapeHtml(humanActionLabel(item.action))}</strong><div class="row-meta">${escapeHtml(item.reason)} · ${escapeHtml(item.reviewer)} · ${shortTime(item.created_at)}</div></div>${statusBadge(item.status)}</div>`).join('') || '<div class="empty">当前没有额外工程问题；仍需审批本区块，确认不需要新增待确认事项。</div>';
      const outgoing = (n.outgoing || []).map(e => `<li>${escapeHtml(humanText(e.relation))} → ${escapeHtml(findNode(e.target)?.title || e.target)}</li>`).join('');
      const incoming = (n.incoming || []).map(e => `<li>${escapeHtml(findNode(e.source)?.title || e.source)} → ${escapeHtml(humanText(e.relation))}</li>`).join('');
      const confirmationSection = planSectionReviewHtml(
        n, 'human-confirmations', '额外待确认的工程问题',
        `<div class="list-card attention">${confirmations}</div>`, pending.length === 0,
      );
      const contentSection = planSectionReviewHtml(
        n, 'planned-content', '计划写入的具体内容',
        `<ul>${planListHtml(n.work_content)}</ul>`,
      );
      const inputsSection = planSectionReviewHtml(
        n, 'inputs-scope-deliverable', '输入依据、范围和交付对象',
        `<strong>输入依据</strong><ul>${planListHtml(n.source_refs)}</ul><strong>范围</strong><ul>${planListHtml(n.scope)}</ul><strong>交付对象</strong><ul>${planListHtml(n.deliverables)}</ul>`,
      );
      const dependencyContent = `${outgoing ? `<strong>需要先具备的内容</strong><ul>${outgoing}</ul>` : ''}${incoming ? `<strong>本方案变化后需要重新检查</strong><ul>${incoming}</ul>` : ''}`;
      const dependencySection = planSectionReviewHtml(
        n, 'dependencies-impact', '依赖和影响', dependencyContent,
      );
      $('#main').innerHTML = `<div class="page-head"><div><h1>审批文档撰写方案</h1><p>${escapeHtml(humanText(n.title))} · VDOC 计划版本 ${n.plan_review.revision}</p></div><div class="page-actions"><button class="btn" data-return-vdoc>返回 VDOC 方案</button></div></div>
        <div class="notice"><strong>${n.plan_review.status === 'APPROVED' ? '本撰写方案已经审批通过。' : n.plan_review.status === 'CHANGES_REQUESTED' ? '本撰写方案需要按评审意见修改。' : '本撰写方案仍待审批。'}</strong> 审批对象是当前 DUT 的这一个文档撰写方案节点，不是文档正文。“没有额外工程问题”只表示没有另行登记的确认事项，不表示方案已经审批。批准后允许 Agent 按方案编写或完善相关文档内容；正文完成后仍需单独验收。</div>
        <section class="section"><div class="section-head"><h2>审批对象</h2>${planReviewStatusBadge(n.plan_review.status)}</div><div class="card"><dl class="kv"><dt>验证对象节点</dt><dd>${escapeHtml(humanText(n.title))}</dd><dt>节点类型</dt><dd>${escapeHtml(roleLabel(n.role))}</dd><dt>节点目标</dt><dd>${escapeHtml(humanText(n.statement || '未登记'))}</dd><dt>方案版本</dt><dd>${n.plan_review.revision}</dd><dt>是否为计划要求</dt><dd>${n.required ? '是' : '否'}</dd></dl></div></section>
        ${confirmationSection}${contentSection}${inputsSection}${dependencySection}
        <section class="section"><div class="notice"><strong>节点通过规则：</strong>以上所有必审区块都必须针对当前方案版本批准；任一区块要求修改、要求说明或拒绝，节点方案均不能通过。</div></section>`;
      $('[data-return-vdoc]').onclick = () => leaveNodePlanReview('VDOC');
      document.querySelectorAll('[data-plan-section-form]').forEach(form => {
        form.onsubmit = async event => {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          data.node = n.id;
          data.section = form.dataset.planSectionForm;
          data.definition_digest = n.plan_review.definition_digest;
          rememberReviewer(data.reviewer);
          await post('/api/reviews/node-plan-section', data, '文档撰写方案区块审批已保存');
        };
      });
    }

    function renderVdocRevisionRequest() {
      const w = workstream('VDOC');
      if (!w) { state.reviseVdocPlan = false; return renderOverview(); }
      state.workstream = 'VDOC';
      const documents = (w.nodes || []).filter(n => n.role === 'document-catalog' && n.document);
      const params = new URLSearchParams(window.location.search);
      const initialDocument = params.get('document-key') || documents[0]?.key || '';
      const initialType = params.get('node-type') || 'document-writing-plan';
      const initialNode = params.get('node-id') || '';
      const options = documents.map(n => `<option value="${escapeHtml(n.key)}" ${n.key === initialDocument ? 'selected' : ''}>${escapeHtml(humanText(n.title))} · ${escapeHtml(n.document.path)}</option>`).join('');
      $('#main').innerHTML = `<div class="page-head"><div><h1>调整文档</h1><p>按“文档 → 节点类型 → 加/改/减节点”的顺序提交意图，由 Agent 生成新的 VDOC proposal 和差异。</p></div><div class="page-actions"><button class="btn" data-return-vdoc>返回 VDOC</button></div></div>
        <section class="section"><div class="notice"><strong>这里提交的是修订请求，不直接操作节点。</strong> 增加或修改由 Agent 分析后进入新方案版本；减少节点表示从下一版本移出并保留历史。</div><div class="card" style="padding:20px;max-width:820px"><form id="vdoc-revision-form"><div class="field"><label>1. 针对哪一个文档</label><select name="document_key" id="revision-document" required>${options}</select></div><div class="field"><label>2. 节点类型</label><select name="node_type" id="revision-node-type"><option value="document-writing-plan" ${initialType === 'document-writing-plan' ? 'selected' : ''}>文档撰写方案节点</option><option value="document-deliverable" ${initialType === 'document-deliverable' ? 'selected' : ''}>文档交付节点</option></select></div><div class="field"><label>3. 调整动作</label><select name="change_kind" id="revision-change-kind"><option value="add">增加节点</option><option value="modify" ${initialNode ? 'selected' : ''}>修改节点</option><option value="remove">减少节点（下一版本移出）</option></select></div><div class="field"><label>现有节点（修改或减少时必选）</label><select name="node_id" id="revision-node"></select></div><div class="field"><label>4. 调整内容</label><textarea name="reason" placeholder="说明需要增加、修改或移出的节点内容、原因、验收边界和预期影响" required></textarea></div><div class="field"><label>提出人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="modal-actions"><button type="button" class="btn" data-return-vdoc>取消</button><button class="btn primary">提交文档节点修订请求</button></div></form></div></section>`;
      const refreshNodeOptions = () => {
        const documentKey = $('#revision-document').value;
        const nodeType = $('#revision-node-type').value;
        const candidates = (w.nodes || []).filter(n => n.document_key === documentKey && n.role === nodeType);
        $('#revision-node').innerHTML = `<option value="">请选择现有节点</option>${candidates.map(n => `<option value="${escapeHtml(n.id)}" ${n.id === initialNode ? 'selected' : ''}>${escapeHtml(humanText(n.title))}</option>`).join('')}`;
      };
      $('#revision-document').onchange = refreshNodeOptions;
      $('#revision-node-type').onchange = refreshNodeOptions;
      refreshNodeOptions();
      document.querySelectorAll('[data-return-vdoc]').forEach(button => button.onclick = () => leaveVdocRevisionRequest('VDOC'));
      $('#vdoc-revision-form').onsubmit = async event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.target));
        const selected = documents.find(n => n.key === values.document_key);
        if (values.change_kind !== 'add' && !values.node_id) {
          toast('修改或减少节点时必须选择一个现有节点', true);
          return;
        }
        rememberReviewer(values.reviewer);
        await post('/api/human-actions', {
          target: values.node_id || 'VDOC', action: 'REQUEST_CHANGE', reviewer: values.reviewer,
          reason: values.reason,
          payload: {
            request_type: 'vdoc-node-revision',
            document_key: values.document_key,
            document_path: selected?.document?.path || '',
            node_type: values.node_type,
            source_node_id: values.node_id || null,
            change_kind: values.change_kind,
          },
        }, '文档节点修订请求已保存', () => leaveVdocRevisionRequest('VDOC', false));
      };
    }

    async function renderDocumentDeliveryReview(n) {
      if (!n || n.role !== 'document-deliverable' || !n.delivery_review) {
        state.reviewDeliveryNode = null;
        return renderWorkstream(workstream('VDOC'));
      }
      state.workstream = 'VDOC';
      $('#main').innerHTML = `<div class="page-head"><div><h1>验收文档交付节点</h1><p>${escapeHtml(humanText(n.title))}</p></div><div class="page-actions"><button class="btn" data-return-vdoc>返回 VDOC</button></div></div><div class="card empty">正在读取所属文档正文…</div>`;
      $('[data-return-vdoc]').onclick = () => leaveDocumentDeliveryReview('VDOC');
      try {
        const response = await fetch(`/api/document?project=${encodeURIComponent(state.project)}&selector=${encodeURIComponent(n.delivery_review.document_id)}`, {headers:{'X-Verif-Token':token}});
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || response.statusText);
        const current = body.document;
        const pending = (current.governance_items || []).filter(item => ['PENDING','ACTIVE'].includes(item.status) && ['human-decision','external-open-question'].includes(item.kind));
        const confirmations = (n.human_actions || []).filter(item => item.status === 'OPEN');
        const approveOption = pending.length || confirmations.length ? '' : '<option value="approve">批准这个交付节点</option>';
        const history = (n.delivery_review.reviews || []).slice().reverse().map(item => `<div class="list-row"><div><strong>${escapeHtml(item.verdict === 'APPROVE' ? '批准' : item.verdict === 'PROVISIONAL' ? '暂定接受' : item.verdict === 'MODIFY' ? '要求修改' : item.verdict === 'CLARIFY' ? '要求说明' : '拒绝')}</strong><div class="row-meta">${escapeHtml(item.reviewer)} · ${escapeHtml(item.notes)}${item.provisional ? ` · 责任人：${escapeHtml(item.provisional.owner)} · 重审条件：${escapeHtml(item.provisional.review_trigger)}` : ''} · 文档版本 ${item.semantic_revision} · ${shortTime(item.created_at)}</div></div></div>`).join('') || '<div class="empty">这个交付节点尚未验收</div>';
        const pendingNotice = pending.length || confirmations.length ? `<div class="notice"><strong>暂时不能批准。</strong> 仍有 ${pending.length + confirmations.length} 个问题、工程决定或 Agent 分析事项需要负责人逐项处理。</div>` : '';
        const confirmationRows = confirmations.map(item => `<div class="card" style="padding:18px;margin-bottom:10px"><div><strong>${escapeHtml(humanActionLabel(item.action))}</strong><div class="row-meta">${escapeHtml(item.reason)} · Agent/提出人：${escapeHtml(item.reviewer)} · ${shortTime(item.created_at)}</div></div><form data-delivery-confirmation="${escapeHtml(item.id)}" style="margin-top:14px"><div class="field"><label>负责人处理结论</label><select name="verdict"><option value="approve">确认该事项已经处理</option><option value="modify">要求修改相关正文或分析</option><option value="clarify">要求进一步说明</option><option value="reject">不同意当前处理方式</option></select></div><div class="field"><label>处理人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>处理意见</label><textarea name="resolution" required></textarea></div><button class="btn primary">提交本事项意见</button></form></div>`).join('') || '<div class="card empty">当前没有 Agent 分析后等待负责人确认的事项</div>';
        $('#main').innerHTML = `<div class="page-head"><div><h1>验收文档交付节点</h1><p>${escapeHtml(humanText(n.title))}</p></div><div class="page-actions"><button class="btn" data-adjust-delivery>调整文档交付内容</button><button class="btn" data-return-vdoc>返回 VDOC</button></div></div>
          <div class="notice"><strong>本次只验收该节点对应的正文内容，不是整份文档。</strong> 同一文档的其他交付节点仍需独立验收；所有计划要求完成的节点通过后，所属文档才会通过。</div>${pendingNotice}
          <section class="section"><div class="section-head"><h2>交付节点与所属文档</h2>${statusBadge(n.delivery_review.status)}</div><div class="card"><dl class="kv"><dt>交付节点</dt><dd>${escapeHtml(humanText(n.title))}</dd><dt>节点类型</dt><dd>${escapeHtml(roleLabel(n.role))}</dd><dt>所属文档</dt><dd>${escapeHtml(humanText(current.title))}</dd><dt>文档路径</dt><dd class="mono">${escapeHtml(current.path)}</dd><dt>文档标识</dt><dd class="mono">${escapeHtml(n.document_key)}</dd><dt>正文版本</dt><dd>${current.semantic_revision}</dd></dl><strong>本节点需要验收的正文内容</strong><ul>${planListHtml(n.work_content)}</ul><strong>内容验收标准</strong><ul>${planListHtml(n.acceptance_criteria)}</ul><strong>Agent 分析结论与质量检查</strong><ul>${planListHtml([n.statement, ...(n.quality_checks || [])].filter(Boolean))}</ul></div></section>
          <section class="section"><div class="section-head"><h2>Agent 分析后需要负责人确认的事项</h2><span class="count">${confirmations.length} 项待处理</span></div>${confirmationRows}</section>
          <section class="section"><div class="section-head"><h2>所属文档正文</h2></div><pre class="document-preview">${escapeHtml(body.content)}</pre></section>
          <section class="section"><div class="section-head"><h2>提交本节点验收结论</h2></div><div class="card" style="padding:20px;max-width:820px"><form id="delivery-review-form"><div class="field"><label>结论</label><select name="verdict" id="delivery-verdict">${approveOption}<option value="provisional">暂定接受，允许带风险推进</option><option value="modify">要求修改本节点对应内容</option><option value="clarify">要求进一步说明</option><option value="reject">不同意本节点交付内容</option></select></div><div class="notice"><strong>暂定不等于批准。</strong> 暂定节点允许下游开始工作，但不会计入文档通过、工作流完成或最终冻结。</div><div class="field"><label>暂定责任人（选择“暂定接受”时必填）</label><input name="provisional_owner" placeholder="负责消除暂定状态的人"></div><div class="field"><label>重新评审触发条件（选择“暂定接受”时必填）</label><textarea name="review_trigger" placeholder="例如：规格冻结、接口确认、参考模型结果可用"></textarea></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>评审意见</label><textarea name="notes" placeholder="只针对这个交付节点的验收范围给出意见" required></textarea></div><div class="modal-actions"><button class="btn primary">提交本节点验收</button></div></form></div><details class="detail-group"><summary>查看本节点验收历史</summary><div class="detail-group-body card list-card">${history}</div></details></section>`;
        $('[data-return-vdoc]').onclick = () => leaveDocumentDeliveryReview('VDOC');
        $('[data-adjust-delivery]').onclick = () => openDocumentDeliveryRevisionTab(n.id);
        document.querySelectorAll('[data-delivery-confirmation]').forEach(form => {
          form.onsubmit = async event => {
            event.preventDefault();
            const values = Object.fromEntries(new FormData(event.target));
            rememberReviewer(values.reviewer);
            if (values.verdict === 'approve') {
              await post('/api/human-actions/resolve', {
                id: form.dataset.deliveryConfirmation, reviewer: values.reviewer,
                resolution: values.resolution, status: 'RESOLVED',
              }, '待确认事项已处理');
            } else {
              await post('/api/human-actions', {
                target: n.id,
                action: values.verdict === 'clarify' ? 'CLARIFY' : 'REQUEST_CHANGE',
                reviewer: values.reviewer,
                reason: `${form.dataset.deliveryConfirmation}：${values.resolution}`,
                payload: {source_confirmation: form.dataset.deliveryConfirmation, verdict: values.verdict},
              }, '负责人意见已保存；该事项保持待处理');
            }
          };
        });
        $('#delivery-review-form').onsubmit = async event => {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          data.node = n.id;
          data.definition_digest = n.delivery_review.definition_digest;
          data.document_digest = n.delivery_review.document_digest;
          rememberReviewer(data.reviewer);
          await post('/api/reviews/document-delivery', data, '文档交付节点评审已保存');
        };
      } catch (error) {
        toast(`读取文档失败：${error}`, true);
      }
    }

    function evidenceContractHtml(contract, evidence=[]) {
      if (!contract) return '<div class="detail-card empty">尚未写清这项工作完成时需要哪些材料，因此目前不能判断它已经完成</div>';
      const requirements = (contract.requirements || []).map(item => {
        if (typeof item === 'string') return `<li>${escapeHtml(item)}</li>`;
        const choices = (item.alternatives || []).map(choice =>
          `<span class="tag">${escapeHtml(artifactLabel(choice.kind))} · ${escapeHtml(analyzerLabel(choice.analyzer))}</span>`
        ).join(' <span class="muted">或</span> ');
        return `<li><strong>${escapeHtml(humanText(item.label || '需要的材料'))}</strong><div class="tag-row">${choices}</div></li>`;
      }).join('');
      const required = (contract.required || []).map(item => `<li>${escapeHtml(humanText(item))}</li>`).join('');
      const received = evidence.slice().reverse().map(item => `<div class="list-row"><div><strong>${escapeHtml(artifactLabel(item.kind))}</strong><div class="row-meta">${escapeHtml(item.source)} · ${shortTime(item.created_at)}</div></div>${statusBadge(item.verdict === 'PASS' ? 'VALID' : 'INVALID')}</div>`).join('') || '<div class="empty">尚未登记支持材料</div>';
      return `<div class="detail-card"><dl class="kv"><dt>要确认什么</dt><dd>${escapeHtml(claimLabel(contract.claim || contract.basis))}</dd></dl><strong>需要的材料</strong><ul class="clean-list contract-list">${requirements || required || '<li>没有登记具体材料要求</li>'}</ul><p class="muted">缺少计划要求的材料时，这项工作就不能视为完成。一个命令运行成功，不能代替实际所需的文档、日志、波形或数据库。</p><details><summary>查看内部检查规则</summary><pre>${escapeHtml(contract.version || '—')}</pre></details></div><div class="card list-card" style="margin-top:10px">${received}</div>`;
    }
    function closureAssessmentHtml(assessment) {
      if (!assessment) return '<div class="detail-card empty">尚未生成完成判断</div>';
      const dependencyRows = (assessment.dependency_blockers || []).map(item =>
        `<li>${escapeHtml(humanText(item.title))} · ${statusBadge(item.status)}<details><summary>查看内部编号</summary><pre>${escapeHtml(item.id)}</pre></details></li>`
      ).join('') || '<li>没有需要先补齐的工作</li>';
      const reviewRows = (assessment.reviews || []).slice().reverse().map(item =>
        `<div class="list-row"><div><div class="row-title">${escapeHtml(item.verdict === 'APPROVE' ? '认可判断' : item.verdict === 'MODIFY' ? '要求修改' : item.verdict === 'CLARIFY' ? '要求说明' : '拒绝判断')} · ${escapeHtml(item.reviewer)}</div><div class="row-meta">${escapeHtml(item.reason)} · 计划版本 ${item.revision} · ${shortTime(item.created_at)}</div></div></div>`

    function openWaiveModal(n) {
      openModal(`<h2>接受未满足项</h2><p>接受例外不等于验证通过。请确认风险、依据和影响；该操作会把节点标记为已接受例外。</p><form id="waive-form"><div class="field"><label>节点</label><input value="${escapeHtml(n.id)}" disabled></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>理由和依据</label><textarea name="reason" required></textarea></div><div class="field"><label><input name="confirm" type="checkbox" style="width:auto" required> 我确认这是人工作出的明确工程决定</label></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn danger">确认接受例外</button></div></form>`);
      $('#waive-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.node = n.id; data.confirm = true; rememberReviewer(data.reviewer); await post('/api/waive', data, '例外决定已记录'); };
    }
    async function post(path, data, success, afterSuccess=null) {
      try { data.dashboard_project = state.project; const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json','X-Verif-Token':token}, body:JSON.stringify(data)}); const body = await response.json(); if (!response.ok) throw new Error(body.error || response.statusText); if (afterSuccess) afterSuccess(body); setSnapshot(body.snapshot); closeModal(); toast(success); }
      catch (error) { toast(String(error), true); }
    }
    $('#drawer-backdrop').onclick = event => { if (event.target === $('#drawer-backdrop')) closeDrawer(); };
    $('#modal-backdrop').onclick = event => { if (event.target === $('#modal-backdrop')) closeModal(); };
    $('#search').oninput = event => { state.query = event.target.value.trim(); if (state.workstream) renderWorkstream(workstream(state.workstream)); else if (state.query) { const match = allNodes().find(n => `${n.id} ${n.title}`.toLowerCase().includes(state.query.toLowerCase())); if (match) { state.node = match.id; renderDrawer(match.id); } } };
    $('#project-switcher').onchange = async event => { try { await selectProject(event.target.value, true); } catch (error) { renderProjectSwitcher(); toast(`切换项目失败：${error}`, true); } };
    $('#project-unregister').onclick = openProjectUnregisterModal;
    $('#home').onclick = openOverview;
    $('#theme').onclick = () => { const dark = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = dark ? '' : 'dark'; localStorage.setItem('verif-theme', dark ? 'light' : 'dark'); };
    if (localStorage.getItem('verif-sidebar') === 'collapsed') $('#layout').classList.add('sidebar-collapsed');
    if (localStorage.getItem('verif-theme') === 'light') document.documentElement.dataset.theme = '';
    initialLoad();
  </script>
</body>
</html>
