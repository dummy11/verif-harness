<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="verif-token" content="__VERIF_DASHBOARD_TOKEN__">
  <title>verif-harness · 验证项目看板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb; --panel: #ffffff; --panel-2: #f8fafc; --text: #172033;
      --muted: #637083; --line: #dfe5ee; --brand: #195fb8; --brand-2: #eaf3ff;
      --green: #147a4b; --green-bg: #eaf8f1; --red: #b4232f; --red-bg: #fff0f1;
      --yellow: #8a5a00; --yellow-bg: #fff7df; --orange: #b54708; --orange-bg: #fff2e8;
      --blue: #175cd3; --blue-bg: #eaf2ff; --purple: #6941c6; --purple-bg: #f3efff;
      --gray: #596579; --gray-bg: #eef1f5; --shadow: 0 12px 34px rgba(30, 48, 78, .08);
      --radius: 14px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1523; --panel: #141f30; --panel-2: #182538; --text: #edf3fb;
      --muted: #a1afc2; --line: #2b3b52; --brand: #79b5ff; --brand-2: #173252;
      --green: #74d6a6; --green-bg: #173b2c; --red: #ff9ca5; --red-bg: #48242a;
      --yellow: #ffd37a; --yellow-bg: #46391d; --orange: #ffad73; --orange-bg: #482e1c;
      --blue: #8bc0ff; --blue-bg: #1b3658; --purple: #c4adff; --purple-bg: #352958;
      --gray: #b4c0d0; --gray-bg: #2a3545; --shadow: 0 12px 34px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .topbar { position: sticky; top: 0; z-index: 20; height: 68px; display: flex; align-items: center; gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(12px); }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 260px; }
    .logo { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: white; font-weight: 800; background: linear-gradient(145deg, #0d4f9f, #2f80ed); box-shadow: 0 7px 18px rgba(25, 95, 184, .25); }
    .brand strong { display: block; font-size: 15px; }
    .brand small { color: var(--muted); }
    .search { flex: 1; max-width: 620px; position: relative; }
    .search input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel-2); outline: none; }
    .search span { position: absolute; left: 13px; top: 9px; color: var(--muted); }
    .connection { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #98a2b3; }
    .dot.live { background: #22a663; box-shadow: 0 0 0 4px rgba(34,166,99,.12); }
    .dot.offline { background: #e5484d; }
    .icon-btn { border: 1px solid var(--line); color: var(--text); background: var(--panel); border-radius: 9px; padding: 8px 10px; }
    .layout { min-height: calc(100vh - 68px); display: grid; grid-template-columns: 238px minmax(0, 1fr); }
    .sidebar { border-right: 1px solid var(--line); background: var(--panel); padding: 22px 14px; }
    .nav-label { padding: 0 10px 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border: 0; border-radius: 9px; color: var(--text); background: transparent; text-align: left; }
    .nav-item:hover { background: var(--panel-2); }
    .nav-item.active { color: var(--brand); background: var(--brand-2); font-weight: 700; }
    .nav-item .nav-code { width: 52px; font-weight: 800; }
    .nav-item .nav-state { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
    .sidebar-foot { margin-top: 26px; padding: 14px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    main { min-width: 0; padding: 28px clamp(18px, 3vw, 42px) 64px; }
    .page-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
    .page-head h1 { margin: 0 0 5px; font-size: clamp(23px, 2vw, 31px); line-height: 1.25; }
    .page-head p { margin: 0; color: var(--muted); max-width: 850px; }
    .page-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn { border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; color: var(--text); background: var(--panel); font-weight: 650; }
    .btn:hover { border-color: var(--brand); }
    .btn.primary { color: white; background: #195fb8; border-color: #195fb8; }
    .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
    .btn.small { padding: 6px 9px; font-size: 12px; }
    .grid { display: grid; gap: 16px; }
    .summary-grid { grid-template-columns: repeat(5, minmax(130px, 1fr)); margin-bottom: 20px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .metric { padding: 17px 18px; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 3px; font-size: 25px; font-weight: 780; }
    .metric .hint { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .section { margin-top: 20px; }
    .section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .section-head .count { color: var(--muted); }
    .section-head .spacer { margin-left: auto; }
    .workstream-grid { grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); }
    .ws-card { padding: 18px; transition: transform .15s ease, border-color .15s ease; }
    .ws-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .overview-entry { width: 100%; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); background: var(--panel); box-shadow: var(--shadow); text-align: left; }
    .overview-entry:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .entry-head { display: flex; align-items: center; gap: 10px; }
    .entry-head strong { font-size: 16px; }
    .entry-head .badge { margin-left: auto; }
    .entry-summary { margin-top: 5px; color: var(--muted); }
    .status-strip { height: 5px; margin-top: 12px; overflow: hidden; border-radius: 5px; background: var(--gray-bg); }
    .status-strip > span { display: block; width: 100%; height: 100%; background: var(--gray); }
    .status-strip.RUNNING > span { background: linear-gradient(90deg, var(--blue), #7db5ff, var(--blue)); background-size: 200% 100%; animation: status-flow 2.4s linear infinite; }
    .status-strip.WAITING_FOR_HUMAN > span { background: var(--yellow); animation: waiting-breathe 1.8s ease-in-out infinite; }
    .status-strip.FAILED > span, .status-strip.INVALID > span { background: var(--red); }
    .status-strip.COMPLETED > span, .status-strip.VALID > span { background: var(--green); }
    @keyframes status-flow { to { background-position: -200% 0; } }
    @keyframes waiting-breathe { 50% { opacity: .35; } }
    .ws-title { display: flex; align-items: center; gap: 10px; }
    .ws-title strong { font-size: 16px; }
    .ws-title .revision { margin-left: auto; color: var(--muted); font-size: 12px; }
    .ws-objective { min-height: 42px; margin: 10px 0; color: var(--muted); }
    .progress { height: 8px; overflow: hidden; border-radius: 8px; background: var(--gray-bg); }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2374d8, #4d9df9); }
    .progress-text { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 3px 8px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .VALID, .SATISFIED, .BASELINED, .COMPLETED, .RESOLVED, .CLOSED, .SUPPORTED, .APPROVED { color: var(--green); background: var(--green-bg); }
    .RUNNING { color: var(--blue); background: var(--blue-bg); }
    .INVALID, .FAILED, .NOT_SUPPORTED { color: var(--red); background: var(--red-bg); }
    .STALE, .REVALIDATION_REQUIRED, .PARTIALLY_STALE { color: var(--orange); background: var(--orange-bg); }
    .REVIEW_REQUIRED, .PROVISIONAL, .REVIEW, .REVISE, .WAITING_FOR_HUMAN, .OPEN, .BLOCKED, .HUMAN_REVIEW_REQUIRED, .NOT_SATISFIED, .CHANGES_REQUESTED { color: var(--yellow); background: var(--yellow-bg); }
    .WAIVED { color: var(--purple); background: var(--purple-bg); }
    .UNKNOWN, .PENDING, .RECORDED, .CANCELLED { color: var(--gray); background: var(--gray-bg); }
    .two-col { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); align-items: start; }
    .agent-grid { grid-template-columns: minmax(250px, .65fr) minmax(440px, 1.35fr); align-items: start; }
    .list-card { overflow: hidden; }
    .list-row { display: grid; grid-template-columns: minmax(150px, 1fr) auto; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); align-items: center; }
    .list-row:first-child { border-top: 0; }
    .list-row:hover { background: var(--panel-2); }
    .row-title { font-weight: 700; overflow-wrap: anywhere; }
    .row-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .empty { padding: 30px; text-align: center; color: var(--muted); }
    .attention { border-left: 4px solid var(--yellow); }
    .activity-bar { margin-top: 8px; height: 5px; border-radius: 4px; background: var(--gray-bg); overflow: hidden; }
    .activity-bar span { display: block; height: 100%; background: var(--blue); }
    .node-table { width: 100%; border-collapse: collapse; }
    .node-table th { padding: 10px 14px; text-align: left; color: var(--muted); background: var(--panel-2); font-size: 12px; }
    .node-table td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: top; }
    .node-table tr:hover td { background: var(--panel-2); }
    .node-table th:first-child { width: 46%; }
    .node-table th:nth-child(2) { width: 20%; }
    .node-progress-cell { min-width: 240px; }
    .node-progress-bar { height: 6px; margin-top: 8px; overflow: hidden; border-radius: 6px; background: var(--gray-bg); }
    .node-progress-bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2374d8, #4d9df9); }
    .node-progress-text { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .node-attention { margin-top: 6px; color: var(--amber); font-size: 12px; font-weight: 700; }
    .node-link { border: 0; padding: 0; color: var(--brand); background: transparent; text-align: left; font-weight: 700; }
    .tree-toggle { width: 22px; margin-left: -24px; border: 0; color: var(--muted); background: transparent; }
    .node-statement { max-width: 540px; margin-top: 4px; color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .node-id { margin-top: 3px; max-width: 520px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .exit-list { margin: 0; padding: 0 0 0 18px; }
    .exit-list li { margin: 6px 0; }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(10, 18, 31, .4); }
    .drawer-backdrop.open { display: block; }
    .drawer { position: absolute; top: 0; right: 0; width: min(680px, 94vw); height: 100%; overflow: auto; padding: 24px; background: var(--panel); box-shadow: -20px 0 50px rgba(0,0,0,.2); }
    .drawer-head { position: sticky; top: -24px; z-index: 2; display: flex; align-items: flex-start; gap: 14px; margin: -24px -24px 18px; padding: 22px 24px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 3px 0 0; font-size: 20px; }
    .drawer-head .close { margin-left: auto; }
    .detail-block { margin-top: 18px; }
    .detail-block h3 { margin: 0 0 8px; font-size: 14px; }
    .detail-card { padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
    .node-summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .summary-item { min-height: 88px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
    .summary-item.wide { grid-column: 1 / -1; }
    .summary-label { margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .summary-value { font-weight: 680; overflow-wrap: anywhere; }
    .notice { margin: 0 0 14px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--yellow) 35%, var(--line)); border-left: 4px solid var(--yellow); border-radius: 10px; background: var(--yellow-bg); }
    .criteria-table { width: 100%; border-collapse: collapse; }
    .criteria-table th { padding: 9px 10px; color: var(--muted); background: var(--panel-2); text-align: left; font-size: 12px; }
    .criteria-table td { padding: 10px; border-top: 1px solid var(--line); vertical-align: top; }
    .detail-group { margin-top: 12px; background: var(--panel); }
    .detail-group > summary { color: var(--text); background: var(--panel-2); }
    .detail-group-body { padding: 14px; border-top: 1px solid var(--line); }
    .metric-list { display: grid; gap: 8px; }
    .metric-row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(90px, auto) minmax(120px, auto); gap: 10px; align-items: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .compact-meta { color: var(--muted); font-size: 11px; }
    .kv { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 7px 14px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .clean-list { margin: 12px 0 0; padding-left: 20px; }
    .clean-list li + li { margin-top: 10px; }
    .tag-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 5px; }
    .tag { display: inline-flex; padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--brand); background: var(--panel); font-size: 11px; }
    .muted { color: var(--muted); }
    details { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    details + details { margin-top: 8px; }
    summary { padding: 10px 12px; cursor: pointer; font-weight: 650; }
    pre { overflow: auto; margin: 0; padding: 12px; border-top: 1px solid var(--line); color: var(--text); background: var(--panel-2); font-size: 11px; white-space: pre-wrap; word-break: break-word; }
    .document-preview { max-height: 48vh; margin: 14px 0; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; line-height: 1.65; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 18px; background: rgba(10,18,31,.55); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(540px, 96vw); max-height: 90vh; overflow: auto; padding: 22px; border-radius: var(--radius); background: var(--panel); box-shadow: 0 24px 70px rgba(0,0,0,.3); }
    .modal h2 { margin: 0 0 6px; }
    .modal p { margin: 0 0 16px; color: var(--muted); }
    .field { margin-top: 13px; }
    .field label { display: block; margin-bottom: 5px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: var(--panel-2); }
    .field textarea { min-height: 100px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 80; max-width: 420px; padding: 12px 15px; border-radius: 10px; color: white; background: #173252; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #a51d2a; }
    @media (max-width: 1050px) { .summary-grid { grid-template-columns: repeat(3, 1fr); } .two-col, .agent-grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .status-strip > span { animation: none !important; } }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .sidebar { position: static; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 9px; } .nav-label, .sidebar-foot { display: none; } .nav-item { width: auto; flex: 0 0 auto; } .nav-item .nav-state { display: none; } .topbar { padding: 0 12px; } .brand { min-width: 0; } .brand small { display: none; } .search { display: none; } main { padding: 20px 14px 50px; } .summary-grid, .node-summary-grid { grid-template-columns: repeat(2, 1fr); } .page-head { display: block; } .page-actions { margin: 12px 0 0; } .node-table th:nth-child(2), .node-table td:nth-child(2) { display: none; } .node-progress-cell { min-width: 190px; } .metric-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">VH</div><div><strong id="project-name">verif-harness</strong><small id="project-meta">正在读取项目状态</small></div></div>
    <div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索工作流、工作节点、支持材料或文件"></div>
    <div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-text">连接中</span></div>
    <button id="theme" class="icon-btn" title="切换明暗主题">◐</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"><div class="nav-label">工作流</div></aside>
    <main id="main"><div class="empty">正在加载项目状态…</div></main>
  </div>
  <div id="drawer-backdrop" class="drawer-backdrop"><aside id="drawer" class="drawer"></aside></div>
  <div id="modal-backdrop" class="modal-backdrop"><section id="modal" class="modal"></section></div>
  <div id="toast" class="toast"></div>

  <script>
    const token = document.querySelector('meta[name="verif-token"]').content;
    const initialParams = new URLSearchParams(window.location.search);
    const state = {
      snapshot: null,
      workstream: initialParams.get('workstream'),
      agentInteraction: initialParams.has('agent-interaction'),
      pendingItems: initialParams.has('pending-items'),
      riskChanges: initialParams.has('risk-changes'),
      focusAgentQuestion: initialParams.get('agent-question'),
      reviewWorkstream: initialParams.get('review-workstream'),
      reviewPlanNode: initialParams.get('review-plan-node'),
      reviewDeliveryNode: initialParams.get('review-delivery-node'),
      reviseVdocPlan: initialParams.has('revise-vdoc-plan'),
      node: initialParams.get('node'),
      connected: false,
      query: '',
      collapsedNodes: new Set(),
    };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const STATUS_LABELS = {
      VALID:'已通过检查', UNKNOWN:'尚无完成材料', INVALID:'检查未通过', STALE:'内容变化后尚未重新检查',
      REVALIDATION_REQUIRED:'需要重新检查', REVIEW_REQUIRED:'需要人工复核', PROVISIONAL:'暂定接受', BLOCKED:'当前受阻', WAIVED:'已接受例外',
      REVIEW:'等待计划评审', REVISE:'需要修改计划', ACTIVE:'正在推进', SATISFIED:'已满足', BASELINED:'已建立基线',
      RUNNING:'正在执行', PENDING:'等待执行', WAITING_FOR_HUMAN:'等待人工决定', COMPLETED:'已完成', FAILED:'执行失败', CANCELLED:'已取消',
      OPEN:'待回答', ANSWERED:'已回答', RESOLVED:'已处理', CLOSED:'已满足', NOT_SATISFIED:'尚未满足', STALE_REVISION:'不是当前版本',
      SUPPORTED:'条件已满足', NOT_SUPPORTED:'条件未满足', HUMAN_REVIEW_REQUIRED:'等待负责人确认', RECORDED:'已记录', PARTIALLY_STALE:'部分内容需要重新检查',
      APPROVED:'方案已批准', CHANGES_REQUESTED:'方案需要修改'
    };
    const ROLE_LABELS = {
      capability:'通用工作汇总', 'closure-evidence':'需要核对的运行结果', 'project-goal':'项目目标',
      'document-writing-plan':'文档撰写方案', 'document-deliverable':'文档交付',
      'document-catalog':'文档目录（内部）',
      'environment-component':'环境组件', interface:'接口接入', 'clock-reset-domain':'时钟复位域', 'observation-path':'观测路径',
      'stimulus-feature':'激励功能', 'stimulus-scenario':'激励场景',
      'checking-goal':'检查目标', checker:'结果检查模块', 'reference-path':'参考结果路径', 'assertion-group':'断言组',
      'coverage-goal':'覆盖目标', 'coverage-scope':'覆盖范围', 'case-mapping':'功能与用例对应关系', testcase:'测试用例',
      'regression-profile':'回归配置', 'regression-run-set':'回归批次', 'failure-group':'失败分组'
    };

      const writingPlans = w.nodes.filter(n => n.role === 'document-writing-plan' && n.required);
      const deliveries = w.nodes.filter(n => n.role === 'document-deliverable' && n.required);
      const requiredNodes = [...writingPlans, ...deliveries];
      const plansApproved = writingPlans.length > 0 && writingPlans.every(n => n.plan_review?.status === 'APPROVED');
      const deliveriesApproved = deliveries.length > 0 && deliveries.every(n => n.delivery_review?.status === 'APPROVED');
      const provisional = deliveries.filter(n => n.delivery_review?.status === 'PROVISIONAL');
      const changedDocuments = [...new Set(requiredNodes.filter(n => n.document?.content_changed).map(n => n.document?.path).filter(Boolean))];
      const openNodeInputs = requiredNodes.flatMap(n => n.human_actions || []).filter(item => item.status === 'OPEN');
      const changeRequests = openNodeInputs.filter(item => ['REQUEST_CHANGE','CLARIFY'].includes(item.action));
      const seenDocuments = new Map();
      requiredNodes.forEach(n => { if (n.document?.id) seenDocuments.set(n.document.id, n.document); });
      const openDocumentItems = [...seenDocuments.values()].flatMap(document => document.governance_items || [])
        .filter(item => ['PENDING','ACTIVE'].includes(item.status));
      const blockingFindings = requiredNodes.flatMap(n => n.findings || []).filter(item => item.status === 'OPEN');
      const openConfirmations = openNodeInputs.length + openDocumentItems.length + blockingFindings.length;
      const currentBindings = plansApproved && deliveriesApproved && changedDocuments.length === 0
        && writingPlans.every(n => (n.plan_review?.sections || []).every(section => section.current_review?.revision === w.revision))
        && deliveries.every(n => n.delivery_review?.current_review?.revision === w.revision);
      const engineClosed = Boolean(w.closure?.ready);
      const needsAgent = changeRequests.length > 0
        || changedDocuments.length > 0

        || deliveries.some(n => n.delivery_review?.status === 'CHANGES_REQUESTED');

      if (provisional.length) reasons.push(`${provisional.length} 个交付节点仍为暂定接受`);
      if (openConfirmations) reasons.push(`${openConfirmations} 项确认、文档问题或阻塞事项尚未关闭`);
      if (!reasons.length) reasons.push('当前没有由意见或内容变化触发的重新评审原因');
      const checklist = [

        ['所有必需文档交付节点均已批准（暂定不计）', deliveriesApproved],

        ['审批绑定当前工作流 revision 和当前文档正文', currentBindings],
        ['Engine 当前 closure 检查通过', engineClosed],
      ];
      return `<section class="section"><details class="detail-group" open><summary>VDOC Human–Agent–Engine 评审闭环与收敛</summary><div class="detail-group-body"><div class="card metric"><div class="label">当前轮次 · 工作流版本 ${w.revision}</div><div class="value" style="font-size:18px">${escapeHtml(phase)}</div><div class="hint">Agent 分析 → Engine 登记版本 → Human 评审 → 有修改则 Agent 迭代 → Human 复审 → Engine 检查收敛</div></div><div class="notice" style="margin-top:12px"><strong>这里显示的是当前状态，不是另一套审批规则。</strong> Dashboard 记录意见和结论；Agent 在工作检查点读取反馈后分析修改，Engine 校验版本与退出条件，不代替 Human 作工程判断。</div><div class="grid two-col"><div><strong>当前重新评审原因</strong><ul class="exit-list">${reasons.map(reason => `<li>${escapeHtml(reason)}</li>`).join('')}</ul></div><div><strong>当前收敛条件</strong><div class="card list-card" style="margin-top:8px">${checklist.map(([label, satisfied]) => `<div class="list-row"><div>${escapeHtml(label)}</div>${statusBadge(satisfied ? 'APPROVED' : 'PENDING')}</div>`).join('')}</div></div></div><div class="row-meta" style="margin-top:12px">完整规范：skills/verif-harness/vplan/vdoc.md · 用户操作说明：skills/verif-harness/docs/user_guide.md</div></div></details></section>`;
    }

        ${projectContextHtml(true)}
        <div class="grid summary-grid"><article class="card metric"><div class="label">当前阶段</div><div class="value" style="font-size:18px">${statusBadge(w.lifecycle)}</div><div class="hint">计划版本 ${w.revision}</div></article><article class="card metric"><div class="label">必须完成的节点</div><div class="value">${w.progress.satisfied}/${w.progress.required}</div><div class="hint">${p}% 已有明确完成结论</div></article><article class="card metric"><div class="label">当前工作</div><div class="value">${active.length}</div><div class="hint">${agentWaiting ? `其中 ${agentWaiting} 项等待负责人决定` : '已登记的实时工作'}</div></article><article class="card metric"><div class="label">等待负责人处理</div><div class="value">${openHuman.length}</div><div class="hint">可随时查看和处理</div></article><article class="card metric"><div class="label">当前还要处理</div><div class="value">${actions.length}</div><div class="hint">${w.closure.ready ? '完成条件已满足' : '仍有未完成事项'}</div></article></div>

    function nodeRows(nodes) {
      const query = state.query.toLowerCase();
      const byParent = new Map();
      nodes.forEach(n => { const key = n.parent_id || ''; if (!byParent.has(key)) byParent.set(key, []); byParent.get(key).push(n); });
      const ordered = [], visited = new Set();
      function visit(node, depth) { if (visited.has(node.id)) return; visited.add(node.id); ordered.push([node, depth]); if (!state.collapsedNodes.has(node.id) || query) (byParent.get(node.id) || []).forEach(child => visit(child, depth + 1)); }
      nodes.filter(n => !n.parent_id || !nodes.some(parent => parent.id === n.parent_id)).forEach(n => visit(n, 0));
      nodes.forEach(n => visit(n, 0));
      const filtered = ordered.filter(([n]) => !query || `${n.id} ${n.title} ${n.status} ${n.key} ${n.statement || ''}`.toLowerCase().includes(query));
      if (!filtered.length) return '<tr><td colspan="3" class="empty">没有匹配的节点</td></tr>';
      return filtered.map(([n, depth]) => {
        const children = byParent.get(n.id) || [];
        const toggle = children.length ? `<button class="tree-toggle" data-toggle-node="${escapeHtml(n.id)}" title="展开或折叠子节点">${state.collapsedNodes.has(n.id) ? '▸' : '▾'}</button>` : '';
        return `<tr><td><div style="margin-left:${depth * 22}px">${toggle}<button class="node-link" data-node="${escapeHtml(n.id)}">${escapeHtml(humanText(n.title))}</button></div></td><td><div>${escapeHtml(roleLabel(n.role))}</div><div class="row-meta">${n.required ? '必需节点' : '可选节点'}</div></td><td>${nodeProgressHtml(n)}</td></tr>`;
      }).join('');
    }
    function closureRows(items) {
      if (!items.length) return '<div class="empty">当前没有未完成项</div>';
      return items.map(a => {
        const link = a.kind === 'HUMAN_REVIEW' && a.target.startsWith('workstream:')
          ? `<button class="node-link" data-review-workstream="${escapeHtml(a.target.replace(/^workstream:/, ''))}">${escapeHtml(actionLabel(a.kind))}</button>`
          : `<button class="node-link" data-node="${escapeHtml(a.target)}">${escapeHtml(actionLabel(a.kind))}</button>`;
        return `<div class="list-row"><div>${link}<div class="row-meta">${escapeHtml(humanText(a.reason))}${a.blocked_by?.length ? ` · 有 ${a.blocked_by.length} 项依赖的工作尚未完成` : ''}</div></div><span class="badge ${a.executor === 'human' ? 'WAITING_FOR_HUMAN' : 'PENDING'}">${escapeHtml(a.executor === 'human' ? '负责人处理' : a.executor === 'reasoning' ? '需要 Agent 分析' : '系统可以自动处理')}</span></div>`;
      }).join('');
    }

        : '';
      const vdocNotice = w.workstream === 'VDOC'
        ? 'VDOC 需要逐个审批按当前 DUT 分解出的必需方案节点；节点数量随接口、功能、场景和待确认工程问题变化，全部通过后计划才进入可以实施的状态。'
        : '批准后仅表示允许 Agent 按下列目标、节点、交付物和退出条件开始工作。';
      return `<section class="section"><div class="section-head"><h2>本次审批对象：工作流实施方案</h2><span class="count">计划版本 ${w.revision}</span></div><div class="notice"><strong>这一步审批的是实施方案，不是实施内容。</strong> ${escapeHtml(vdocNotice)} 不表示文档正文、实现结果、仿真证据或节点完成状态已经通过验收。</div><div class="card"><dl class="kv"><dt>工作流</dt><dd>${escapeHtml(w.workstream)} · ${escapeHtml(workstreamLabel(w.workstream))}</dd><dt>总体目标</dt><dd>${escapeHtml(humanText(w.objective || '未登记总体目标'))}</dd><dt>计划版本</dt><dd>${w.revision}</dd></dl></div><div class="section-head"><h2>基于当前 DUT 分解的方案节点</h2><span class="count">${planNodes.length} 项</span></div>${nodes}${documentOutputs ? `<details class="detail-group"><summary>查看文档交付分类（不作为实施方案节点计数）</summary><div class="detail-group-body card"><ul>${documentOutputs}</ul></div></details>` : ''}<div class="section-head"><h2>整体退出条件</h2></div><div class="card"><ul class="exit-list">${planListHtml(w.exit_criteria, '尚未登记整体退出条件')}</ul></div></section>`;
    }

    function bindWorkstreamReviewForm(w, formId) {
      const form = $(`#${formId}`);
      form.querySelector('[data-cancel-review]').onclick = () => leaveWorkstreamReview(w.workstream);
      form.onsubmit = async event => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.target));
        data.workstream = w.workstream;
        rememberReviewer(data.reviewer);
        await post('/api/reviews/workstream', data, '工作流评审已保存', () => leaveWorkstreamReview(w.workstream, false));
      };
    }

    function renderWorkstreamReview(w) {
      if (!w) { state.reviewWorkstream = null; return renderOverview(); }
      state.workstream = w.workstream;
      const hasPlanNodes = (w.plan_node_count || 0) > 0;
      const reviewSection = !hasPlanNodes
        ? `<section class="section"><div class="notice"><strong>当前不能审批。</strong> Agent 需要先根据 DUT RTL、规格、接口和验证点形成方案工作节点；固定验证分类不作为工作节点。</div></section>`
        : w.workstream === 'VDOC'
          ? `<section class="section"><div class="notice"><strong>VDOC 不使用一次性整体批准。</strong> 请通过每个工作节点的“在新标签页审批本节点方案”逐项处理。所有必需节点通过后，系统自动汇总计划状态。</div></section>`
          : `<section class="section"><div class="section-head"><h2>提交实施方案审批</h2></div><div class="card" style="padding:20px;max-width:760px">${workstreamReviewForm(w, 'review-page-form')}</div></section>`;
      $('#main').innerHTML = `<div class="page-head"><div><h1>审批 ${escapeHtml(w.workstream)} · ${escapeHtml(workstreamLabel(w.workstream))}实施方案</h1><p>请先核对下方计划快照，再决定批准、修改、澄清或拒绝。</p></div></div>${workstreamPlanSnapshotHtml(w)}${reviewSection}`;
      bindNodeLinks();
      if (w.workstream !== 'VDOC' && hasPlanNodes) bindWorkstreamReviewForm(w, 'review-page-form');
    }

    function planSectionState(n, section) {
      return (n.plan_review?.sections || []).find(item => item.section === section);
    }

    function planSectionReviewHtml(n, section, title, content, canApprove=true) {
      const review = planSectionState(n, section);
      if (!review) return '';
      const approve = canApprove ? `<option value="approve">批准“${escapeHtml(title)}”</option>` : '';
      const history = (review.reviews || []).slice().reverse().map(item => `<div class="list-row"><div><strong>${escapeHtml(item.verdict === 'APPROVE' ? '批准' : item.verdict === 'MODIFY' ? '要求修改' : item.verdict === 'CLARIFY' ? '要求说明' : '不同意')}</strong><div class="row-meta">${escapeHtml(item.reviewer)} · ${escapeHtml(item.reason)} · ${shortTime(item.created_at)}</div></div></div>`).join('') || '<div class="empty">这个区块尚未审批</div>';
      const blocked = canApprove ? '' : '<div class="notice"><strong>这个区块暂时不能批准。</strong> 仍有待确认事项需要先处理。</div>';
      return `<section class="section"><div class="section-head"><h2>${escapeHtml(title)}</h2>${statusBadge(review.status)}</div>${blocked}<div class="card">${content}</div><div class="card" style="padding:20px;margin-top:10px;max-width:760px"><form data-plan-section-form="${escapeHtml(section)}"><div class="field"><label>本区块审批结论</label><select name="verdict">${approve}<option value="modify">要求修改本区块</option><option value="clarify">要求进一步说明</option><option value="reject">不同意本区块方案</option></select></div><div class="field"><label>审批人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>审批意见</label><textarea name="reason" placeholder="说明认可的内容，或明确需要修改、说明的部分" required></textarea></div><div class="modal-actions"><button class="btn primary">提交本区块审批</button></div></form></div><details class="detail-group"><summary>查看本区块审批历史</summary><div class="detail-group-body card list-card">${history}</div></details></section>`;
    }

    function renderNodePlanReview(n) {
      if (!n || n.workstream !== 'VDOC' || !n.plan_review) {
        state.reviewPlanNode = null;
        return renderWorkstreamReview(workstream('VDOC'));
      }
      state.workstream = 'VDOC';
      const pending = (n.human_actions || []).filter(item => item.status === 'OPEN');
      const confirmations = pending.map(item => `<div class="list-row"><div><strong>${escapeHtml(humanActionLabel(item.action))}</strong><div class="row-meta">${escapeHtml(item.reason)} · ${escapeHtml(item.reviewer)} · ${shortTime(item.created_at)}</div></div>${statusBadge(item.status)}</div>`).join('') || '<div class="empty">当前没有尚待 Human 确认的方案事项</div>';
      const outgoing = (n.outgoing || []).map(e => `<li>${escapeHtml(humanText(e.relation))} → ${escapeHtml(findNode(e.target)?.title || e.target)}</li>`).join('');
      const incoming = (n.incoming || []).map(e => `<li>${escapeHtml(findNode(e.source)?.title || e.source)} → ${escapeHtml(humanText(e.relation))}</li>`).join('');
      const confirmationSection = planSectionReviewHtml(
        n, 'human-confirmations', '待确认的工程问题',
        `<div class="list-card attention">${confirmations}</div>`, pending.length === 0,
      );
      const contentSection = planSectionReviewHtml(
        n, 'planned-content', '计划写入的具体内容',
        `<ul>${planListHtml(n.work_content)}</ul>`,
      );
      const inputsSection = planSectionReviewHtml(
        n, 'inputs-scope-deliverable', '输入依据、范围和交付对象',
        `<strong>输入依据</strong><ul>${planListHtml(n.source_refs)}</ul><strong>范围</strong><ul>${planListHtml(n.scope)}</ul><strong>交付对象</strong><ul>${planListHtml(n.deliverables)}</ul>`,
      );
      const dependencyContent = `${outgoing ? `<strong>需要先具备的内容</strong><ul>${outgoing}</ul>` : ''}${incoming ? `<strong>本方案变化后需要重新检查</strong><ul>${incoming}</ul>` : ''}`;
      const dependencySection = planSectionReviewHtml(
        n, 'dependencies-impact', '依赖和影响', dependencyContent,
      );
      $('#main').innerHTML = `<div class="page-head"><div><h1>审批文档实施方案</h1><p>${escapeHtml(humanText(n.title))} · VDOC 计划版本 ${n.plan_review.revision}</p></div><div class="page-actions"><button class="btn" data-return-vdoc>返回 VDOC 方案</button></div></div>
        <div class="notice"><strong>审批对象是当前 DUT 的这一个文档实施方案节点，不是文档正文。</strong> 批准后允许 Agent 按方案编写或完善相关文档内容；正文完成后仍需单独验收。</div>
        <section class="section"><div class="section-head"><h2>审批对象</h2>${statusBadge(n.plan_review.status)}</div><div class="card"><dl class="kv"><dt>验证对象节点</dt><dd>${escapeHtml(humanText(n.title))}</dd><dt>节点类型</dt><dd>${escapeHtml(roleLabel(n.role))}</dd><dt>节点目标</dt><dd>${escapeHtml(humanText(n.statement || '未登记'))}</dd><dt>方案版本</dt><dd>${n.plan_review.revision}</dd><dt>是否必需</dt><dd>${n.required ? '是' : '否'}</dd></dl></div></section>
        ${confirmationSection}${contentSection}${inputsSection}${dependencySection}
        <section class="section"><div class="notice"><strong>节点通过规则：</strong>以上所有必审区块都必须针对当前方案版本批准；任一区块要求修改、要求说明或拒绝，节点方案均不能通过。</div></section>`;
      $('[data-return-vdoc]').onclick = () => leaveNodePlanReview('VDOC');
      document.querySelectorAll('[data-plan-section-form]').forEach(form => {
        form.onsubmit = async event => {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          data.node = n.id;
          data.section = form.dataset.planSectionForm;
          data.definition_digest = n.plan_review.definition_digest;
          rememberReviewer(data.reviewer);
          await post('/api/reviews/node-plan-section', data, '实施方案区块审批已保存');
        };
      });
    }

    function renderVdocRevisionRequest() {
      const w = workstream('VDOC');
      if (!w) { state.reviseVdocPlan = false; return renderOverview(); }
      state.workstream = 'VDOC';
      const documents = (w.nodes || []).filter(n => n.role === 'document-catalog' && n.document);
      const params = new URLSearchParams(window.location.search);
      const initialDocument = params.get('document-key') || documents[0]?.key || '';
      const initialType = params.get('node-type') || 'document-writing-plan';
      const initialNode = params.get('node-id') || '';
      const options = documents.map(n => `<option value="${escapeHtml(n.key)}" ${n.key === initialDocument ? 'selected' : ''}>${escapeHtml(humanText(n.title))} · ${escapeHtml(n.document.path)}</option>`).join('');
      $('#main').innerHTML = `<div class="page-head"><div><h1>调整文档</h1><p>按“文档 → 节点类型 → 加/改/减节点”的顺序提交意图，由 Agent 生成新的 VDOC proposal 和差异。</p></div><div class="page-actions"><button class="btn" data-return-vdoc>返回 VDOC</button></div></div>
        <section class="section"><div class="notice"><strong>这里提交的是修订请求，不直接操作节点。</strong> 增加或修改由 Agent 分析后进入新方案版本；减少节点表示从下一版本移出并保留历史。</div><div class="card" style="padding:20px;max-width:820px"><form id="vdoc-revision-form"><div class="field"><label>1. 针对哪一个文档</label><select name="document_key" id="revision-document" required>${options}</select></div><div class="field"><label>2. 节点类型</label><select name="node_type" id="revision-node-type"><option value="document-writing-plan" ${initialType === 'document-writing-plan' ? 'selected' : ''}>文档撰写方案节点</option><option value="document-deliverable" ${initialType === 'document-deliverable' ? 'selected' : ''}>文档交付节点</option></select></div><div class="field"><label>3. 调整动作</label><select name="change_kind" id="revision-change-kind"><option value="add">增加节点</option><option value="modify" ${initialNode ? 'selected' : ''}>修改节点</option><option value="remove">减少节点（下一版本移出）</option></select></div><div class="field"><label>现有节点（修改或减少时必选）</label><select name="node_id" id="revision-node"></select></div><div class="field"><label>4. 调整内容</label><textarea name="reason" placeholder="说明需要增加、修改或移出的节点内容、原因、验收边界和预期影响" required></textarea></div><div class="field"><label>提出人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="modal-actions"><button type="button" class="btn" data-return-vdoc>取消</button><button class="btn primary">提交文档节点修订请求</button></div></form></div></section>`;
      const refreshNodeOptions = () => {
        const documentKey = $('#revision-document').value;
        const nodeType = $('#revision-node-type').value;
        const candidates = (w.nodes || []).filter(n => n.document_key === documentKey && n.role === nodeType);
        $('#revision-node').innerHTML = `<option value="">请选择现有节点</option>${candidates.map(n => `<option value="${escapeHtml(n.id)}" ${n.id === initialNode ? 'selected' : ''}>${escapeHtml(humanText(n.title))}</option>`).join('')}`;
      };
      $('#revision-document').onchange = refreshNodeOptions;
      $('#revision-node-type').onchange = refreshNodeOptions;
      refreshNodeOptions();
      document.querySelectorAll('[data-return-vdoc]').forEach(button => button.onclick = () => leaveVdocRevisionRequest('VDOC'));
      $('#vdoc-revision-form').onsubmit = async event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.target));
        const selected = documents.find(n => n.key === values.document_key);
        if (values.change_kind !== 'add' && !values.node_id) {
          toast('修改或减少节点时必须选择一个现有节点', true);
          return;
        }
        rememberReviewer(values.reviewer);
        await post('/api/human-actions', {
          target: values.node_id || 'VDOC', action: 'REQUEST_CHANGE', reviewer: values.reviewer,
          reason: values.reason,
          payload: {
            request_type: 'vdoc-node-revision',
            document_key: values.document_key,
            document_path: selected?.document?.path || '',
            node_type: values.node_type,
            source_node_id: values.node_id || null,
            change_kind: values.change_kind,
          },
        }, '文档节点修订请求已保存', () => leaveVdocRevisionRequest('VDOC', false));
      };
    }

    async function renderDocumentDeliveryReview(n) {
      if (!n || n.role !== 'document-deliverable' || !n.delivery_review) {
        state.reviewDeliveryNode = null;
        return renderWorkstream(workstream('VDOC'));
      }
      state.workstream = 'VDOC';
      $('#main').innerHTML = `<div class="page-head"><div><h1>验收文档交付节点</h1><p>${escapeHtml(humanText(n.title))}</p></div><div class="page-actions"><button class="btn" data-return-vdoc>返回 VDOC</button></div></div><div class="card empty">正在读取所属文档正文…</div>`;
      $('[data-return-vdoc]').onclick = () => leaveDocumentDeliveryReview('VDOC');
      try {
        const response = await fetch(`/api/document?selector=${encodeURIComponent(n.delivery_review.document_id)}`);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || response.statusText);
        const current = body.document;
        const pending = (current.governance_items || []).filter(item => ['PENDING','ACTIVE'].includes(item.status) && ['human-decision','external-open-question'].includes(item.kind));
        const confirmations = (n.human_actions || []).filter(item => item.status === 'OPEN');
        const approveOption = pending.length || confirmations.length ? '' : '<option value="approve">批准这个交付节点</option>';
        const history = (n.delivery_review.reviews || []).slice().reverse().map(item => `<div class="list-row"><div><strong>${escapeHtml(item.verdict === 'APPROVE' ? '批准' : item.verdict === 'PROVISIONAL' ? '暂定接受' : item.verdict === 'MODIFY' ? '要求修改' : item.verdict === 'CLARIFY' ? '要求说明' : '拒绝')}</strong><div class="row-meta">${escapeHtml(item.reviewer)} · ${escapeHtml(item.notes)}${item.provisional ? ` · 责任人：${escapeHtml(item.provisional.owner)} · 重审条件：${escapeHtml(item.provisional.review_trigger)}` : ''} · 文档版本 ${item.semantic_revision} · ${shortTime(item.created_at)}</div></div></div>`).join('') || '<div class="empty">这个交付节点尚未验收</div>';
        const pendingNotice = pending.length || confirmations.length ? `<div class="notice"><strong>暂时不能批准。</strong> 仍有 ${pending.length + confirmations.length} 个问题、工程决定或 Agent 分析事项需要 Human 逐项处理。</div>` : '';
        const confirmationRows = confirmations.map(item => `<div class="card" style="padding:18px;margin-bottom:10px"><div><strong>${escapeHtml(humanActionLabel(item.action))}</strong><div class="row-meta">${escapeHtml(item.reason)} · Agent/提出人：${escapeHtml(item.reviewer)} · ${shortTime(item.created_at)}</div></div><form data-delivery-confirmation="${escapeHtml(item.id)}" style="margin-top:14px"><div class="field"><label>Human 处理结论</label><select name="verdict"><option value="approve">确认该事项已经处理</option><option value="modify">要求修改相关正文或分析</option><option value="clarify">要求进一步说明</option><option value="reject">不同意当前处理方式</option></select></div><div class="field"><label>处理人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>处理意见</label><textarea name="resolution" required></textarea></div><button class="btn primary">提交本事项意见</button></form></div>`).join('') || '<div class="card empty">当前没有 Agent 分析后等待 Human 确认的事项</div>';
        $('#main').innerHTML = `<div class="page-head"><div><h1>验收文档交付节点</h1><p>${escapeHtml(humanText(n.title))}</p></div><div class="page-actions"><button class="btn" data-adjust-delivery>调整文档交付内容</button><button class="btn" data-return-vdoc>返回 VDOC</button></div></div>
          <div class="notice"><strong>本次只验收这一项语义内容，不是整份文档。</strong> 同一文档的其他交付节点仍需独立验收；全部必需节点通过后，所属文档才会通过。</div>${pendingNotice}
          <section class="section"><div class="section-head"><h2>交付节点与所属文档</h2>${statusBadge(n.delivery_review.status)}</div><div class="card"><dl class="kv"><dt>交付节点</dt><dd>${escapeHtml(humanText(n.title))}</dd><dt>节点类型</dt><dd>${escapeHtml(roleLabel(n.role))}</dd><dt>所属文档</dt><dd>${escapeHtml(humanText(current.title))}</dd><dt>文档路径</dt><dd class="mono">${escapeHtml(current.path)}</dd><dt>文档标识</dt><dd class="mono">${escapeHtml(n.document_key)}</dd><dt>正文版本</dt><dd>${current.semantic_revision}</dd></dl><strong>实际需要验收的正文语义</strong><ul>${planListHtml(n.work_content)}</ul><strong>语义验收标准</strong><ul>${planListHtml(n.acceptance_criteria)}</ul><strong>Agent 分析结论与质量检查</strong><ul>${planListHtml([n.statement, ...(n.quality_checks || [])].filter(Boolean))}</ul></div></section>
          <section class="section"><div class="section-head"><h2>Agent 分析后需要 Human 确认的事项</h2><span class="count">${confirmations.length} 项待处理</span></div>${confirmationRows}</section>
          <section class="section"><div class="section-head"><h2>所属文档正文</h2></div><pre class="document-preview">${escapeHtml(body.content)}</pre></section>
          <section class="section"><div class="section-head"><h2>提交本节点验收结论</h2></div><div class="card" style="padding:20px;max-width:820px"><form id="delivery-review-form"><div class="field"><label>结论</label><select name="verdict" id="delivery-verdict">${approveOption}<option value="provisional">暂定接受，允许带风险推进</option><option value="modify">要求修改本节点对应内容</option><option value="clarify">要求进一步说明</option><option value="reject">不同意本节点交付内容</option></select></div><div class="notice"><strong>暂定不等于批准。</strong> 暂定节点允许下游开始工作，但不会计入文档通过、工作流完成或最终冻结。</div><div class="field"><label>暂定责任人（选择“暂定接受”时必填）</label><input name="provisional_owner" placeholder="负责消除暂定状态的人"></div><div class="field"><label>重新评审触发条件（选择“暂定接受”时必填）</label><textarea name="review_trigger" placeholder="例如：规格冻结、接口确认、参考模型结果可用"></textarea></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>评审意见</label><textarea name="notes" placeholder="只针对这个交付节点的验收范围给出意见" required></textarea></div><div class="modal-actions"><button class="btn primary">提交本节点验收</button></div></form></div><details class="detail-group"><summary>查看本节点验收历史</summary><div class="detail-group-body card list-card">${history}</div></details></section>`;
        $('[data-return-vdoc]').onclick = () => leaveDocumentDeliveryReview('VDOC');
        $('[data-adjust-delivery]').onclick = () => openDocumentDeliveryRevisionTab(n.id);
        document.querySelectorAll('[data-delivery-confirmation]').forEach(form => {
          form.onsubmit = async event => {
            event.preventDefault();
            const values = Object.fromEntries(new FormData(event.target));
            rememberReviewer(values.reviewer);
            if (values.verdict === 'approve') {
              await post('/api/human-actions/resolve', {
                id: form.dataset.deliveryConfirmation, reviewer: values.reviewer,
                resolution: values.resolution, status: 'RESOLVED',
              }, '待确认事项已处理');
            } else {
              await post('/api/human-actions', {
                target: n.id,
                action: values.verdict === 'clarify' ? 'CLARIFY' : 'REQUEST_CHANGE',
                reviewer: values.reviewer,
                reason: `${form.dataset.deliveryConfirmation}：${values.resolution}`,
                payload: {source_confirmation: form.dataset.deliveryConfirmation, verdict: values.verdict},
              }, 'Human 意见已保存；该事项保持待处理');
            }
          };
        });
        $('#delivery-review-form').onsubmit = async event => {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          data.node = n.id;
          data.definition_digest = n.delivery_review.definition_digest;
          data.document_digest = n.delivery_review.document_digest;
          rememberReviewer(data.reviewer);
          await post('/api/reviews/document-delivery', data, '文档交付节点评审已保存');
        };
      } catch (error) {
        toast(`读取文档失败：${error}`, true);
      }
    }

    function evidenceContractHtml(contract, evidence=[]) {
      if (!contract) return '<div class="detail-card empty">尚未写清这项工作完成时需要哪些材料，因此目前不能判断它已经完成</div>';
      const requirements = (contract.requirements || []).map(item => {

    }
    function openWaiveModal(n) {
      openModal(`<h2>接受未满足项</h2><p>接受例外不等于验证通过。请确认风险、依据和影响；该操作会把节点标记为已接受例外。</p><form id="waive-form"><div class="field"><label>节点</label><input value="${escapeHtml(n.id)}" disabled></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>理由和依据</label><textarea name="reason" required></textarea></div><div class="field"><label><input name="confirm" type="checkbox" style="width:auto" required> 我确认这是人工作出的明确工程决定</label></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn danger">确认接受例外</button></div></form>`);
      $('#waive-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.node = n.id; data.confirm = true; rememberReviewer(data.reviewer); await post('/api/waive', data, '例外决定已记录'); };
    }
    async function post(path, data, success, afterSuccess=null) {
      try { const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json','X-Verif-Token':token}, body:JSON.stringify(data)}); const body = await response.json(); if (!response.ok) throw new Error(body.error || response.statusText); if (afterSuccess) afterSuccess(body); setSnapshot(body.snapshot); closeModal(); toast(success); }
      catch (error) { toast(String(error), true); }
    }
    $('#drawer-backdrop').onclick = event => { if (event.target === $('#drawer-backdrop')) closeDrawer(); };
    $('#modal-backdrop').onclick = event => { if (event.target === $('#modal-backdrop')) closeModal(); };
    $('#search').oninput = event => { state.query = event.target.value.trim(); if (state.workstream) renderWorkstream(workstream(state.workstream)); else if (state.query) { const match = allNodes().find(n => `${n.id} ${n.title}`.toLowerCase().includes(state.query.toLowerCase())); if (match) { state.node = match.id; renderDrawer(match.id); } } };
    $('#theme').onclick = () => { const dark = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = dark ? '' : 'dark'; localStorage.setItem('verif-theme', dark ? 'light' : 'dark'); };
    if (localStorage.getItem('verif-theme') === 'dark' || (!localStorage.getItem('verif-theme') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    initialLoad();
  </script>
</body>
</html>
