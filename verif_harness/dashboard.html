<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="verif-token" content="__VERIF_DASHBOARD_TOKEN__">
  <title>verif-harness · 验证项目看板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb; --panel: #ffffff; --panel-2: #f8fafc; --text: #172033;
      --muted: #637083; --line: #dfe5ee; --brand: #195fb8; --brand-2: #eaf3ff;
      --green: #147a4b; --green-bg: #eaf8f1; --red: #b4232f; --red-bg: #fff0f1;
      --yellow: #8a5a00; --yellow-bg: #fff7df; --orange: #b54708; --orange-bg: #fff2e8;
      --blue: #175cd3; --blue-bg: #eaf2ff; --purple: #6941c6; --purple-bg: #f3efff;
      --gray: #596579; --gray-bg: #eef1f5; --shadow: 0 12px 34px rgba(30, 48, 78, .08);
      --radius: 14px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1523; --panel: #141f30; --panel-2: #182538; --text: #edf3fb;
      --muted: #a1afc2; --line: #2b3b52; --brand: #79b5ff; --brand-2: #173252;
      --green: #74d6a6; --green-bg: #173b2c; --red: #ff9ca5; --red-bg: #48242a;
      --yellow: #ffd37a; --yellow-bg: #46391d; --orange: #ffad73; --orange-bg: #482e1c;
      --blue: #8bc0ff; --blue-bg: #1b3658; --purple: #c4adff; --purple-bg: #352958;
      --gray: #b4c0d0; --gray-bg: #2a3545; --shadow: 0 12px 34px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .topbar { position: sticky; top: 0; z-index: 20; height: 68px; display: flex; align-items: center; gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(12px); }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 260px; }
    .logo { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: white; font-weight: 800; background: linear-gradient(145deg, #0d4f9f, #2f80ed); box-shadow: 0 7px 18px rgba(25, 95, 184, .25); }
    .brand strong { display: block; font-size: 15px; }
    .brand small { color: var(--muted); }
    .search { flex: 1; max-width: 620px; position: relative; }
    .search input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel-2); outline: none; }
    .search span { position: absolute; left: 13px; top: 9px; color: var(--muted); }
    .connection { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #98a2b3; }
    .dot.live { background: #22a663; box-shadow: 0 0 0 4px rgba(34,166,99,.12); }
    .dot.offline { background: #e5484d; }
    .icon-btn { border: 1px solid var(--line); color: var(--text); background: var(--panel); border-radius: 9px; padding: 8px 10px; }
    .layout { min-height: calc(100vh - 68px); display: grid; grid-template-columns: 238px minmax(0, 1fr); }
    .sidebar { border-right: 1px solid var(--line); background: var(--panel); padding: 22px 14px; }
    .nav-label { padding: 0 10px 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border: 0; border-radius: 9px; color: var(--text); background: transparent; text-align: left; }
    .nav-item:hover { background: var(--panel-2); }
    .nav-item.active { color: var(--brand); background: var(--brand-2); font-weight: 700; }
    .nav-item .nav-code { width: 52px; font-weight: 800; }
    .nav-item .nav-state { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
    .sidebar-foot { margin-top: 26px; padding: 14px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    main { min-width: 0; padding: 28px clamp(18px, 3vw, 42px) 64px; }
    .page-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
    .page-head h1 { margin: 0 0 5px; font-size: clamp(23px, 2vw, 31px); line-height: 1.25; }
    .page-head p { margin: 0; color: var(--muted); max-width: 850px; }
    .page-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn { border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; color: var(--text); background: var(--panel); font-weight: 650; }
    .btn:hover { border-color: var(--brand); }
    .btn.primary { color: white; background: #195fb8; border-color: #195fb8; }
    .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
    .btn.small { padding: 6px 9px; font-size: 12px; }
    .grid { display: grid; gap: 16px; }
    .summary-grid { grid-template-columns: repeat(5, minmax(130px, 1fr)); margin-bottom: 20px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .metric { padding: 17px 18px; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 3px; font-size: 25px; font-weight: 780; }
    .metric .hint { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .section { margin-top: 20px; }
    .section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .section-head .count { color: var(--muted); }
    .section-head .spacer { margin-left: auto; }
    .workstream-grid { grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); }
    .ws-card { padding: 18px; transition: transform .15s ease, border-color .15s ease; }
    .ws-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
    .ws-title { display: flex; align-items: center; gap: 10px; }
    .ws-title strong { font-size: 16px; }
    .ws-title .revision { margin-left: auto; color: var(--muted); font-size: 12px; }
    .ws-objective { min-height: 42px; margin: 10px 0; color: var(--muted); }
    .progress { height: 8px; overflow: hidden; border-radius: 8px; background: var(--gray-bg); }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2374d8, #4d9df9); }
    .progress-text { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 3px 8px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .VALID, .SATISFIED, .BASELINED, .COMPLETED, .RESOLVED, .CLOSED, .SUPPORTED { color: var(--green); background: var(--green-bg); }
    .RUNNING { color: var(--blue); background: var(--blue-bg); }
    .INVALID, .FAILED, .NOT_SUPPORTED { color: var(--red); background: var(--red-bg); }
    .STALE, .REVALIDATION_REQUIRED, .PARTIALLY_STALE { color: var(--orange); background: var(--orange-bg); }
    .REVIEW_REQUIRED, .REVIEW, .REVISE, .WAITING_FOR_HUMAN, .OPEN, .BLOCKED, .HUMAN_REVIEW_REQUIRED, .NOT_SATISFIED { color: var(--yellow); background: var(--yellow-bg); }
    .WAIVED { color: var(--purple); background: var(--purple-bg); }
    .UNKNOWN, .PENDING, .RECORDED, .CANCELLED { color: var(--gray); background: var(--gray-bg); }
    .two-col { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); align-items: start; }
    .list-card { overflow: hidden; }
    .list-row { display: grid; grid-template-columns: minmax(150px, 1fr) auto; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); align-items: center; }
    .list-row:first-child { border-top: 0; }
    .list-row:hover { background: var(--panel-2); }
    .row-title { font-weight: 700; overflow-wrap: anywhere; }
    .row-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .empty { padding: 30px; text-align: center; color: var(--muted); }
    .attention { border-left: 4px solid var(--yellow); }
    .activity-bar { margin-top: 8px; height: 5px; border-radius: 4px; background: var(--gray-bg); overflow: hidden; }
    .activity-bar span { display: block; height: 100%; background: var(--blue); }
    .node-table { width: 100%; border-collapse: collapse; }
    .node-table th { padding: 10px 14px; text-align: left; color: var(--muted); background: var(--panel-2); font-size: 12px; }
    .node-table td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: top; }
    .node-table tr:hover td { background: var(--panel-2); }
    .node-link { border: 0; padding: 0; color: var(--brand); background: transparent; text-align: left; font-weight: 700; }
    .tree-toggle { width: 22px; margin-left: -24px; border: 0; color: var(--muted); background: transparent; }
    .node-statement { max-width: 540px; margin-top: 4px; color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .node-id { margin-top: 3px; max-width: 520px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .exit-list { margin: 0; padding: 0 0 0 18px; }
    .exit-list li { margin: 6px 0; }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(10, 18, 31, .4); }
    .drawer-backdrop.open { display: block; }
    .drawer { position: absolute; top: 0; right: 0; width: min(680px, 94vw); height: 100%; overflow: auto; padding: 24px; background: var(--panel); box-shadow: -20px 0 50px rgba(0,0,0,.2); }
    .drawer-head { position: sticky; top: -24px; z-index: 2; display: flex; align-items: flex-start; gap: 14px; margin: -24px -24px 18px; padding: 22px 24px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 3px 0 0; font-size: 20px; }
    .drawer-head .close { margin-left: auto; }
    .detail-block { margin-top: 18px; }
    .detail-block h3 { margin: 0 0 8px; font-size: 14px; }
    .detail-card { padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
    .node-summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .summary-item { min-height: 88px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
    .summary-item.wide { grid-column: 1 / -1; }
    .summary-label { margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .summary-value { font-weight: 680; overflow-wrap: anywhere; }
    .notice { margin: 0 0 14px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--yellow) 35%, var(--line)); border-left: 4px solid var(--yellow); border-radius: 10px; background: var(--yellow-bg); }
    .criteria-table { width: 100%; border-collapse: collapse; }
    .criteria-table th { padding: 9px 10px; color: var(--muted); background: var(--panel-2); text-align: left; font-size: 12px; }
    .criteria-table td { padding: 10px; border-top: 1px solid var(--line); vertical-align: top; }
    .detail-group { margin-top: 12px; background: var(--panel); }
    .detail-group > summary { color: var(--text); background: var(--panel-2); }
    .detail-group-body { padding: 14px; border-top: 1px solid var(--line); }
    .metric-list { display: grid; gap: 8px; }
    .metric-row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(90px, auto) minmax(120px, auto); gap: 10px; align-items: center; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .compact-meta { color: var(--muted); font-size: 11px; }
    .kv { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 7px 14px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .clean-list { margin: 12px 0 0; padding-left: 20px; }
    .clean-list li + li { margin-top: 10px; }
    .tag-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 5px; }
    .tag { display: inline-flex; padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--brand); background: var(--panel); font-size: 11px; }
    .muted { color: var(--muted); }
    details { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    details + details { margin-top: 8px; }
    summary { padding: 10px 12px; cursor: pointer; font-weight: 650; }
    pre { overflow: auto; margin: 0; padding: 12px; border-top: 1px solid var(--line); color: var(--text); background: var(--panel-2); font-size: 11px; white-space: pre-wrap; word-break: break-word; }
    .document-preview { max-height: 48vh; margin: 14px 0; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; line-height: 1.65; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 18px; background: rgba(10,18,31,.55); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(540px, 96vw); max-height: 90vh; overflow: auto; padding: 22px; border-radius: var(--radius); background: var(--panel); box-shadow: 0 24px 70px rgba(0,0,0,.3); }
    .modal h2 { margin: 0 0 6px; }
    .modal p { margin: 0 0 16px; color: var(--muted); }
    .field { margin-top: 13px; }
    .field label { display: block; margin-bottom: 5px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: var(--panel-2); }
    .field textarea { min-height: 100px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 80; max-width: 420px; padding: 12px 15px; border-radius: 10px; color: white; background: #173252; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #a51d2a; }
    @media (max-width: 1050px) { .summary-grid { grid-template-columns: repeat(3, 1fr); } .two-col { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .sidebar { position: static; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 9px; } .nav-label, .sidebar-foot { display: none; } .nav-item { width: auto; flex: 0 0 auto; } .nav-item .nav-state { display: none; } .topbar { padding: 0 12px; } .brand { min-width: 0; } .brand small { display: none; } .search { display: none; } main { padding: 20px 14px 50px; } .summary-grid, .node-summary-grid { grid-template-columns: repeat(2, 1fr); } .page-head { display: block; } .page-actions { margin: 12px 0 0; } .node-table th:nth-child(3), .node-table td:nth-child(3) { display: none; } .metric-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">VH</div><div><strong id="project-name">verif-harness</strong><small id="project-meta">正在读取项目状态</small></div></div>
    <div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索工作域、节点、证据或文件"></div>
    <div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-text">连接中</span></div>
    <button id="theme" class="icon-btn" title="切换明暗主题">◐</button>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"><div class="nav-label">验证工作域</div></aside>
    <main id="main"><div class="empty">正在加载 Dashboard…</div></main>
  </div>
  <div id="drawer-backdrop" class="drawer-backdrop"><aside id="drawer" class="drawer"></aside></div>
  <div id="modal-backdrop" class="modal-backdrop"><section id="modal" class="modal"></section></div>
  <div id="toast" class="toast"></div>

  <script>
    const token = document.querySelector('meta[name="verif-token"]').content;
    const state = { snapshot: null, workstream: null, node: null, connected: false, query: '', collapsedNodes: new Set() };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const STATUS_LABELS = {
      VALID:'证据有效', UNKNOWN:'尚未证明', INVALID:'验证失败', STALE:'内容已变化',
      REVALIDATION_REQUIRED:'需要重新验证', REVIEW_REQUIRED:'需要人工复核', BLOCKED:'当前受阻', WAIVED:'已接受例外',
      REVIEW:'等待计划评审', REVISE:'需要修改计划', ACTIVE:'正在推进', SATISFIED:'已满足', BASELINED:'已建立基线',
      RUNNING:'正在执行', PENDING:'等待执行', WAITING_FOR_HUMAN:'等待人工决定', COMPLETED:'已完成', FAILED:'执行失败', CANCELLED:'已取消',
      OPEN:'待处理', RESOLVED:'已处理', CLOSED:'已满足', NOT_SATISFIED:'尚未满足', STALE_REVISION:'不是当前版本',
      SUPPORTED:'已有依据', NOT_SUPPORTED:'缺少依据', HUMAN_REVIEW_REQUIRED:'需要人工判断', RECORDED:'已记录', PARTIALLY_STALE:'部分需要重验'
    };
    const ROLE_LABELS = {
      capability:'能力汇总', 'closure-evidence':'运行结果汇总', 'project-goal':'项目目标',
      'document-section':'文档工程主题', 'engineering-decision':'工程决定',
      'environment-component':'环境组件', interface:'接口接入', 'clock-reset-domain':'时钟复位域', 'observation-path':'观测路径',
      'stimulus-feature':'激励功能', 'stimulus-scenario':'激励场景',
      'checking-goal':'检查目标', checker:'结果检查模块', 'reference-path':'参考结果路径', 'assertion-group':'断言组',
      'coverage-goal':'覆盖目标', 'coverage-scope':'覆盖范围', 'case-mapping':'功能与用例对应关系', testcase:'测试用例',
      'regression-profile':'回归配置', 'regression-run-set':'回归批次', 'failure-group':'失败分组'
    };
    const ACTION_LABELS = {
      PLAN_PREREQUISITE:'先补充前置计划', WAIT_FOR_DEPENDENCY:'等待前置目标完成', REVALIDATE:'重新验证',
      REPAIR_OR_REPLAN:'修复问题或调整计划', SATISFY_DESIRED_STATE:'完成当前目标',
      EXIT_CRITERION_BLOCKED:'处理退出条件', RESOLVE_FINDING:'处理待解决问题', HUMAN_REVIEW:'等待人工评审'
    };
    const WORKSTREAM_LABELS = {
      VDOC:'验证文档', VENV:'验证环境', VSTIM:'激励', VCHK:'结果检查',
      VCOV:'覆盖率', VCASE:'测试用例', VREG:'回归测试'
    };
    const DOCUMENT_ITEM_LABELS = {
      'human-decision':'需要人工决定', 'external-open-question':'待回答问题',
      provisional:'暂定方案', assumption:'待验证假设'
    };
    const WORKSTREAM_NODE_GUIDANCE = {
      VDOC:'文档节点用于归类正式文档；子节点应说明文档中的验证点、接口约定、策略、开放问题或关键决定。',
      VENV:'节点应落到具体接口、时钟复位域、环境组件、构建入口或观测路径。',
      VSTIM:'节点应落到具体激励功能或场景，并说明生成、驱动、DUT 接收和重复运行结果。',
      VCHK:'节点应落到具体检查目标、结果检查模块、参考结果路径或断言组，并说明实际启用情况。',
      VCOV:'节点应落到具体覆盖目标或覆盖范围，并说明必需项、命中、排除和当前覆盖率数据。',
      VCASE:'节点应落到功能与用例的对应关系或具体测试用例，并说明配置与定向运行结果。',
      VREG:'节点应落到回归配置、回归批次或失败分组，并说明用例集合、随机种子、结果和处理状态。'
    };
    const statusBadge = (value) => `<span class="badge ${escapeHtml(value)}" title="系统值：${escapeHtml(value)}">${escapeHtml(STATUS_LABELS[value] || value)}</span>`;
    const roleLabel = value => ROLE_LABELS[value] || value || '未说明';
    const actionLabel = value => ACTION_LABELS[value] || value || '暂无后续工作';
    const workstreamLabel = value => WORKSTREAM_LABELS[value] || value || '未分类';
    const documentItemLabel = value => DOCUMENT_ITEM_LABELS[value] || value || '文档事项';
    const shortTime = (value) => value ? new Date(value).toLocaleString('zh-CN', {hour12:false}) : '—';
    const percent = (progress) => progress.required ? Math.round(progress.satisfied * 100 / progress.required) : 0;
    const activeActivity = (items) => (items || []).find(a => ['PENDING','RUNNING','WAITING_FOR_HUMAN'].includes(a.status));
    const pendingHuman = (items) => (items || []).filter(a => a.status === 'OPEN');
    const allNodes = () => state.snapshot?.model?.nodes || [];
    const workstream = (name) => state.snapshot?.workstreams?.find(w => w.workstream === name);

    function toast(message, error=false) {
      const node = $('#toast'); node.textContent = message; node.className = `toast show${error ? ' error' : ''}`;

    function wsCard(w) {

    function humanRows(items) {

    function nodeClass(n) {

    function valueText(value) {
      if (value === undefined || value === null || value === '') return '尚无测量';

      if (typeof value === 'object') return Object.entries(value).map(([key, item]) => `${key}: ${valueText(item)}`).join('；');

    function observedMetric(n, measure) {

      const keys = [measure.id, measure.id.replaceAll('-', '_'), measure.id.replaceAll('_', '-')];

    function progressBrief(n) {

    function nextAction(n) {

    function nodeRows(nodes) {

      const ordered = [], visited = new Set();
      function visit(node, depth) { if (visited.has(node.id)) return; visited.add(node.id); ordered.push([node, depth]); if (!state.collapsedNodes.has(node.id) || query) (byParent.get(node.id) || []).forEach(child => visit(child, depth + 1)); }
      nodes.filter(n => !n.parent_id || !nodes.some(parent => parent.id === n.parent_id)).forEach(n => visit(n, 0));
      nodes.forEach(n => visit(n, 0));
      const filtered = ordered.filter(([n]) => !query || `${n.id} ${n.title} ${n.status} ${n.key} ${n.statement || ''}`.toLowerCase().includes(query));

    function evidenceContractHtml(contract, evidence=[]) {

    }
    function closureAssessmentHtml(assessment) {
      if (!assessment) return '<div class="detail-card empty">尚未生成完成判断</div>';
      const dependencyRows = (assessment.dependency_blockers || []).map(item =>
        `<li>${escapeHtml(item.title)} · ${statusBadge(item.status)}<div class="compact-meta mono">${escapeHtml(item.id)}</div></li>`
      ).join('') || '<li>没有未满足的前置节点</li>';
      const reviewRows = (assessment.reviews || []).slice().reverse().map(item =>
        `<div class="list-row"><div><div class="row-title">${escapeHtml(item.verdict === 'APPROVE' ? '认可判断' : item.verdict === 'MODIFY' ? '要求修改' : item.verdict === 'CLARIFY' ? '要求说明' : '拒绝判断')} · ${escapeHtml(item.reviewer)}</div><div class="row-meta">${escapeHtml(item.reason)} · 计划版本 ${item.revision} · ${shortTime(item.created_at)}</div></div></div>`
      ).join('') || '<div class="empty">尚未评审这份完成判断</div>';
      return `<div class="detail-card"><dl class="kv"><dt>系统判断</dt><dd>${statusBadge(assessment.conclusion)}</dd><dt>节点状态</dt><dd>${statusBadge(assessment.node_status)}</dd><dt>计划版本</dt><dd>${assessment.revision}</dd><dt>判断时间</dt><dd>${shortTime(assessment.evaluated_at)}</dd><dt>判断规则</dt><dd class="mono">${escapeHtml(assessment.rule_version)}</dd><dt>内容摘要</dt><dd class="mono" title="${escapeHtml(assessment.digest)}">${escapeHtml(assessment.digest.slice(0, 12))}…</dd></dl><strong>判断原因</strong><ul>${(assessment.reasons || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li>未说明</li>'}</ul><strong>未满足的前置节点</strong><ul>${dependencyRows}</ul><strong>待处理问题</strong><ul>${(assessment.open_findings || []).map(item => `<li>${escapeHtml(item.severity)} · ${escapeHtml(item.details)}</li>`).join('') || '<li>无</li>'}</ul><p class="muted">人工认可只确认这份解释符合当前材料，不会创建通过证据，也不会把未完成节点改成已完成。</p></div><details class="detail-group"><summary>查看人工评审记录</summary><div class="detail-group-body card list-card">${reviewRows}</div></details>`;
    }
    function findNode(id) {
      for (const w of state.snapshot.workstreams) { const node = w.nodes.find(n => n.id === id); if (node) return node; }
      const raw = allNodes().find(n => n.id === id); if (!raw) return null;
      const evidence = state.snapshot.model.evidence.filter(e => e.subject === id), findings = state.snapshot.model.findings.filter(f => f.subject === id);
      return {...raw, evidence, findings, activities: state.snapshot.activities.filter(a => a.node_id === id), incoming: state.snapshot.model.edges.filter(e => e.target === id), outgoing: state.snapshot.model.edges.filter(e => e.source === id)};
    }
    function documentNodeHtml(document) {
      if (!document) return '';
      const pending = (document.governance_items || []).filter(item => ['PENDING','ACTIVE'].includes(item.status));
      const items = (document.governance_items || []).map(item => `<div class="list-row"><div><strong>${escapeHtml(item.title)}</strong><div class="row-meta">${escapeHtml(item.id)} · ${escapeHtml(documentItemLabel(item.kind))}${item.anchor ? ` · ${escapeHtml(item.anchor)}` : ''}</div></div>${statusBadge(item.status)}</div>`).join('') || '<div class="empty">没有登记文档内事项</div>';
      const reviews = (document.reviews || []).slice().reverse().map(item => `<div class="list-row"><div><strong>${escapeHtml(item.verdict === 'APPROVE' ? '认可当前正文' : item.verdict === 'MODIFY' ? '要求修改' : item.verdict === 'CLARIFY' ? '要求说明' : '拒绝')}</strong><div class="row-meta">${escapeHtml(item.reviewer)} · ${escapeHtml(item.notes)} · ${shortTime(item.created_at)}</div></div></div>`).join('') || '<div class="empty">当前正文版本尚未评审</div>';
      return `<div class="detail-card"><dl class="kv"><dt>文档</dt><dd class="mono">${escapeHtml(document.path)}</dd><dt>正文版本</dt><dd>${document.semantic_revision}</dd><dt>正文状态</dt><dd>${statusBadge(document.effective_status)}</dd><dt>待回答问题</dt><dd>${pending.length}</dd><dt>内容是否变化</dt><dd>${document.content_changed ? '是，需要重新同步和评审' : '否'}</dd></dl></div><strong>文档中的问题和决定</strong><div class="card list-card">${items}</div><strong>正文评审记录</strong><div class="card list-card">${reviews}</div>`;
    }
    function renderDrawer(id) {
      const n = findNode(id); if (!n) { toast(`找不到节点 ${id}`, true); return; }
      const assessment = n.closure_assessment || {}, action = nextAction(n);
      const genericNotice = n.document
        ? '<div class="notice"><strong>这是正式文档节点。</strong> 工程内容以 Markdown 正文为准；待回答问题、工程决定和评审记录在节点内单独展示。</div>'
        : n.definition_origin === 'project-proposal' ? '' : `<div class="notice"><strong>这是通用汇总节点。</strong> 它用于汇总共同检查点，不等于一项具体工程工作。实际功能、场景或实现应在项目节点中展开。</div>`;
      $('#drawer-backdrop').classList.add('open');
      $('#drawer').innerHTML = `<div class="drawer-head"><div><div>${statusBadge(n.status)} <span class="badge UNKNOWN">${escapeHtml(nodeClass(n))}</span></div><h2>${escapeHtml(n.title)}</h2><div class="row-meta">${escapeHtml(n.document ? '正式验证文档' : roleLabel(n.role))} · ${escapeHtml(n.workstream || '未归属工作域')}</div><div class="node-id mono" title="内部节点编号">${escapeHtml(n.id)}</div></div><button class="icon-btn close" id="close-drawer">✕</button></div>
        ${genericNotice}<div class="node-summary-grid"><div class="summary-item wide"><div class="summary-label">要达到什么</div><div class="summary-value">${escapeHtml(n.statement || '尚未登记具体目标')}</div></div><div class="summary-item"><div class="summary-label">当前完成判断</div><div class="summary-value">${statusBadge(assessment.conclusion || n.status)}<div class="compact-meta">${escapeHtml((assessment.reasons || [])[0] || '尚未说明原因')}</div></div></div><div class="summary-item"><div class="summary-label">实际进度</div><div class="summary-value">${escapeHtml(progressBrief(n))}</div></div><div class="summary-item"><div class="summary-label">主要阻塞</div><div class="summary-value">${escapeHtml(mainBlocker(n))}</div></div><div class="summary-item"><div class="summary-label">下一步</div><div class="summary-value">${escapeHtml(action.label)}<div class="compact-meta">${escapeHtml(action.reason)}</div></div></div><div class="summary-item wide"><div class="summary-label">是否需要人工处理</div><div class="summary-value">${escapeHtml(humanNeed(n))}</div></div></div>
        <div class="page-actions" style="margin:14px 0 0"><button class="btn primary" id="node-comment">评论或要求调整</button>${n.document ? '<button class="btn primary" id="document-review">查看并评审文档</button>' : ''}${n.closure_assessment ? '<button class="btn" id="node-closure-review">评审完成判断</button>' : ''}${n.workstream ? '<button class="btn danger" id="node-waive">接受例外</button>' : ''}</div>
        <section class="detail-block"><h3>完成条件与当前依据</h3>${criteriaTableHtml(n)}</section>
        <section class="detail-block"><h3>进度指标</h3>${progressHtml(n)}</section>
        ${n.document ? `<details class="detail-group" open><summary>文档正文、问题和评审状态</summary><div class="detail-group-body">${documentNodeHtml(n.document)}</div></details>` : ''}
        <details class="detail-group"><summary>具体工作、实现方式和交付物</summary><div class="detail-group-body"><div class="detail-card"><dl class="kv"><dt>用途</dt><dd>${escapeHtml(n.purpose || '未登记')}</dd><dt>父节点</dt><dd>${escapeHtml(n.parent_key || '无')}</dd><dt>最近更新</dt><dd>${shortTime(n.updated_at)}</dd></dl><strong>工作范围</strong><ul>${(n.scope || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li>未登记</li>'}</ul><strong>具体工作</strong><ul>${(n.work_content || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li>未登记</li>'}</ul><strong>实现方式</strong><ul>${(n.implementation_approach || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li>未登记</li>'}</ul><strong>交付物</strong><ul>${(n.deliverables || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li>未登记</li>'}</ul><strong>依据来源</strong><ul>${(n.source_refs || []).map(item => `<li>${escapeHtml(item)}</li>`).join('') || '<li>未登记</li>'}</ul></div></div></details>
        <details class="detail-group" open><summary>需要的证据和已经收到的材料</summary><div class="detail-group-body">${evidenceContractHtml(n.evidence_contract, n.evidence || [])}</div></details>
        <details class="detail-group"><summary>完成判断的详细依据</summary><div class="detail-group-body">${closureAssessmentHtml(n.closure_assessment)}</div></details>
        <details class="detail-group"><summary>前置关系、影响范围和当前工作</summary><div class="detail-group-body"><div class="detail-card"><strong>它依赖什么</strong><ul>${(n.outgoing || []).map(e => `<li>${escapeHtml(e.relation)} → <span class="mono">${escapeHtml(e.target)}</span></li>`).join('') || '<li>无</li>'}</ul><strong>什么依赖它</strong><ul>${(n.incoming || []).map(e => `<li><span class="mono">${escapeHtml(e.source)}</span> → ${escapeHtml(e.relation)}</li>`).join('') || '<li>无</li>'}</ul></div><div class="card list-card" style="margin-top:10px">${activityRows((n.activities || []).filter(a => ['PENDING','RUNNING','WAITING_FOR_HUMAN'].includes(a.status)))}</div></div></details>
        <details class="detail-group"><summary>待处理问题和证据原始记录</summary><div class="detail-group-body"><div class="card list-card">${(n.findings || []).map(f => `<div class="list-row"><div><div class="row-title">${escapeHtml(f.severity)} · ${escapeHtml(f.details)}</div><div class="row-meta">${escapeHtml(f.id)}</div></div>${statusBadge(f.status)}</div>`).join('') || '<div class="empty">没有待处理问题</div>'}</div>${(n.evidence || []).slice().reverse().map(e => `<details><summary>${escapeHtml(e.kind)} · ${statusBadge(e.verdict === 'PASS' ? 'VALID' : 'INVALID')} · ${shortTime(e.created_at)}</summary><pre>${escapeHtml(JSON.stringify(e, null, 2))}</pre></details>`).join('') || '<div class="detail-card empty">尚无证据</div>'}</div></details>`;
      $('#close-drawer').onclick = closeDrawer;
      $('#node-comment').onclick = () => openHumanModal(n.id);
      if ($('#node-closure-review')) $('#node-closure-review').onclick = () => openNodeClosureReviewModal(n);
      if ($('#document-review')) $('#document-review').onclick = () => openDocumentReviewModal(n.document);
      if ($('#node-waive')) $('#node-waive').onclick = () => openWaiveModal(n);
    }
    function closeDrawer() { state.node = null; $('#drawer-backdrop').classList.remove('open'); }
    function openModal(html) { $('#modal').innerHTML = html; $('#modal-backdrop').classList.add('open'); document.querySelectorAll('[data-close-modal]').forEach(b => b.onclick = closeModal); }
    function closeModal() { $('#modal-backdrop').classList.remove('open'); }
    function reviewerValue() { return localStorage.getItem('verif-reviewer') || ''; }
    function rememberReviewer(value) { if (value) localStorage.setItem('verif-reviewer', value); }
    function openHumanModal(target) {
      openModal(`<h2>提交人工意见</h2><p>随时评论、要求说明或要求调整。此操作不会直接把节点改成已完成。</p><form id="human-form"><div class="field"><label>目标</label><input name="target" value="${escapeHtml(target)}" required></div><div class="field"><label>要做什么</label><select name="action"><option value="COMMENT">补充评论</option><option value="REQUEST_CHANGE">要求修改</option><option value="CLARIFY">要求说明</option><option value="PRIORITIZE">调整优先级</option><option value="ACKNOWLEDGE">确认已阅</option></select></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>说明</label><textarea name="reason" placeholder="说明判断、依据和期望动作" required></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn primary">提交</button></div></form>`);
      $('#human-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); rememberReviewer(data.reviewer); await post('/api/human-actions', data, '人工意见已保存'); };
    }
    function openReviewModal(w) {
      openModal(`<h2>评审 ${escapeHtml(w.workstream)} 计划版本 ${w.revision}</h2><p>可以随时评审当前计划。批准计划不表示实现和验证已经完成。</p><form id="review-form"><div class="field"><label>结论</label><select name="verdict"><option value="approve">同意当前计划</option><option value="modify">要求修改</option><option value="clarify">要求进一步说明</option><option value="reject">不同意当前计划</option></select></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>理由</label><textarea name="reason" required></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn primary">提交评审</button></div></form>`);
      $('#review-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.workstream = w.workstream; rememberReviewer(data.reviewer); await post('/api/reviews/workstream', data, '工作域评审已保存'); };
    }
    function openNodeClosureReviewModal(n) {
      const a = n.closure_assessment;
      openModal(`<h2>评审节点完成判断</h2><p><span class="mono">${escapeHtml(n.id)}</span> 当前系统判断：${statusBadge(a.conclusion)}。认可只确认判断依据合理，不会创建通过证据。</p><form id="node-closure-form"><div class="field"><label>结论</label><select name="verdict"><option value="approve">认可当前判断及依据</option><option value="modify">要求修改判断或补充材料</option><option value="clarify">要求进一步说明</option><option value="reject">当前判断不正确</option></select></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>评审理由</label><textarea name="reason" placeholder="指出认可的依据，或明确哪项证据、依赖、规则或完成条件不正确" required></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn primary">提交节点评审</button></div></form>`);
      $('#node-closure-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.node = n.id; data.assessment_digest = a.digest; rememberReviewer(data.reviewer); await post('/api/reviews/node-closure', data, '节点完成判断评审已保存'); };
    }
    async function openDocumentReviewModal(document) {
      openModal('<h2>读取文档正文</h2><div class="empty">正在加载…</div>');
      try {
        const response = await fetch(`/api/document?selector=${encodeURIComponent(document.id)}`);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || response.statusText);
        const current = body.document;
        const pending = (current.governance_items || []).filter(item => ['PENDING','ACTIVE'].includes(item.status) && ['human-decision','external-open-question'].includes(item.kind));
        const approveOption = pending.length ? '' : '<option value="approve">认可当前正文</option>';
        const pendingNotice = pending.length ? `<div class="notice"><strong>还不能评为通过。</strong> 文档仍有 ${pending.length} 个问题或工程决定待处理：${escapeHtml(pending.map(item => item.id).join('、'))}。</div>` : '';
        openModal(`<h2>查看并评审文档</h2><p><span class="mono">${escapeHtml(current.path)}</span> · 正文版本 ${current.semantic_revision}。请先阅读正文和待处理问题，再给出结论。</p>${pendingNotice}<pre class="document-preview">${escapeHtml(body.content)}</pre><form id="document-review-form"><div class="field"><label>结论</label><select name="verdict">${approveOption}<option value="modify">要求修改正文</option><option value="clarify">要求进一步说明</option><option value="reject">不同意当前正文</option></select></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>评审说明</label><textarea name="notes" placeholder="说明认可的范围，或明确需要修改、回答的问题" required></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn primary">提交文档评审</button></div></form>`);
        $('#document-review-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.document = current.id; rememberReviewer(data.reviewer); await post('/api/reviews/document', data, '文档评审已保存'); };
      } catch (error) { closeModal(); toast(`读取文档失败：${error}`, true); }
    }
    function openWaiveModal(n) {
      openModal(`<h2>接受未满足项</h2><p>接受例外不等于验证通过。请确认风险、依据和影响；该操作会把节点标记为已接受例外。</p><form id="waive-form"><div class="field"><label>节点</label><input value="${escapeHtml(n.id)}" disabled></div><div class="field"><label>评审人</label><input name="reviewer" value="${escapeHtml(reviewerValue())}" required></div><div class="field"><label>理由和依据</label><textarea name="reason" required></textarea></div><div class="field"><label><input name="confirm" type="checkbox" style="width:auto" required> 我确认这是人工作出的明确工程决定</label></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>取消</button><button class="btn danger">确认接受例外</button></div></form>`);
      $('#waive-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); data.node = n.id; data.confirm = true; rememberReviewer(data.reviewer); await post('/api/waive', data, '例外决定已记录'); };
    }
    async function post(path, data, success) {
      try { const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json','X-Verif-Token':token}, body:JSON.stringify(data)}); const body = await response.json(); if (!response.ok) throw new Error(body.error || response.statusText); setSnapshot(body.snapshot); closeModal(); toast(success); }
      catch (error) { toast(String(error), true); }
    }
    $('#drawer-backdrop').onclick = event => { if (event.target === $('#drawer-backdrop')) closeDrawer(); };
    $('#modal-backdrop').onclick = event => { if (event.target === $('#modal-backdrop')) closeModal(); };
    $('#search').oninput = event => { state.query = event.target.value.trim(); if (state.workstream) renderWorkstream(workstream(state.workstream)); else if (state.query) { const match = allNodes().find(n => `${n.id} ${n.title}`.toLowerCase().includes(state.query.toLowerCase())); if (match) { state.node = match.id; renderDrawer(match.id); } } };
    $('#theme').onclick = () => { const dark = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = dark ? '' : 'dark'; localStorage.setItem('verif-theme', dark ? 'light' : 'dark'); };
    if (localStorage.getItem('verif-theme') === 'dark' || (!localStorage.getItem('verif-theme') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    initialLoad();
  </script>
</body>
</html>
