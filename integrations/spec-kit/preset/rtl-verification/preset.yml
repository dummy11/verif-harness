schema_version: "1.0"

preset:
  id: "verif-harness-rtl"
  name: "verif-harness RTL Verification"
  version: "0.3.0"
  description: "Adds Simplified Chinese RTL verification governance, traceability, and execution boundaries to Spec Kit"
  author: "verif-harness contributors"
  repository: "https://github.com/dummy11/verif-harness"
  license: "Apache-2.0"

requires:
  speckit_version: ">=0.16.4"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Replace the core constitution with a Simplified Chinese RTL verification template"
      replaces: "constitution-template"
      strategy: "replace"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Replace the core specification with a Simplified Chinese RTL verification template"
      replaces: "spec-template"
      strategy: "replace"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Replace the core plan with a Simplified Chinese RTL verification template"
      replaces: "plan-template"
      strategy: "replace"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Replace the core tasks file with a Simplified Chinese RTL verification template"
      replaces: "tasks-template"
      strategy: "replace"

    - type: "template"
      name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "Replace the core checklist with a Simplified Chinese RTL verification template"
      replaces: "checklist-template"
      strategy: "replace"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Disable monolithic implementation; verif-harness task runner owns execution"
      replaces: "speckit.implement"
      strategy: "replace"

tags:
  - "rtl-verification"
  - "systemverilog"
  - "uvm"
  - "traceability"
  - "stage-gates"
