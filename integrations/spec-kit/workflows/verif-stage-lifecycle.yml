schema_version: "1.0"
workflow:
  id: "verif-stage-lifecycle"
  name: "verif-harness Stage Lifecycle"
  version: "0.4.0"
  author: "verif-harness contributors"
  description: "以简体中文规格工件驱动一个 RTL 验证 Stage 的评审、执行与收敛"

requires:
  speckit_version: ">=0.16.4"
  integrations:
    any: ["codex", "kimi"]

inputs:
  stage:
    type: string
    required: true
    enum: ["0", "1", "2", "3", "4", "5"]
    prompt: "验证 Stage（0-5）"
  objective:
    type: string
    required: true
    prompt: "本验证 Stage 已评审的 objective"
  integration:
    type: string
    required: true
    enum: ["codex", "kimi"]
  review_constitution_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  review_spec_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  review_clarification_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  review_plan_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  review_checklist_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  review_tasks_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  authorize_execution_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  review_implementation_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  review_convergence_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]

steps:
  - id: establish-constitution
    type: if
    condition: "{{ inputs.stage == '0' }}"
    then:
      - id: constitution
        command: speckit.constitution
        integration: "{{ inputs.integration }}"
        input:
          args: "使用简体中文建立 RTL 验证宪章：verif-harness 是顶层控制面，specs/ 是唯一可编辑规格权威，DUT RTL 只读，工具证据不是审批，并保留 Human authority。代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文。"

      - id: review-constitution
        type: gate
        message: "评审 Stage 0 宪章和规格权威模型。本次文档评审不是 Stage 0 approval。"
        options: [approve, reject]
        on_reject: abort
        verdict_input: review_constitution_verdict

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "使用简体中文编写面向项目评审的 Markdown（代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文）。Stage {{ inputs.stage }} RTL 验证目标：{{ inputs.objective }}。应用 verif-harness RTL 验证合同并保持规格层级。"

  - id: review-spec
    type: gate
    message: "评审需求、权威来源、验收证据、Human Decisions 和开放问题。本 gate 只评审文档，不是 Stage approval。"
    options: [approve, reject]
    on_reject: abort
    verdict_input: review_spec_verdict

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "使用简体中文更新面向项目评审的 Markdown；代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文。只解决可以回答的歧义；把语义或权限问题记录给 Human review，不得静默假设。"

  - id: review-clarification
    type: gate
    message: "规划前评审已澄清的假设和未解决的 Human questions。"
    options: [approve, reject]
    on_reject: abort
    verdict_input: review_clarification_verdict

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "使用简体中文编写面向项目评审的 Markdown；代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文。把 Stage {{ inputs.stage }} 的每条需求映射到 verif-harness mode、owned artifact、validation、evidence contract 和 Human gate。"

  - id: review-plan
    type: gate
    message: "评审组件 ownership、Stage 范围、simulator/tool 边界、证据保留和 Human authority。"
    options: [approve, reject]
    on_reject: abort
    verdict_input: review_plan_verdict

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "使用简体中文创建 RTL 验证规格质量 checklist；代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文。不要创建实现测试列表。"

  - id: review-checklist
    type: gate
    message: "评审 checklist 是否覆盖规格质量、歧义和可验证性；本 gate 不批准实现或 Stage。"
    options: [approve, reject]
    on_reject: abort
    verdict_input: review_checklist_verdict

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "使用简体中文创建可追踪的 Stage {{ inputs.stage }} tasks；代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文。每个 task 包含 REQ/VF/TC/COV/ASRT IDs、verif-harness modes、output paths、validation、evidence 和 Human gates。对于没有 .harness-config.json 的新 Stage 0 项目，必须恰好包含一个 verif-harness init task，并给出完整 owned-output 和 validation postconditions。"

  - id: review-tasks
    type: gate
    message: "评审 task traceability、owned outputs、validation、evidence 和 Human gates；本 gate 不授权执行。"
    options: [approve, reject]
    on_reject: abort
    verdict_input: review_tasks_verdict

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "使用简体中文报告执行前的一致性、覆盖、歧义、重复权威和 task traceability 检查结果；代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文。"

  - id: authorize-execution
    type: gate
    message: "授权执行已评审 task set。这不授权修改 DUT RTL、使用 EDA、commit、push、waiver、Stage approval 或 freeze。"
    options: [approve, reject]
    on_reject: abort
    verdict_input: authorize_execution_verdict

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "只执行已评审的 Stage {{ inputs.stage }} tasks，并把每个 task 自动分发到匹配的 verif-harness mode 且仅一次。生成或更新的面向项目评审 Markdown 默认使用简体中文；代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文。保留所需证据并核对每个 task 声明的 owned output 和 validation postcondition。不得要求重复手动调用 mode；已批准的 Stage 0 init task 同样遵守此规则。"

  - id: review-implementation
    type: gate
    message: "评审已授权 tasks 的实现结果、验证输出和缺口；本 gate 不授予 Stage approval、waiver、commit 或 push 权限。"
    options: [approve, reject]
    on_reject: abort
    verdict_input: review_implementation_verdict

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "使用简体中文更新面向项目评审的收敛记录；代码、命令、路径、配置键、协议名、标准标识符和原始引用保持原文。对照已评审规格核对实现和证据，验证每个 task-owned output 和 evidence path 存在且已批准 validation command 通过。把缺失产物或其他偏差记录为 incomplete tasks 和 change requests；不得用未追踪的重复 mode 调用掩盖问题，也不得授予 approval。"

  - id: review-convergence
    type: gate
    message: "在独立的 verif-harness Stage gate review 前，评审规格漂移和证据完整性。"
    options: [approve, reject]
    on_reject: abort
    verdict_input: review_convergence_verdict
