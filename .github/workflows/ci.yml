name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Verilator and documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          python -m pip install --requirement requirements-docs.txt build 'setuptools>=77' wheel
      - name: Record tools
        run: |
          python --version
          verilator --version
      - name: Run structure, unit, and public-release checks
        run: make check
      - name: Install and verify the managed runtime and pinned integrations
        run: |
          ./scripts/setup --isolation managed --no-agent
          make check-managed
          ./scripts/managed-python -c \
            'from mcp.server.fastmcp import FastMCP; import sys; print(sys.version)'
      - name: Run executable example
        run: make example
      - name: Build documentation
        run: make docs
      - name: Build and verify distribution
        run: python scripts/package_release.py --output dist
      - name: Test installed release and project profiles
        run: |
          python scripts/fetch_release_nsim.py --output /tmp/nsim-release
          python -m pip download --dest /tmp/nsim-wheels /tmp/nsim-release/*.whl
          python scripts/test_distribution_install.py --wheel dist/*.whl \
            --nsim-wheel /tmp/nsim-release/*.whl --nsim-installer /tmp/nsim-release/nsim-install.py \
            --wheelhouse /tmp/nsim-wheels
          python verif-harness-install.py install --wheel dist/*.whl \
            --root /tmp/installed-verif --nsim-root /tmp/installed-nsim --python "$(command -v python)" \
            --nsim-wheel /tmp/nsim-release/*.whl --nsim-installer /tmp/nsim-release/nsim-install.py \
            --wheelhouse /tmp/nsim-wheels
          python scripts/test_installed_profiles.py --launcher /tmp/installed-verif/bin/verif-harness
