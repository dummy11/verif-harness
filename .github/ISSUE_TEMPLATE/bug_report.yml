name: Bug report
description: Report reproducible incorrect behavior
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include proprietary RTL, logs, paths, URLs, or credentials.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal public example and exact commands.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Tool versions
      description: Python, simulator, UVM, and operating system versions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Public-data confirmation
      description: Confirm the report contains no confidential material.
    validations:
      required: true
